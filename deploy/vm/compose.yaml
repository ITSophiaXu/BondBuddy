name: bonddraftai

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: bonddraftai:latest
    container_name: bonddraftai
    restart: unless-stopped
    ports:
      - "127.0.0.1:18766:8000"
    environment:
      BOND_AUTH_USERNAME: "${BOND_AUTH_USERNAME:?BOND_AUTH_USERNAME is required}"
      BOND_AUTH_PASSWORD: "${BOND_AUTH_PASSWORD:?BOND_AUTH_PASSWORD is required}"
      BOND_ALLOWED_HOSTS: "${BOND_PUBLIC_HOST:?BOND_PUBLIC_HOST is required}"
      BOND_TRUST_PROXY: "1"
      BOND_DATA_DIR: "/data/projects"
      BOND_CODEX_HOME: "/data/codex"
      CODEX_HOME: "/data/codex"
      BOND_CODEX_PATH: "/usr/local/bin/codex"
      BOND_CODEX_LINUX_SANDBOX: "legacy_landlock"
      BOND_CONVERSATION_WORKER_URL: "http://conversation-worker:8090"
      BOND_STANDALONE_CONVERSATIONS: "1"
      BOND_JOB_LOCK_PATH: "/data/job-lock/codex.lock"
      BOND_OCR: "tesseract"
      BOND_OCR_LANG: "chi_sim+eng"
      BOND_OCR_MAX_PAGES: "100"
      BOND_OCR_PAGE_TIMEOUT: "45"
      BOND_OCR_TOTAL_TIMEOUT: "210"
      BOND_DEMO: "0"
      BOND_SHARED_WORKSPACE: "1"
      BOND_WORKSPACE_LABEL: "Azure 共享工作区"
      BOND_PROJECT_STORAGE_LIMIT_MB: "500"
      BOND_MIN_FREE_STORAGE_MB: "1024"
      BOND_RUN_RETENTION: "3"
      BOND_MAX_CONCURRENT_JOBS: "1"
      PORT: "8000"
    volumes:
      - bond_data:/data
      - codex_data:/data/codex
      - job_lock:/data/job-lock
    depends_on:
      conversation-worker:
        condition: service_healthy
    mem_limit: 2g
    cpus: 2
    security_opt:
      - no-new-privileges:true
    stop_signal: SIGINT
    stop_grace_period: 30s

  conversation-worker:
    image: bonddraftai:latest
    container_name: bonddraftai-conversation-worker
    restart: unless-stopped
    entrypoint: ["/opt/venv/bin/python", "-X", "utf8", "-m", "backend.conversation_worker"]
    environment:
      BOND_CODEX_HOME: "/data/worker-codex"
      CODEX_HOME: "/data/worker-codex"
      BOND_CODEX_PATH: "/usr/local/bin/codex"
      BOND_CODEX_LINUX_SANDBOX: "legacy_landlock"
      BOND_CLI_TIMEOUT: "900"
      BOND_CONVERSATION_WORK_DIR: "/data/conversations"
      BOND_STANDALONE_ISOLATED: "1"
      BOND_JOB_LOCK_PATH: "/data/job-lock/codex.lock"
      BOND_RUN_RETENTION: "3"
      BOND_WORKER_PORT: "8090"
    volumes:
      - worker_codex_data:/data/worker-codex
      - conversation_runs:/data/conversations
      - job_lock:/data/job-lock
    expose:
      - "8090"
    mem_limit: 2g
    cpus: 2
    security_opt:
      - no-new-privileges:true
    stop_signal: SIGINT
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    stop_grace_period: 30s

volumes:
  bond_data:
    name: bonddraftai_data
  codex_data:
    name: bonddraftai_codex
  worker_codex_data:
    name: bonddraftai_worker_codex
  conversation_runs:
    name: bonddraftai_conversation_runs
  job_lock:
    name: bonddraftai_job_lock
