# Current production nginx routes plus a local-only synthetic cashier.
server_tokens off;
map $upstream_http_cache_control $bb_api_cache_control { "" no-store; default ""; }
map $http_x_forwarded_proto $bb_forwarded_proto { default $http_x_forwarded_proto; "" $scheme; }
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 101m;
  gzip off;
  location = /healthz {
    proxy_pass http://api:3000/health;
    access_log off;
    include /etc/nginx/conf.d/snippets/security-headers.conf;
  }
  location ~ ^/__(billing-test|prelaunch)/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $bb_forwarded_proto;
    add_header Cache-Control no-store always;
    include /etc/nginx/conf.d/snippets/security-headers.conf;
  }
  location /api/v1/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $bb_forwarded_proto;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    add_header Cache-Control $bb_api_cache_control always;
    include /etc/nginx/conf.d/snippets/security-headers.conf;
  }
  location /__legacy/api/v1/ {
    # Retired issuance entry point. Historical receipts use the current API.
    add_header Cache-Control no-store always;
    include /etc/nginx/conf.d/snippets/security-headers.conf;
    return 410;
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/conf.d/snippets/security-headers.conf;
    try_files $uri =404;
  }
  location = /admin { return 302 /admin/; }
  location /admin/ {
    etag off;
    if_modified_since off;
    add_header Cache-Control no-store always;
    include /etc/nginx/conf.d/snippets/security-headers.conf;
    try_files $uri $uri/ /admin/index.html;
  }
  location / {
    etag off;
    if_modified_since off;
    add_header Cache-Control no-store always;
    include /etc/nginx/conf.d/snippets/security-headers.conf;
    sub_filter '</body>' '<script src="/__prelaunch/browser-entry.js"></script></body>';
    sub_filter_once on;
    try_files $uri /index.html;
  }
}
