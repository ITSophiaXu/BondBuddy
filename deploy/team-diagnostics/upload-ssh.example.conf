Host bondbuddy-log-hub
    HostName REPLACE_WITH_APPROVED_HUB_PRIVATE_ADDRESS
    User REPLACE_WITH_NODE_INGEST_ACCOUNT
    IdentityFile /etc/bondbuddy-diagnostics/upload-key
    UserKnownHostsFile /etc/bondbuddy-diagnostics/known_hosts
    IdentitiesOnly yes
    StrictHostKeyChecking yes
    BatchMode yes
    ClearAllForwardings yes
    ConnectTimeout 10
