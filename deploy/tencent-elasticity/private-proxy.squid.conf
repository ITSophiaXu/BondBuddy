# Dedicated execution pool proxy. CONNECT preserves end-to-end origin TLS.
visible_hostname bondbuddy-execution-egress
http_port 10.2.0.5:3128
http_port 127.0.0.1:3128
acl execution_source src 10.73.7.0/24 127.0.0.1/32
acl connect_method method CONNECT
acl tls_port port 443
acl allowed_origin dstdomain cvm.tencentcloudapi.com sts.tencentcloudapi.com ssm.tencentcloudapi.com tag.tencentcloudapi.com myopenhands.blob.core.windows.net api.deepseek.com api.enterprise.githubcopilot.com api.github.com
http_access allow execution_source connect_method tls_port allowed_origin
http_access deny all
cache deny all
access_log none
cache_log /dev/null
cache_store_log none
pid_filename /var/run/squid/squid.pid
cache_mem 16 MB
shutdown_lifetime 1 seconds
forwarded_for delete
via off
