# Standalone execution nodes only: no API, Web, PG, parser or confirmation.
services:
  authoring:
    image: ${BB_ELASTIC_IMAGE:?immutable image digest required}
    # Each official site starts a desktop and Chromium with child processes.
    init: true
    command: [node, apps/worker/dist/runtime.js]
    user: '1000:1000'
    env_file:
      - path: ${BB_ELASTIC_SERVICE_ENV:?role-issued private environment required}
        format: raw
    environment:
      BB_WORKER_JOB_KINDS: run
      BB_FILE_AUTHORING_WORK_ROOT: /var/lib/bondbuddy/authoring-work
      BB_INTEGRITY_EGRESS_PROXY_URL: http://172.28.61.1:15435
      BB_EXECUTION_ENROLLMENT_FILE: /run/bondbuddy/enrollment/authoring.json
      BB_EXECUTION_TRANSPORT_SOCKET: /run/bondbuddy/service/transport.sock
      NODE_USE_ENV_PROXY: '1'
      HTTPS_PROXY: http://172.28.61.1:15434
      HTTP_PROXY: http://172.28.61.1:15434
      NO_PROXY: localhost,127.0.0.1,169.254.0.23,metadata.tencentyun.com,172.28.61.1,10.2.0.5
      https_proxy: http://172.28.61.1:15434
      http_proxy: http://172.28.61.1:15434
      no_proxy: localhost,127.0.0.1,169.254.0.23,metadata.tencentyun.com,172.28.61.1,10.2.0.5
      BB_WORKER_RUN_KINDS: update,generation,qa
      BB_WORKER_PARSE_SLOTS: '0'
      BB_UPLOAD_CONFIRMATION_ENABLED: '0'
      BB_PLATFORM_PROBE_ENABLED: '0'
      BB_WORKER_CONCURRENCY: '8'
      BB_MODEL_CALL_CONCURRENCY: '8'
      NODE_OPTIONS: --max-old-space-size=1024
    volumes:
      - ${BB_ELASTIC_REGISTRATION_DIR:?private enrollment required}:/run/bondbuddy/enrollment:ro
      - /run/bondbuddy/transport-socket:/run/bondbuddy/service:ro
      - type: bind
        source: /var/lib/bondbuddy/authoring-work
        target: /var/lib/bondbuddy/authoring-work
        read_only: false
        bind:
          create_host_path: false
    mem_limit: 6g
    cpus: 2
    pids_limit: 512
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true, 'seccomp=../m1/security/integrity-browser-seccomp.json', 'apparmor=bondbuddy-codex-v1']
    tmpfs: ['/tmp:size=512m,mode=1777']
    restart: 'no'
  review:
    image: ${BB_ELASTIC_REVIEW_IMAGE:?immutable review image digest required}
    command: [node, apps/worker/dist/runtime.js]
    user: '1000:1000'
    env_file:
      - path: ${BB_ELASTIC_SERVICE_ENV:?role-issued private environment required}
        format: raw
    environment:
      BB_WORKER_JOB_KINDS: run
      BB_EXECUTION_ENROLLMENT_FILE: /run/bondbuddy/enrollment/review.json
      BB_EXECUTION_TRANSPORT_SOCKET: /run/bondbuddy/service/transport.sock
      NODE_USE_ENV_PROXY: '1'
      HTTPS_PROXY: http://172.28.61.1:15434
      HTTP_PROXY: http://172.28.61.1:15434
      NO_PROXY: localhost,127.0.0.1,169.254.0.23,metadata.tencentyun.com,172.28.61.1,10.2.0.5
      https_proxy: http://172.28.61.1:15434
      http_proxy: http://172.28.61.1:15434
      no_proxy: localhost,127.0.0.1,169.254.0.23,metadata.tencentyun.com,172.28.61.1,10.2.0.5
      BB_WORKER_RUN_KINDS: review
      BB_WORKER_PARSE_SLOTS: '0'
      BB_UPLOAD_CONFIRMATION_ENABLED: '0'
      BB_PLATFORM_PROBE_ENABLED: '0'
      BB_REVIEW_ASSISTANT_SLOTS: '8'
      BB_WORKER_CONCURRENCY: '8'
      BB_MODEL_CALL_CONCURRENCY: '8'
      NODE_OPTIONS: --max-old-space-size=2048
    volumes:
      - ${BB_ELASTIC_REGISTRATION_DIR:?private enrollment required}:/run/bondbuddy/enrollment:ro
      - /run/bondbuddy/transport-socket:/run/bondbuddy/service:ro
    mem_limit: 7g
    cpus: 2
    pids_limit: 512
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true, 'seccomp=../m1/security/codex-seccomp.json', 'apparmor=bondbuddy-codex-v1']
    tmpfs: ['/tmp:size=512m,mode=1777']
    restart: 'no'
networks:
  default:
    external: true
    name: ${BB_ELASTIC_NETWORK:?reviewed private execution network required}
