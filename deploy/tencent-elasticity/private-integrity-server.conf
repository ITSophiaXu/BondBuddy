foreground = yes
pid =
debug = notice
output = /dev/null
# An independent listener leaves the model proxy and existing streams untouched.
[execution-integrity]
accept = 10.2.0.5:15435
connect = 127.0.0.1:3129
CAfile = /var/lib/bondbuddy/elastic-pg-mtls/issuer/ca.pem
cert = /var/lib/bondbuddy/elastic-pg-mtls/proxy/server.pem
key = /var/lib/bondbuddy/elastic-pg-mtls/proxy/server.key
verifyChain = yes
requireCert = yes
