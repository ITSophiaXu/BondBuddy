services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bondbuddy_local
      POSTGRES_DB: bondbuddy_local
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '127.0.0.1:55433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bondbuddy_local -d bondbuddy_local']
      interval: 2s
      retries: 30
    tmpfs: /var/lib/postgresql/data
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0
    ports:
      - '127.0.0.1:10000:10000'
    tmpfs: /data
