# Same-origin web + API. TLS terminates in front of this server (host nginx with
# certificates in production, cloudflared in staging); see docs/runbooks/m1-deploy.md.
server_tokens off;
map $upstream_http_cache_control $bb_api_cache_control { "" no-store; default ""; }
map $http_x_forwarded_proto $bb_forwarded_proto { default $http_x_forwarded_proto; "" $scheme; }
map $uri $bb_traffic_route {
  default other;
  ~^/api/v1/projects/[^/]+/workpapers/progress$ workpaper_progress;
  ~^/api/v1/projects/[^/]+/workpapers$ workpaper_workspace;
  ~^/api/v1/projects/[^/]+/file-generation/progress$ generation_progress;
  ~^/api/v1/projects/[^/]+/file-generation$ generation_workspace;
}
map $bb_traffic_route $bb_traffic_log { other 0; default 1; }
# No account/project identifiers, query strings, cookies or document text.
log_format bb_traffic escape=json '{"time":"$time_iso8601","route":"$bb_traffic_route","status":$status,"bytes":$body_bytes_sent,"seconds":$request_time,"gzip_ratio":"$gzip_ratio"}';

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 101m;
  access_log /var/log/nginx/access.log combined;
  access_log /dev/stdout bb_traffic if=$bb_traffic_log;
  # Used by both the colocated and split main-site web image. Preserve private
  # no-store policy; compress JSON at the last hop without buffering SSE.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 4;
  gzip_proxied any;
  gzip_types application/json application/javascript text/css image/svg+xml;

  # Security headers are included per location (see security-headers.conf); none are
  # declared at server level so inheritance cannot silently drop them.

  location = /healthz {
    proxy_pass http://api:3000/health;
    access_log off;
    include /etc/nginx/conf.d/snippets/security-headers.conf;
  }

  location /api/v1/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $bb_forwarded_proto;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    # The API sets its own Cache-Control on some routes (SSE: "private, no-store");
    # only fill in no-store when upstream sent none, so the header is never doubled.
    add_header Cache-Control $bb_api_cache_control always;
    include /etc/nginx/conf.d/snippets/security-headers.conf;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/conf.d/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location = /admin { return 302 /admin/; }
  location /admin/ {
    etag off;
    if_modified_since off;
    add_header Cache-Control no-store always;
    include /etc/nginx/conf.d/snippets/security-headers.conf;
    try_files $uri $uri/ /admin/index.html;
  }

  location / {
    # HTML must refresh even when reproducible archives share mtime and size.
    etag off;
    if_modified_since off;
    add_header Cache-Control no-store always;
    include /etc/nginx/conf.d/snippets/security-headers.conf;
    try_files $uri /index.html;
  }
}
