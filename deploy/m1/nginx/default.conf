# Same-origin web + API. TLS terminates in front of this server (host nginx with
# certificates in production, cloudflared in staging); see docs/runbooks/m1-deploy.md.
server_tokens off;
map $upstream_http_cache_control $bb_api_cache_control { "" no-store; default ""; }
map $http_x_forwarded_proto $bb_forwarded_proto { default $http_x_forwarded_proto; "" $scheme; }

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 101m;

  # Security headers are included per location (see security-headers.conf); none are
  # declared at server level so inheritance cannot silently drop them.

  location = /healthz {
    proxy_pass http://api:3000/health;
    access_log off;
    include /etc/nginx/conf.d/snippets/security-headers.conf;
  }

  location /api/v1/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $bb_forwarded_proto;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    # The API sets its own Cache-Control on some routes (SSE: "private, no-store");
    # only fill in no-store when upstream sent none, so the header is never doubled.
    add_header Cache-Control $bb_api_cache_control always;
    include /etc/nginx/conf.d/snippets/security-headers.conf;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/conf.d/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control no-cache always;
    include /etc/nginx/conf.d/snippets/security-headers.conf;
    try_files $uri /index.html;
  }
}
