# Same-origin web + API. TLS terminates in front of this server (host nginx with
# certificates in production, cloudflared in staging); see docs/runbooks/m1-deploy.md.
server_tokens off;
map $http_x_forwarded_proto $bb_forwarded_proto { default $http_x_forwarded_proto; "" $scheme; }

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 101m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

  location = /healthz {
    proxy_pass http://api:3000/health;
    access_log off;
  }

  location /api/v1/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $bb_forwarded_proto;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control no-cache always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    try_files $uri /index.html;
  }
}
