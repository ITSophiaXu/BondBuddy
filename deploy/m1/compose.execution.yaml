# No local database, migration job, API or web service exists in this project.
# Use scripts/role-compose.sh so unused legacy interpolation needs no main-site password.
name: ${COMPOSE_PROJECT_NAME:-bb-execution}
services:
  pg-tunnel:
    image: bondbuddy-m1-pg-tunnel:${BB_IMAGE_TAG:?fixed release version required}
    restart: unless-stopped
    environment:
      BB_PG_SSH_HOST: ${BB_PG_SSH_HOST:?set the verified SSH destination}
      BB_PG_SSH_PORT: ${BB_PG_SSH_PORT:-22}
      BB_PG_SSH_USER: ${BB_PG_SSH_USER:?set the restricted forwarding account}
      BB_PG_FORWARD_PORT: ${BB_PG_FORWARD_PORT:-15432}
    volumes:
      - type: bind
        source: ${BB_PG_SSH_KEY_FILE:?set the dedicated forwarding key file}
        target: /run/pg-ssh/key
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${BB_PG_SSH_KNOWN_HOSTS_FILE:?set the verified known_hosts file}
        target: /run/pg-ssh/known_hosts
        read_only: true
        bind: {create_host_path: false}
    networks: [backend, edge]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 5432']
      interval: 5s
      retries: 12
    deploy: {resources: {limits: {cpus: '0.25', memory: 64M}}}
  egress:
    extends: {file: compose.yaml, service: egress}
  worker:
    extends: {file: compose.yaml, service: worker}
    environment:
      DATABASE_URL: ${BB_EXECUTION_DATABASE_URL:?set a URL with host pg-tunnel and the sole business database}
      NODE_OPTIONS: --max-old-space-size=768
      BB_WORKER_LEASE_SECONDS: ${BB_WORKER_LEASE_SECONDS:-120}
      BB_WORKER_CONCURRENCY: ${BB_AUTHORING_WORKER_CONCURRENCY:-2}
      BB_WORKER_INTERACTIVE_SLOTS: ${BB_AUTHORING_INTERACTIVE_SLOTS:-1}
      BB_MODEL_CALL_CONCURRENCY: ${BB_MODEL_CALL_CONCURRENCY:-6}
      BB_MODEL_EXECUTION_HOST_ID: ${BB_MODEL_EXECUTION_HOST_ID:-}
      BB_UPLOAD_CONFIRMATION_ENABLED: '0'
    depends_on: !override
      pg-tunnel: {condition: service_healthy}
      egress: {condition: service_started}
    deploy: {resources: {limits: {cpus: '0.75', memory: 2G}}}
  worker-review:
    extends: {file: compose.yaml, service: worker-review}
    environment:
      DATABASE_URL: ${BB_EXECUTION_DATABASE_URL:?set a URL with host pg-tunnel and the sole business database}
      NODE_OPTIONS: --max-old-space-size=768
      BB_WORKER_LEASE_SECONDS: ${BB_WORKER_LEASE_SECONDS:-120}
      BB_WORKER_CONCURRENCY: ${BB_REVIEW_WORKER_CONCURRENCY:-2}
      BB_REVIEW_ASSISTANT_SLOTS: ${BB_REVIEW_ASSISTANT_SLOTS:-1}
      BB_MODEL_CALL_CONCURRENCY: ${BB_MODEL_CALL_CONCURRENCY:-6}
      BB_MODEL_EXECUTION_HOST_ID: ${BB_MODEL_EXECUTION_HOST_ID:-}
      BB_UPLOAD_CONFIRMATION_ENABLED: '0'
    depends_on: !override
      pg-tunnel: {condition: service_healthy}
      egress: {condition: service_started}
    deploy: {resources: {limits: {cpus: '0.75', memory: 2G}}}
  worker-parse:
    extends: {file: compose.yaml, service: worker-parse}
    profiles: ['${BB_ROLE_PARSE_PROFILE:-bb-parse-active}']
    environment:
      DATABASE_URL: ${BB_EXECUTION_DATABASE_URL:?set a URL with host pg-tunnel and the sole business database}
      NODE_OPTIONS: --max-old-space-size=320
      BB_WORKER_LEASE_SECONDS: ${BB_WORKER_LEASE_SECONDS:-120}
      BB_WORKER_CONCURRENCY: '1'
      BB_UPLOAD_CONFIRMATION_ENABLED: '0'
    depends_on: !override
      pg-tunnel: {condition: service_healthy}
      egress: {condition: service_started}
    deploy:
      replicas: ${BB_ROLE_PARSE_REPLICAS:-1}
      resources: {limits: {cpus: '0.5', memory: 1G}}
networks:
  backend:
    internal: true
    ipam: {config: [{subnet: "${BB_BACKEND_SUBNET:-10.231.0.0/24}"}]}
  edge: {}
volumes:
  parsestaging:
  reviewstaging:
  materialstaging:
