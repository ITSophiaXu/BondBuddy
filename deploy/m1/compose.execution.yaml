# No local database, migration job, API or web service exists in this project.
# Use scripts/role-compose.sh so unused legacy interpolation needs no main-site password.
name: ${COMPOSE_PROJECT_NAME:-bb-execution}
services:
  pg-tunnel:
    image: bondbuddy-m1-pg-tunnel:${BB_IMAGE_TAG:?fixed release version required}
    restart: unless-stopped
    environment:
      BB_PG_SSH_HOST: ${BB_PG_SSH_HOST:?set the verified SSH destination}
      BB_PG_SSH_PORT: ${BB_PG_SSH_PORT:-22}
      BB_PG_SSH_USER: ${BB_PG_SSH_USER:?set the restricted forwarding account}
      BB_PG_FORWARD_PORT: ${BB_PG_FORWARD_PORT:-15432}
    volumes:
      - type: bind
        source: ${BB_PG_SSH_KEY_FILE:?set the dedicated forwarding key file}
        target: /run/pg-ssh/key
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${BB_PG_SSH_KNOWN_HOSTS_FILE:?set the verified known_hosts file}
        target: /run/pg-ssh/known_hosts
        read_only: true
        bind: {create_host_path: false}
    networks: [backend, edge]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 5432']
      interval: 5s
      retries: 12
    deploy: {resources: {limits: {cpus: '0.25', memory: 64M}}}
  egress:
    extends: {file: compose.yaml, service: egress}
  worker:
    extends: {file: compose.yaml, service: worker}
    environment:
      DATABASE_URL: ${BB_EXECUTION_DATABASE_URL:?set a URL with host pg-tunnel and the sole business database}
      NODE_OPTIONS: --max-old-space-size=768
      BB_WORKER_LEASE_SECONDS: ${BB_WORKER_LEASE_SECONDS:-120}
      BB_WORKER_CONCURRENCY: '1'
      BB_UPLOAD_CONFIRMATION_ENABLED: '0'
    depends_on: !override
      pg-tunnel: {condition: service_healthy}
      egress: {condition: service_started}
    deploy: {resources: {limits: {cpus: '0.75', memory: 2G}}}
  worker-review:
    extends: {file: compose.yaml, service: worker-review}
    environment:
      DATABASE_URL: ${BB_EXECUTION_DATABASE_URL:?set a URL with host pg-tunnel and the sole business database}
      NODE_OPTIONS: --max-old-space-size=768
      BB_WORKER_LEASE_SECONDS: ${BB_WORKER_LEASE_SECONDS:-120}
      BB_WORKER_CONCURRENCY: '1'
      BB_UPLOAD_CONFIRMATION_ENABLED: '0'
    depends_on: !override
      pg-tunnel: {condition: service_healthy}
      egress: {condition: service_started}
    deploy: {resources: {limits: {cpus: '0.75', memory: 2G}}}
  # Separate confirmation consumer: no model environment or credential mounts.
  upload-confirmation:
    image: bondbuddy-m1-upload-confirmation:${BB_IMAGE_TAG:?fixed release version required}
    profiles: ['${BB_ROLE_CONFIRMATION_PROFILE:-bb-confirmation-inactive}']
    restart: unless-stopped
    user: '1000:1000'
    command: [node, apps/worker/dist/upload-confirmation-runtime.js]
    environment:
      DATABASE_URL: ${BB_EXECUTION_DATABASE_URL:?set a URL with host pg-tunnel and the sole business database}
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:?set in private env}
      BB_UPLOAD_CONFIRMATION_ENABLED: '1'
      BB_UPLOAD_CONFIRMATION_LANE: ${BB_ROLE_CONFIRMATION_LANE:-general}
      BB_UPLOAD_CONFIRMATION_SMALL_SLOT: ${BB_UPLOAD_CONFIRMATION_SMALL_SLOT:-0}
      BB_UPLOAD_CONFIRMATION_CONCURRENCY: ${BB_UPLOAD_CONFIRMATION_CONCURRENCY:-1}
      BB_UPLOAD_CONFIRMATION_CONTAINER: ${BB_UPLOAD_CONFIRMATION_CONTAINER:-bondbuddy-private}
      BB_UPLOAD_SPOOL_DIR: /var/lib/bondbuddy/upload-confirmation
      BB_UPLOAD_SPOOL_MAX_BYTES: ${BB_UPLOAD_CONFIRMATION_SPOOL_MAX_BYTES:-134217728}
      NODE_OPTIONS: --max-old-space-size=${BB_UPLOAD_CONFIRMATION_HEAP_MB:-320}
      HTTPS_PROXY: http://egress:3128
      https_proxy: http://egress:3128
      NO_PROXY: pg-tunnel,localhost,127.0.0.1
      no_proxy: pg-tunnel,localhost,127.0.0.1
    volumes:
      - type: bind
        source: ${BB_UPLOAD_CONFIRMATION_SPOOL_HOST_DIR:-/var/lib/bondbuddy/confirmation-disabled}
        target: /var/lib/bondbuddy/upload-confirmation
        bind: {create_host_path: false}
    networks: [backend]
    depends_on:
      pg-tunnel: {condition: service_healthy}
      egress: {condition: service_started}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    stop_grace_period: 10m
    deploy:
      replicas: ${BB_ROLE_CONFIRMATION_REPLICAS:-0}
      resources: {limits: {cpus: '${BB_UPLOAD_CONFIRMATION_CPU_LIMIT:-0.5}', memory: '${BB_UPLOAD_CONFIRMATION_MEMORY_LIMIT:-512M}'}}
  worker-parse:
    extends: {file: compose.yaml, service: worker-parse}
    profiles: ['${BB_ROLE_PARSE_PROFILE:-bb-parse-active}']
    environment:
      DATABASE_URL: ${BB_EXECUTION_DATABASE_URL:?set a URL with host pg-tunnel and the sole business database}
      NODE_OPTIONS: --max-old-space-size=320
      BB_WORKER_LEASE_SECONDS: ${BB_WORKER_LEASE_SECONDS:-120}
      BB_WORKER_CONCURRENCY: '1'
      BB_UPLOAD_CONFIRMATION_ENABLED: '0'
    depends_on: !override
      pg-tunnel: {condition: service_healthy}
      egress: {condition: service_started}
    deploy:
      replicas: ${BB_ROLE_PARSE_REPLICAS:-1}
      resources: {limits: {cpus: '0.5', memory: 1G}}
networks:
  backend:
    internal: true
    ipam: {config: [{subnet: "${BB_BACKEND_SUBNET:-10.231.0.0/24}"}]}
  edge: {}
volumes:
  parsestaging:
  reviewstaging:
  materialstaging:
