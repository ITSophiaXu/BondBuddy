# BondBuddy M1 stack: PostgreSQL 16, private Blob (Azurite in staging), migrate job, api, worker,
# allow-list egress proxy and nginx. Production capacity is in compose.prod.yaml. Secrets come only from the
# untracked .env next to this file (see .env.example for names). Images are built by scripts/deploy.sh.
name: ${COMPOSE_PROJECT_NAME:-bb-m1}

x-db-url: &db-url postgresql://bondbuddy:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/bondbuddy
x-blob: &blob ${AZURE_STORAGE_CONNECTION_STRING:?set in .env}

x-bb-policy-env: &bb-policy-env
  BB_READY_WORKER_GROUPS: authoring,review,parse
  BB_DEPLOYMENT_TIER: ${BB_DEPLOYMENT_TIER:-production}
  BB_NON_PRODUCTION_TEST_CHANNEL: ${BB_NON_PRODUCTION_TEST_CHANNEL:-disabled}
  # Shared by API and all worker groups, including prod/optional overlays.
  # Current automatic policy is mandatory; install the same release and migrations together.
  # Payment merchant configuration remains independent.
  BB_SUBSCRIPTION_BILLING_ENABLED: '1'
  # Trial guard (#35, docs/runbooks/m1-trial-operations.md). NODE_ENV=production in the image turns the guard on.
  BB_TRIAL_GUARD: ${BB_TRIAL_GUARD:-on}
  BB_TRIAL_SOURCE_SALT: ${BB_TRIAL_SOURCE_SALT:?set a random per-environment value in .env}
  BB_TRIAL_KILL_SWITCH: ${BB_TRIAL_KILL_SWITCH:-}
  BB_TRIAL_DAY_TIME_ZONE: ${BB_TRIAL_DAY_TIME_ZONE:-Asia/Shanghai}
  BB_TRIAL_MODEL_TOKENS_PER_USER_PER_DAY: ${BB_TRIAL_MODEL_TOKENS_PER_USER_PER_DAY:-2000000}
  # Data lifecycle (#6, #79). The values are the published M1 trial policy; see docs/acceptance/M1-01.md.
  BB_STORAGE_PURGE_ENABLED: ${BB_STORAGE_PURGE_ENABLED:-true}
  BB_STORAGE_MATERIAL_RETENTION_DAYS: ${BB_STORAGE_MATERIAL_RETENTION_DAYS:-7}
  BB_STORAGE_ORPHAN_GRACE_HOURS: ${BB_STORAGE_ORPHAN_GRACE_HOURS:-24}
  BB_LOG_CONTENT_RETENTION_DAYS: ${BB_LOG_CONTENT_RETENTION_DAYS:-180}
  BB_BACKUP_RETENTION_DAYS: ${BB_BACKUP_RETENTION_DAYS:-30}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: bondbuddy
      POSTGRES_DB: bondbuddy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bondbuddy -d bondbuddy']
      interval: 5s
      retries: 30
    deploy: {resources: {limits: {cpus: '1.0', memory: 768M}}}

  # STAGING ONLY: Azurite stands in for the private Azure Blob account. Production omits this
  # service (compose --profile) and points AZURE_STORAGE_CONNECTION_STRING at Azure Blob.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    profiles: [staging-blob]
    restart: unless-stopped
    command: azurite-blob --blobHost 0.0.0.0 --location /data --skipApiVersionCheck --disableProductStyleUrl
    volumes: [blobdata:/data]
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 10000 || exit 1']
      interval: 5s
      retries: 30
    deploy: {resources: {limits: {cpus: '0.5', memory: 256M}}}

  migrate:
    image: bondbuddy-m1-api:${BB_IMAGE_TAG:?set by deploy.sh}
    command: ['node', 'db/migrate.mjs']
    environment: {DATABASE_URL: *db-url}
    networks: [backend]
    depends_on: {postgres: {condition: service_healthy}}
    restart: 'no'
    deploy: {resources: {limits: {cpus: '0.5', memory: 256M}}}

  api:
    # Stop starting reconciliation work, then allow the bounded in-flight query/recovery to finish.
    stop_grace_period: 90s
    image: bondbuddy-m1-api:${BB_IMAGE_TAG:?set by deploy.sh}
    restart: unless-stopped
    environment:
      <<: *bb-policy-env
      DATABASE_URL: *db-url
      BB_DIRECT_BLOB_UPLOADS: ${BB_DIRECT_BLOB_UPLOADS:-0}
      AZURE_STORAGE_CONNECTION_STRING: *blob
      BB_BLOB_BACKUP_CONTAINERS: ${BB_BLOB_BACKUP_CONTAINERS:-}
      BB_BACKUP_CONTAINER: ${BB_BACKUP_CONTAINER:-bb-backups}
      BB_LOG_ARCHIVE_CONTAINER: ${BB_LOG_ARCHIVE_CONTAINER:-bondbuddy-private}
      BB_LIBRARY_CONTAINER: ${BB_LIBRARY_CONTAINER:-bondbuddy-private}
      BB_ALLOWED_ORIGIN: ${BB_PUBLIC_ORIGIN:?set in .env}
      BB_PREPROD_WORKING_DRAFT_EXPIRES_AT: ${BB_PREPROD_WORKING_DRAFT_EXPIRES_AT:-}
      BB_PREPROD_WORKING_DRAFT_TAXONOMY_HASH: ${BB_PREPROD_WORKING_DRAFT_TAXONOMY_HASH:-}
      BB_PREPROD_WORKING_DRAFT_RULE_PACK_HASH: ${BB_PREPROD_WORKING_DRAFT_RULE_PACK_HASH:-}
      BB_PREPROD_WORKING_DRAFT_STAGE: ${BB_PREPROD_WORKING_DRAFT_STAGE:-}
      BB_PREPROD_WORKING_DRAFT_AS_OF: ${BB_PREPROD_WORKING_DRAFT_AS_OF:-}
      BB_UPLOAD_EXCEPTION_ENABLED: ${BB_UPLOAD_EXCEPTION_ENABLED:-0}
      BB_UPLOAD_EXCEPTION_SCOPE: ${BB_UPLOAD_EXCEPTION_SCOPE:-}
      # #17: run submission commits durable jobs for the deployed WorkerRuntime to claim.
      BB_RUN_RUNTIME_ENABLED: '1'
      # Historical flags cannot restore fixed/manual new-task pricing.
      BB_PAID_AUTHORING_ENABLED: '1'
      BB_PAID_REVIEW_ENABLED: '1'
      BB_OUTCOME_PRICING_ENABLED: '1'
      BB_WECHAT_PAY_ENABLED: ${BB_WECHAT_PAY_ENABLED:-0}
      BB_WECHAT_PAY_MERCHANT_ID: ${BB_WECHAT_PAY_MERCHANT_ID:-}
      BB_WECHAT_PAY_APP_ID: ${BB_WECHAT_PAY_APP_ID:-}
      BB_WECHAT_PAY_MERCHANT_CERT_SERIAL: ${BB_WECHAT_PAY_MERCHANT_CERT_SERIAL:-}
      BB_WECHAT_PAY_PRIVATE_KEY_FILE: ${BB_WECHAT_PAY_PRIVATE_KEY_FILE:-}
      BB_WECHAT_PAY_API_V3_KEY_FILE: ${BB_WECHAT_PAY_API_V3_KEY_FILE:-}
      BB_WECHAT_PAY_PLATFORM_KEYS_FILE: ${BB_WECHAT_PAY_PLATFORM_KEYS_FILE:-}
      BB_WECHAT_PAY_NOTIFY_URL: ${BB_WECHAT_PAY_NOTIFY_URL:-}
      BB_WECHAT_PAY_REFUND_ENABLED: ${BB_WECHAT_PAY_REFUND_ENABLED:-0}
      BB_WECHAT_PAY_REFUND_NOTIFY_URL: ${BB_WECHAT_PAY_REFUND_NOTIFY_URL:-}
      BB_WECHAT_PAY_TIMEOUT_MS: ${BB_WECHAT_PAY_TIMEOUT_MS:-10000}
      BB_WECHAT_PAY_STATEMENTS_ENABLED: ${BB_WECHAT_PAY_STATEMENTS_ENABLED:-0}
      BB_WECHAT_PAY_STATEMENT_ACCOUNTS: ${BB_WECHAT_PAY_STATEMENT_ACCOUNTS:-BASIC}
      BB_ALIPAY_PAY_ENABLED: ${BB_ALIPAY_PAY_ENABLED:-0}
      BB_ALIPAY_ENVIRONMENT: ${BB_ALIPAY_ENVIRONMENT:-production}
      BB_ALIPAY_APP_ID: ${BB_ALIPAY_APP_ID:-}
      BB_ALIPAY_SELLER_ID: ${BB_ALIPAY_SELLER_ID:-}
      BB_ALIPAY_WEB_PRODUCT: ${BB_ALIPAY_WEB_PRODUCT:-}
      BB_ALIPAY_APP_PRIVATE_KEY_FILE: ${BB_ALIPAY_APP_PRIVATE_KEY_FILE:-}
      BB_ALIPAY_APP_PRIVATE_KEY_TYPE: ${BB_ALIPAY_APP_PRIVATE_KEY_TYPE:-}
      BB_ALIPAY_PUBLIC_KEY_FILE: ${BB_ALIPAY_PUBLIC_KEY_FILE:-}
      BB_ALIPAY_NOTIFY_URL: ${BB_ALIPAY_NOTIFY_URL:-}
      BB_ALIPAY_RETURN_URL: ${BB_ALIPAY_RETURN_URL:-}
      BB_ALIPAY_REFUND_ENABLED: ${BB_ALIPAY_REFUND_ENABLED:-0}
      BB_ALIPAY_PAY_TIMEOUT_MS: ${BB_ALIPAY_PAY_TIMEOUT_MS:-10000}
      BB_ALIPAY_PAY_STATEMENTS_ENABLED: ${BB_ALIPAY_PAY_STATEMENTS_ENABLED:-0}
      # Native payment requests use Node fetch. Require the verified Node proxy runtime
      # from docs/runbooks/m1-deploy.md; the internal network still has no direct route.
      NODE_USE_ENV_PROXY: '1'
      HTTPS_PROXY: http://egress:3128
      https_proxy: http://egress:3128
      NO_PROXY: ${BB_NO_PROXY:-postgres,azurite,api,localhost,127.0.0.1}
      no_proxy: ${BB_NO_PROXY:-postgres,azurite,api,localhost,127.0.0.1}
      BB_TERMS_VERSION: ${BB_TERMS_VERSION:?set in .env}
      BB_SUPPORT_CONTACT: ${BB_SUPPORT_CONTACT:-}
      BB_TRUSTED_PROXY_CIDR: ${BB_WEB_IP:-10.231.0.10}/32
      # Uploads are spooled to this disk-backed volume, never to the memory-backed /tmp tmpfs.
      # The API caps in-flight spool bytes and deletes each file after the request.
      BB_UPLOAD_SPOOL_DIR: /var/lib/bondbuddy/upload-spool
      BB_UPLOAD_SPOOL_MAX_BYTES: ${BB_UPLOAD_SPOOL_MAX_BYTES:-1073741824}
    volumes:
      - uploadspool:/var/lib/bondbuddy/upload-spool
      - ${BB_PAYMENT_SECRETS_DIR:-./secrets/payments}:/run/bondbuddy-payments:ro
    networks: [backend]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      egress: {condition: service_started}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy: {resources: {limits: {cpus: '1.0', memory: 512M}}}

  worker: &worker-service
    image: bondbuddy-m1-worker:${BB_IMAGE_TAG:?set by deploy.sh}
    restart: unless-stopped
    environment: &worker-env
      <<: *bb-policy-env
      DATABASE_URL: *db-url
      AZURE_STORAGE_CONNECTION_STRING: *blob
      BB_LIBRARY_CONTAINER: ${BB_LIBRARY_CONTAINER:-bondbuddy-private}
      # #17: stage materials on disk; the /tmp tmpfs is charged to the worker memory limit and a
      # 100 MiB DOCX staged there OOM-killed the parser on the 320M production profile.
      BB_PARSE_STAGING_DIR: /var/lib/bondbuddy/parse-staging
      BB_UPLOAD_CONFIRMATION_ENABLED: '0'
      # Capacity is reserved per process; reviews cannot consume authoring slots.
      BB_WORKER_JOB_KINDS: run
      BB_WORKER_RUN_KINDS: update,generation,qa
      BB_WORKER_GROUP: authoring
      BB_WORKER_CONCURRENCY: ${BB_WORKER_CONCURRENCY:-1}
      BB_MODEL_CALL_CONCURRENCY: ${BB_MODEL_CALL_CONCURRENCY:-4}
      BB_MODEL_EXECUTION_HOST_ID: ${BB_MODEL_EXECUTION_HOST_ID:-}
      BB_WORKER_INTERACTIVE_SLOTS: ${BB_WORKER_INTERACTIVE_SLOTS:-1}
      BB_WORKER_PARSE_SLOTS: '0'
      BB_WORKER_DRAIN_MS: ${BB_WORKER_DRAIN_MS:-20000}
      # #15/#31 fact evidence review guard: off unless explicitly enabled. When on, #31 generation
      # consumes only exact current fact_evidence_reviewer decisions and excludes every other fact.
      BB_FACT_EVIDENCE_REVIEW_GATE: ${BB_FACT_EVIDENCE_REVIEW_GATE:-0}
      # #76 target-period candidate producer call in the run pipeline: off unless explicitly enabled.
      BB_TARGET_PERIOD_CANDIDATE_PRODUCER: ${BB_TARGET_PERIOD_CANDIDATE_PRODUCER:-0}
      BB_PARSE_CACHE_OCR_VERSION: ${BB_PARSE_CACHE_OCR_VERSION:?set in .env; see .env.example}
      BB_PARSE_CACHE_BASIS_VERSION: ${BB_PARSE_CACHE_BASIS_VERSION:?set in .env; see .env.example}
      # Only route out: the allow-list proxy. The backend network has no internet gateway.
      HTTPS_PROXY: http://egress:3128
      https_proxy: http://egress:3128
      NO_PROXY: postgres,azurite,api,localhost,127.0.0.1
      no_proxy: postgres,azurite,api,localhost,127.0.0.1
      # Explicit Copilot command mode reads only the worker's read-only mounted OAuth file.
      BB_CODEX_AUTH_MODE: ${BB_CODEX_AUTH_MODE:-}
      BB_COPILOT_OAUTH_FILE: /run/secrets/bb-copilot-oauth
      BB_CODEX_CREDENTIAL_ENV: ${BB_CODEX_CREDENTIAL_ENV:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      BB_CODEX_BASE_URL: ${BB_CODEX_BASE_URL:-https://api.deepseek.com}
      BB_CODEX_PROVIDER: ${BB_CODEX_PROVIDER:-deepseek}
      BB_CODEX_MODEL: ${BB_CODEX_MODEL:-}
      BB_CODEX_REASONING_EFFORT: ${BB_CODEX_REASONING_EFFORT:-}
      BB_CODEX_CONFIG_VERSION: ${BB_CODEX_CONFIG_VERSION:-}
      BB_CODEX_WORK_ROOT: /tmp/bb-codex
      # Per-call wall-clock limit. Long historical-generation segments exceed the 120 s code default.
      BB_CODEX_TIMEOUT_MS: ${BB_CODEX_TIMEOUT_MS:-600000}
      # Document authoring may legitimately take 20–30 min in one Codex execution.
      BB_CODEX_AUTHORING_TIMEOUT_MS: ${BB_CODEX_AUTHORING_TIMEOUT_MS:-18000000}
      # M3 public review: opt in only after the configured provider's real web search is verified.
      BB_REVIEW_WEB_SEARCH_ENABLED: ${BB_REVIEW_WEB_SEARCH_ENABLED:-0}
      # #994 request gateway: off (default), measure, or enforce. Enforcement requires an explicit
      # measured byte budget; no supplier limit is assumed. The review worker inherits both values.
      BB_MODEL_GATEWAY_MODE: ${BB_MODEL_GATEWAY_MODE:-off}
      BB_MODEL_MAX_REQUEST_BYTES: ${BB_MODEL_MAX_REQUEST_BYTES:-}
      # #79/#16 operator-only platform probe (POST /api/v1/admin/probes/model). Off by default.
      BB_PLATFORM_PROBE_ENABLED: ${BB_PLATFORM_PROBE_ENABLED:-0}
    volumes:
      - parsestaging:/var/lib/bondbuddy/parse-staging
      # /dev/null is an inert default. Set a private host file only for Copilot mode.
      - ${BB_COPILOT_OAUTH_HOST_FILE:-/dev/null}:/run/secrets/bb-copilot-oauth:ro
    networks: [backend]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      egress: {condition: service_started}
    read_only: true
    tmpfs: [/tmp]
    # Compose's default 10 s is shorter than the drain window; SIGKILL would skip lease release.
    stop_grace_period: 30s
    security_opt: [no-new-privileges:true, "seccomp=./security/codex-seccomp.json", "apparmor=bondbuddy-codex-v1"]
    cap_drop: [ALL]
    deploy: {resources: {limits: {cpus: '1.0', memory: 768M}}}

  worker-review:
    <<: *worker-service
    environment:
      <<: *worker-env
      BB_WORKER_RUN_KINDS: review
      BB_WORKER_GROUP: review
      BB_WORKER_INTERACTIVE_SLOTS: '0'
      BB_WORKER_CONCURRENCY: ${BB_REVIEW_WORKER_CONCURRENCY:-1}
      BB_REVIEW_ASSISTANT_SLOTS: ${BB_REVIEW_ASSISTANT_SLOTS:-1}
      BB_PLATFORM_PROBE_ENABLED: '0'
    volumes:
      - reviewstaging:/var/lib/bondbuddy/parse-staging
      - ${BB_COPILOT_OAUTH_HOST_FILE:-/dev/null}:/run/secrets/bb-copilot-oauth:ro

  worker-parse:
    <<: *worker-service
    environment:
      <<: *worker-env
      BB_WORKER_JOB_KINDS: parse
      BB_WORKER_GROUP: parse
      BB_WORKER_INTERACTIVE_SLOTS: '0'
      BB_WORKER_CONCURRENCY: ${BB_PARSE_WORKER_CONCURRENCY:-1}
      BB_PLATFORM_PROBE_ENABLED: '0'
    volumes:
      - materialstaging:/var/lib/bondbuddy/parse-staging
      - ${BB_COPILOT_OAUTH_HOST_FILE:-/dev/null}:/run/secrets/bb-copilot-oauth:ro

  # #79/#35 ops scheduler: log forwarding + health, storage/deletion purge, trial-guard health and
  # worker heartbeat staleness, each under a PostgreSQL lease (0028) so extra replicas never double-run.
  # Archive mode requires migration 0041 and a private Blob container. Keep disabled until #226
  # and this branch are integrated and the old scheduler has stopped.
  ops:
    image: bondbuddy-m1-worker:${BB_IMAGE_TAG:?set by deploy.sh}
    restart: unless-stopped
    command: ['node', 'apps/worker/dist/ops-scheduler.js']
    environment:
      <<: *bb-policy-env
      DATABASE_URL: *db-url
      AZURE_STORAGE_CONNECTION_STRING: *blob
      NODE_OPTIONS: --max-old-space-size=256
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      BB_CODEX_PROVIDER: ${BB_CODEX_PROVIDER:-deepseek}
      BB_OPS_PROVIDER_BALANCE: ${BB_OPS_PROVIDER_BALANCE:-on}
      BB_OPS_PROVIDER_BALANCE_SECONDS: ${BB_OPS_PROVIDER_BALANCE_SECONDS:-300}
      BB_PROVIDER_BALANCE_THRESHOLD_USD: ${BB_PROVIDER_BALANCE_THRESHOLD_USD:-1}
      BB_LOG_SINK_FILE: ${BB_LOG_SINK_FILE:-/var/lib/bb-logs/observability.ndjson}
      BB_LOG_SINK_MAX_BYTES: ${BB_LOG_SINK_MAX_BYTES:-67108864}
      BB_LOG_ARCHIVE_ENABLED: ${BB_LOG_ARCHIVE_ENABLED:-0}
      BB_LOG_ARCHIVE_LOCAL_MAX_BYTES: ${BB_LOG_ARCHIVE_LOCAL_MAX_BYTES:-268435456}
      BB_LOG_ARCHIVE_CONTAINER: ${BB_LOG_ARCHIVE_CONTAINER:-bondbuddy-private}
      BB_LOG_ARCHIVE_RETENTION_DAYS: ${BB_LOG_ARCHIVE_RETENTION_DAYS:-180}
      BB_LIBRARY_CONTAINER: ${BB_LIBRARY_CONTAINER:-bondbuddy-private}
      BB_BACKUP_CONTAINER: ${BB_BACKUP_CONTAINER:-bb-backups}
      BB_OPS_PARSE_BACKFILL: ${BB_OPS_PARSE_BACKFILL:-off}
      # #78 scheduled library sync (off by default; raise this service's memory limit before enabling).
      BB_OPS_LIBRARY_SYNC: ${BB_OPS_LIBRARY_SYNC:-off}
      # Node 22 fetch reads HTTPS_PROXY/NO_PROXY only when environment proxy support is enabled.
      NODE_USE_ENV_PROXY: '1'
      # Production Blob is reached through the allow-list proxy, like the worker.
      HTTPS_PROXY: http://egress:3128
      https_proxy: http://egress:3128
      NO_PROXY: ${BB_NO_PROXY:-postgres,azurite,api,localhost,127.0.0.1}
      no_proxy: ${BB_NO_PROXY:-postgres,azurite,api,localhost,127.0.0.1}
    volumes: [logsink:/var/lib/bb-logs]
    networks: [backend]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      egress: {condition: service_started}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    deploy: {resources: {limits: {cpus: '0.5', memory: 384M}}}

  egress:
    image: bondbuddy-m1-egress:${BB_IMAGE_TAG:?set by deploy.sh}
    restart: unless-stopped
    environment:
      BB_EGRESS_ALLOW: ${BB_EGRESS_ALLOW:-api.deepseek.com}
    networks: [backend, edge]
    read_only: true
    tmpfs: [/tmp, /var/run/squid, /var/cache/squid, /var/log/squid]
    security_opt: [no-new-privileges:true]
    deploy: {resources: {limits: {cpus: '0.25', memory: 96M}}}

  web:
    image: bondbuddy-m1-web:${BB_IMAGE_TAG:?set by deploy.sh}
    restart: unless-stopped
    ports: ['${BB_BIND_ADDR:-127.0.0.1}:${BB_HTTP_PORT:-18080}:8080']
    networks:
      backend: {ipv4_address: "${BB_WEB_IP:-10.231.0.10}"}
      edge: {}
    depends_on:
      api: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1']
      interval: 10s
      retries: 6
    deploy: {resources: {limits: {cpus: '0.5', memory: 128M}}}

networks:
  backend:
    internal: true
    # Must not overlap other Docker networks on the host (set BB_BACKEND_SUBNET/BB_WEB_IP).
    ipam: {config: [{subnet: "${BB_BACKEND_SUBNET:-10.231.0.0/24}"}]}
  edge: {}

volumes:
  pgdata:
  blobdata:
  logsink:
  uploadspool:
  parsestaging:
  reviewstaging:
  materialstaging:
