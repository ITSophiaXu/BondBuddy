<script>
(() => {
  const root = document.getElementById('bb-update-preview');
  const $ = selector => root.querySelector(selector);
  const esc = text => String(text ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const steps = ['整理项目材料','核对报告期与发行要求','更新财务与业务章节','检查全文一致性','生成 Word 成果'];
  const titles = ['正在读取项目材料','正在核对更新目标','正在更新财务与业务章节','正在检查全文一致性','正在生成 Word'];
  const details = ['历史募集书、审计报告及附注','2023—2025 年 · 上交所普通私募','已完成 8 / 12 个章节','核对数字、条款、期间及交叉引用','修订版、清洁版和更新说明'];
  const state = { phase:'running', step:2, version:1, supplied:false, deferred:false, pending:false, messages:[], source:'historical' };
  const design = { progress:'详细步骤', chatWidth:282, source:'有历史募集书' };
  let timer = null;
  let playing = false;
  let lastSaved = '';
  const phaseLabels = {ready:'待开始',running:'正在更新',needs:'待补充材料',paused:'已停止',complete:'已完成'};
  const phaseIcons = {ready:'circle',running:'loader-circle',needs:'circle-alert',paused:'pause',complete:'check'};
  function restore(snapshot) {
    const data = snapshot?.privateContent;
    if (!data || data.kind !== 'bondbuddy-workspace-v1') return;
    if (Object.hasOwn(phaseLabels, data.phase)) state.phase = data.phase;
    state.step = Math.max(0, Math.min(4, Number(data.step) || 0));
    state.version = Math.max(1, Math.min(9, Number(data.version) || 1));
    state.supplied = !!data.supplied; state.deferred = !!data.deferred; state.pending = !!data.pending;
    state.messages = Array.isArray(data.messages) ? data.messages.filter(x => x && ['user','assistant'].includes(x.role)).slice(-4).map(x => ({role:x.role,text:String(x.text).slice(0,700)})) : [];
    if (['historical','new'].includes(data.source)) state.source = data.source;
    design.source = state.source === 'new' ? '无历史募集书' : '有历史募集书';
  }
  restore(window.openai?.widgetState);
  function save() {
    const snapshot = { modelContent:{preview:'BondBuddy 连续项目工作区',phase:phaseLabels[state.phase],source:design.source,version:state.version}, privateContent:{kind:'bondbuddy-workspace-v1',...state} };
    lastSaved = JSON.stringify(snapshot.privateContent);
    try { window.openai?.setWidgetState?.(snapshot)?.catch?.(() => {}); } catch {}
  }
  function stopClock() { clearTimeout(timer); timer = null; playing = false; }
  function message(role, text) { state.messages.push({role,text}); state.messages = state.messages.slice(-4); }
  function feedback(text) { const box=$('#bb-feedback'); box.textContent=text; box.hidden=false; }
  function files() {
    const rows = state.source === 'historical' ? [['2025 年募集说明书.docx','历史募集书 · 已保存'],['2025 年审计报告及附注.pdf','财务材料 · 已保存']] : [['2025 年审计报告及附注.pdf','财务材料 · 已保存'],['发行人补充资料.docx','项目材料 · 已保存']];
    if (state.supplied) rows.push(['2025 年末银行授信明细.xlsx','补充材料 · 已保存']);
    return rows.map(([name,label]) => `<div class="bb-file-row">${icon('file-text')}<div>${name}<small>${label}</small></div>${icon('check')}</div>`).join('');
  }
  function timeline() {
    return `<ol class="bb-step-list">${steps.map((label,i) => {
      const done = i < state.step;
      const current = i === state.step;
      const status = done ? '已完成' : current ? state.phase === 'paused' ? '已停止' : '处理中' : '等待中';
      const detail = i === 0 && state.source === 'new' ? '审计报告、附注及发行人资料' : i === 4 && state.source === 'new' ? '募集说明书初稿和编制说明' : details[i];
      return `<li class="bb-step ${done?'done':''} ${current?'current':''}"><span class="bb-step-symbol">${done?icon('check'):i+1}</span><div><div class="bb-step-title"><span>${label}</span><span>${status}</span></div>${(done||current)?`<div class="bb-step-detail">${detail}</div>`:''}${current&&i===2?'<div class="bb-step-meter" role="progressbar" aria-label="章节更新进度" aria-valuenow="8" aria-valuemin="0" aria-valuemax="12"><span></span></div>':''}</div></li>`;
    }).join('')}</ol>`;
  }
  function readyView() {
    return `<div class="bb-card"><span class="bb-label">材料与要求</span><h2>准备好，开始更新</h2><p class="bb-subline">项目信息与材料已保存。你也可以在右侧补充要求。</p><div class="bb-ready-files">${files()}</div><div class="bb-fact-row"><span>目标报告期</span><strong>2023—2025 年</strong></div><div class="bb-fact-row"><span>发行方式</span><strong>上交所普通私募公司债</strong></div><div class="bb-actions"><button class="bb-button bb-primary" data-action="start" type="button">开始更新 ${icon('arrow-right')}</button></div><p class="bb-foot-note">演示流程，不调用模型、不消耗积分。</p></div>`;
  }
  function runningView() {
    const paused=state.phase==='paused';
    return `<div class="bb-card"><span class="bb-label">第 ${state.step+1} / 5 步 · 第 ${state.version} 版</span><div class="bb-current-title">${icon(paused?'pause':'file-pen-line')}<h2>${paused?'更新已停止':titles[state.step]}</h2></div><p class="bb-subline">${paused?'已完成的处理进度保留，可以从这里继续。':'项目正在处理中，你可以查看材料或在右侧补充说明。'}</p>${timeline()}<div class="bb-actions"><button class="bb-button ${paused?'bb-primary':''}" type="button" data-action="${paused?'resume':'stop'}">${icon(paused?'play':'square')}${paused?'继续更新':'停止更新'}</button><span class="bb-secondary">${paused?'已有进度保留':'材料和进度自动保存'}</span></div></div>`;
  }
  function needsView() {
    return `<div class="bb-card"><span class="bb-label">更新进行到：偿债能力与授信情况</span><div class="bb-current-title">${icon('circle-alert')}<h2>补充一份材料后继续</h2></div><p class="bb-subline">已完成的章节保留，其他已提供材料无需重新上传。</p><div class="bb-need-card"><h3>缺少 2025 年末银行授信明细</h3><p>旧稿中的授信额度截至 2024 年末。需要新时点的授信总额、已使用及未使用额度。</p><button class="bb-button bb-primary" type="button" data-action="supply">${icon('paperclip')}补充示例材料并继续</button></div><button class="bb-text-button" type="button" data-action="defer">暂列为待补事项，继续更新 ${icon('arrow-right')}</button><p class="bb-foot-note">这项非关键缺口会保留在更新说明中。</p></div>`;
  }
  function completeView() {
    const historical=state.source==='historical';
    return `<div class="bb-card"><div class="bb-done-banner"><span class="bb-done-icon">${icon('check')}</span><div><h2>${historical?'募集书已更新':'募集书初稿已生成'}</h2><p class="bb-subline">第 ${state.version} 版已保存，可以下载审阅。</p></div></div><div class="bb-delivery"><div class="bb-doc-title"><span class="bb-doc-icon">${icon('file-text')}</span><div><h3>${historical?'募集说明书 · 更新稿':'募集说明书 · 初稿'}</h3><p>Word 文档 · v${state.version}</p></div></div><div class="bb-delivery-buttons"><button class="bb-button bb-primary" type="button" data-action="download" data-file="${historical?'修订版':'募集说明书初稿'}">${icon('download')}${historical?'下载修订版':'下载初稿'}</button>${historical?'<button class="bb-button" type="button" data-action="download" data-file="清洁版">下载清洁版</button>':''}</div></div><ul class="bb-change-list"><li>财务数据及分析已更新至 2025 年末</li><li>发行条款、资金用途与全文引用已核对</li><li>${historical?'原文修改保留修订痕迹，原文件保留':'已按本发行人资料完成各章节起草'}</li></ul>${state.deferred?'<div class="bb-inline-gap">1 项待补充：2025 年末银行授信明细，已列入更新说明。</div>':''}<button class="bb-text-button" type="button" data-action="download" data-file="${historical?'更新说明':'编制说明'}">${icon('file-text')}查看${historical?'更新说明与来源':'编制说明与来源'} ${icon('arrow-up-right')}</button><div class="bb-actions"><button class="bb-button" type="button" data-action="revise">${icon('message-square')}继续修改</button><span class="bb-secondary">下一轮生成新版本，保留当前稿</span></div></div>`;
  }
  function renderChat() {
    const initialUser = '请将报告期更新至 2025 年末，全文核对相关数据和表述。未发生变化的内容请保留。';
    const runningReplies = ['正在整理材料并核对本次更新目标。进度会一直显示在左侧。','正在核对新旧报告期和发行要求。接下来开始更新正文。','正在处理财务与业务章节。接下来会核对全文一致性，再生成 Word。','正文已处理，正在核对数字、期间、条款及全文引用。','正在生成 Word 成果。文件准备好后会直接显示在左侧。'];
    const replies = {ready:'材料已收到。你可以继续补充信息，准备好后点击左侧“开始更新”。',running:runningReplies[state.step],needs:'审计报告中没有完整的银行授信明细。请补充截至 2025 年末的授信数据；也可以先把这项列为待补，继续完成其余内容。',paused:'已停止更新，完成的章节已保存。点击“继续更新”即可接着处理。',complete:'本轮成果已保存，Word 下载在左侧。你可以继续提出修改要求，我会保留当前稿并生成下一版。'};
    const messages = [{role:'user',text:initialUser},{role:'assistant',text:replies[state.phase]},...state.messages];
    $('#bb-chat-messages').innerHTML=messages.map(m=>`<div class="bb-message ${m.role}"><div class="bb-message-label">${m.role==='assistant'?icon('sparkles')+' BondBuddy':'你'}</div><div class="bb-message-body">${esc(m.text)}</div></div>`).join('');
    $('#bb-chat-context').textContent=state.phase==='complete'?'当前成果：v'+state.version+' · 可继续修改':state.phase==='needs'?'等待补充：银行授信明细':state.phase==='running'?'本轮材料已锁定，新补充将用于下一轮':state.phase==='paused'?'已保留处理进度':'对话与材料一起保存在当前项目';
  }
  function render() {
    root.style.setProperty('--bb-chat-width',design.chatWidth+'px');
    root.classList.toggle('bb-compact',design.progress==='精简步骤');
    state.source=design.source==='无历史募集书'?'new':'historical';
    $('#bb-source-label').textContent=state.source==='historical'?'基于历史募集书更新':'依据发行人资料编制';
    $('#bb-file-count').textContent=(state.supplied?3:2)+' 份材料';
    const badge=$('#bb-phase-badge');badge.innerHTML=icon(phaseIcons[state.phase])+phaseLabels[state.phase];badge.classList.toggle('bb-warning',state.phase==='needs');
    root.querySelectorAll('[data-scene]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.scene===state.phase)));
    $('#bb-main-content').innerHTML=state.phase==='ready'?readyView():state.phase==='needs'?needsView():state.phase==='complete'?completeView():runningView();
    $('#bb-material-content').innerHTML=`<div class="bb-fact-row"><span>报告期</span><strong>2023—2025 年</strong></div>${files()}`;
    renderChat();
    if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});
  }
  function advance() {
    if(!playing||state.phase!=='running')return;
    if(state.step===2&&!state.supplied&&!state.deferred){state.phase='needs';stopClock();render();save();return;}
    if(state.step>=4){state.phase='complete';stopClock();render();save();return;}
    state.step++;render();timer=setTimeout(advance,2000);
  }
  function start(step=0){stopClock();state.phase='running';state.step=step;playing=true;render();save();timer=setTimeout(advance,2000);}
  function supply(){state.supplied=true;state.deferred=false;message('user','已补充：2025 年末银行授信明细.xlsx（示例材料）');message('assistant','材料已加入本轮更新，继续核对授信情况并完成剩余章节。');start(2);}
  root.addEventListener('click',event=>{
    const button=event.target.closest('button');if(!button||!root.contains(button))return;
    if(button.dataset.scene){stopClock();state.phase=button.dataset.scene;state.step=state.phase==='complete'?4:2;state.pending=false;state.messages=[];$('#bb-feedback').hidden=true;render();save();return;}
    const action=button.dataset.action;
    if(action==='send')sendMessage();
    if(action==='start'){state.pending=false;start(0);}
    if(action==='stop'){stopClock();state.phase='paused';render();save();}
    if(action==='resume')start(state.step);
    if(action==='supply')supply();
    if(action==='defer'){state.deferred=true;message('user','授信明细暂列待补，继续更新。');start(2);}
    if(action==='attach'){
      if(state.phase==='needs'){supply();return;}
      message('user','补充示例材料：2025 年末银行授信明细.xlsx');
      if(state.phase==='ready'){state.supplied=true;message('assistant','材料已加入当前项目，开始更新时会一起使用。');}
      else{state.pending=true;message('assistant',state.phase==='complete'?'已收录补充材料，点击左侧“继续修改”生成下一版。':'已收录补充材料，当前这轮继续处理，新材料将在下一轮使用。');}
      render();save();
    }
    if(action==='revise'){
      if(state.pending){state.version++;state.supplied=true;state.pending=false;message('assistant','开始生成 v'+state.version+'，当前版本保留。');start(2);}
      else{$('#bb-chat-input').focus();feedback('在右侧写下修改要求并发送，再点击“继续修改”。');}
    }
    if(action==='download')feedback('已点击“'+button.dataset.file+'”。这是交互演示，未生成真实募集书文件；正式产品将在这里下载 Word。');
  });
  function sendMessage(){
    const input=$('#bb-chat-input');const text=input.value.trim();if(!text)return;
    message('user',text);input.value='';state.pending=true;
    message('assistant',state.phase==='complete'?'修改要求已记录。点击左侧“继续修改”生成下一版，当前成果会保留。':state.phase==='ready'?'已加入项目要求，开始更新时会一并处理。':state.phase==='needs'?'说明已记录。请补充左侧所需材料，或选择暂列待补后继续。':'已收录这条补充。本轮继续处理，补充要求将在下一轮修改时使用。');
    render();save();
  }
  $('#bb-chat-form').addEventListener('submit',event=>{event.preventDefault();sendMessage();});
  window.addEventListener('openai:set_globals',event=>{const snapshot=event.detail?.globals?.widgetState;if(snapshot&&JSON.stringify(snapshot.privateContent)!==lastSaved){stopClock();restore(snapshot);render();}});
  render();
  if(globalThis.Tweak){const tweak=new globalThis.Tweak({container:root,onChange:()=>{render();save();}});tweak.addSelect(design,'progress',{label:'进度信息',options:['详细步骤','精简步骤']});tweak.addSlider(design,'chatWidth',{label:'对话区域宽度',min:250,max:330,step:10,unit:'px'});tweak.addSelect(design,'source',{label:'项目材料',options:['有历史募集书','无历史募集书']});}
})();
</script>
