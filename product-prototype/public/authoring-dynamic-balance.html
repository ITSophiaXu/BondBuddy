<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>募集书动态积分 · 交互原型</title>
<style>body{margin:0;background:#f7f8f2;color:#173e35;font:15px/1.7 system-ui,sans-serif}main{max-width:960px;margin:70px auto;padding:20px}nav{display:flex;gap:12px;margin:20px 0;flex-wrap:wrap}button,a{font:inherit;border:1px solid #dce4dd;padding:10px 18px;border-radius:8px;background:white;color:inherit;cursor:pointer;text-decoration:none}.panel{background:#fff;padding:28px;border:1px solid #dce4dd;border-radius:16px}h2{font-size:24px}p{color:#62786e}.log{border-left:2px solid #dce4dd;padding:10px 20px;margin:24px 0}.meter{background:#f4f7ef;padding:24px;border:1px solid #dde6d8;border-radius:16px}.meter strong{display:block;font-size:32px}small{font-size:14px}dialog{max-width:480px;width:calc(100% - 40px);box-sizing:border-box;border:1px solid #dce4dd;border-radius:16px;padding:28px;color:#173e35}dialog::backdrop{background:rgb(15 35 29 / 38%)}.primary{background:#173e35;color:white}footer{color:#7a8b80;margin:25px 0;font-size:12px}</style>
<main><h1>募集书全文更新</h1><nav><button onclick="show('running')">运行中</button><button onclick="show('exhausted')">积分用完</button><button onclick="show('resumed')">充值后继续</button></nav><section class="panel"><h2 id="title"></h2><p id="status"></p><div class="log">已完成目录核对<br>正在更新财务章节</div><section class="meter"><span>当前已消耗</span><strong>1 <small>积分</small></strong><p id="balance"></p><details><summary>计费说明</summary>有积分即可开始，按服务端有效处理时间和已完成工作扣减；排队和暂停不扣。余额归零保存后暂停，到账后续跑。全程不超过原任务价格。</details></section><div id="notice"></div><nav><button>停止本次任务</button><button>暂停任务</button><button>查看材料</button></nav></section><footer>交互原型 · 合成数据；上线状态和扣费由服务端提供。</footer></main>
<dialog aria-labelledby="dialog-title"><h2 id="dialog-title">积分已用完，充值后继续</h2><p>已完成的工作会保留，积分已停止扣减。当前处理保存后暂停，充值到账后自动继续本次任务。</p><nav><button class="primary" onclick="show('resumed')">充值积分</button><button onclick="document.querySelector('dialog').close()">稍后充值</button></nav></dialog>
<script>function show(state){const empty=state==='exhausted';document.querySelector('dialog').close();document.querySelector('#title').textContent=empty?'积分已用完，任务已暂停':'正在编制募集书内容';document.querySelector('#status').textContent=empty?'积分已停止扣减，已完成的工作会保留。充值到账后自动继续本次任务。':'已完成目录核对，正在更新财务章节。状态随模型处理自动更新。';document.querySelector('#balance').textContent='可用余额 '+(empty?'0':state==='resumed'?'20,000':'1')+' 积分';document.querySelector('#notice').innerHTML=empty?'<p>充值到账后自动继续本次任务，已完成的步骤不会重复执行。</p><button class="primary" onclick="show(\'resumed\')">充值积分</button>':'';if(empty)document.querySelector('dialog').showModal()}show(new URLSearchParams(location.search).get('state')||'running')</script></html>
