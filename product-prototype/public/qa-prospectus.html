<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目问答 · 上传即使用募集说明书</title>
<link rel="stylesheet" href="../../apps/web/src/style.css"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="../../apps/web/src/prototype-adapter.css"><link rel="stylesheet" href="prospectus-panel.css"><link rel="stylesheet" href="../../apps/web/src/file-workspace.css"><link rel="stylesheet" href="../../apps/web/src/project-qa-workspace.css"><link rel="stylesheet" href="file-generation-ux.css"><link rel="stylesheet" href="workspace-typography.css">
<style>body{display:block!important;padding:24px}main{max-width:1120px;margin:auto}.prototype-note{color:#69766b}</style></head>
<body class="prototype-app"><main class="qa-page"><h1>项目问答</h1><p class="prototype-note">合成交互原型 · 不上传文件、不调用模型、不计费</p><section class="panel"><h2>项目资料</h2><p data-selected>合成本项目募集说明书.docx · 已纳入本轮材料</p><button class="btn secondary" data-manage>管理募集说明书</button></section></main>
<dialog class="pf-modal qa-modal"><header><h2>本项目募集说明书</h2><button class="icon-btn" data-close aria-label="关闭">×</button></header><p>上传成功后自动用于本轮问答，无需再次确认。</p><div id="qa-prospectus-panel">
<section class="panel prospectus-panel pf-generation-prospectus" aria-label="项目募集说明书"><header class="prospectus-panel-heading"><div><h2>项目募集说明书</h2><p>问答将依据此版本及选中的补充材料；已提交任务保留原依据。</p></div><button class="btn secondary" data-upload><svg viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5M4 16v4h16v-4"/></svg>上传新版本</button></header>
<div class="prospectus-current-file"><span class="prospectus-file-icon"><svg viewBox="0 0 24 24"><path d="M14 2H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9M14 2v7h7M7 13h10M7 17h7"/></svg></span><div class="prospectus-file-info"><span class="prospectus-current">当前版本 · V5</span><h3 data-filename>合成本项目募集说明书.docx</h3><p>用户上传 · 2026年10月25日 14:00</p></div><div class="prospectus-version-actions"><button class="text-button"><svg viewBox="0 0 24 24"><path d="M12 4v12m-5-5 5 5 5-5M4 16v4h16v-4"/></svg>下载原文件</button></div></div>
<p class="prospectus-upload-hint">上传成功后自动用于本轮问答，不会开始回答或扣费。</p>
<details class="prospectus-history"><summary><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></svg>版本历史（1）<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></summary><p>上传成功后自动选用；也可改用已保存版本。已提交任务保留原依据。版本序号表示保存顺序。</p><div class="prospectus-version"><strong data-history>V5 · 合成本项目募集说明书.docx</strong><span class="prospectus-current">项目当前稿</span></div></details><input type="file" accept=".docx,.pdf" hidden><p role="status"></p></section></div><p role="status"></p></dialog>
<script>
const dialog=document.querySelector('dialog'),input=document.querySelector('input');
document.querySelector('[data-close]').onclick=()=>dialog.close();document.querySelector('[data-manage]').onclick=()=>dialog.showModal();document.querySelector('[data-upload]').onclick=()=>input.click();
input.onchange=()=>{const file=input.files[0];if(!file)return;document.querySelector('[data-filename]').textContent=file.name;document.querySelector('[data-history]').textContent='V5 · '+file.name;document.querySelector('[data-selected]').textContent=file.name+' · 已纳入本轮材料';dialog.close();};dialog.showModal();
</script></body></html>
