 #bb-dashboard-design .bb-detail-head{flex-wrap:wrap;}
 #bb-dashboard-design .bb-detail-section{padding:17px 14px;}
 #bb-dashboard-design .bb-split-fields{grid-template-columns:1fr;gap:0;}
 #bb-dashboard-design .bb-field input,#bb-dashboard-design .bb-field textarea,#bb-dashboard-design .bb-field select{font-size:16px;}
}
@media(pointer:coarse){#bb-dashboard-design .bb-product button,#bb-dashboard-design .bb-product select{min-height:44px;}}
</style>
<script>
(() => {
 const root = document.getElementById('bb-dashboard-design');
 const taskTypes = {update:{label:'募集书更新',action:'更新募集书',icon:'file-pen-line'},review:{label:'募集书复核',action:'复核募集书',icon:'file-check-2'},generate:{label:'材料生成',action:'生成材料',icon:'sparkles'}};
 const tasks = [
  {id:'t1',type:'generate',title:'主承销商核查意见',issuer:'澄川实业',market:'上交所',status:'done',statusText:'已完成',detail:'Word 文档已生成',time:'今天 14:32',material:'主承销商核查意见'},
  {id:'t2',type:'review',title:'澄川实业 · 募集说明书复核',issuer:'澄川实业',market:'上交所',status:'queued',statusText:'排队中',detail:'等待执行 · 14:25 提交',time:'今天 14:25'},
  {id:'t3',type:'update',title:'云岚科技 · 2026 年公司债',issuer:'云岚科技',market:'深交所',status:'running',statusText:'编制中',detail:'正在编制正文 · 14:18 开始',time:'今天 14:24'},
  {id:'t4',type:'update',title:'启源实业 · 三季度更新',issuer:'启源实业',market:'上交所',status:'failed',statusText:'本次未完成',detail:'执行中断，可查看原因',time:'今天 13:58'},
  {id:'t5',type:'review',title:'云岚科技 · 募集说明书复核',issuer:'云岚科技',market:'深交所',status:'done',statusText:'已完成',detail:'三类复核结果可查看',time:'今天 13:40'},
  {id:'t6',type:'update',title:'澄川实业 · 三季度更新',issuer:'澄川实业',market:'上交所',status:'done',statusText:'已完成',detail:'修订版、清洁版 Word 已生成',time:'今天 12:26'},
  {id:'t7',type:'generate',title:'法律意见书',issuer:'启源实业',market:'深交所',status:'draft',statusText:'草稿',detail:'已保存，可继续填写',time:'昨天 17:10',material:'法律意见书'}
 ];
 const groups={all:'全部状态',attention:'待处理',active:'进行中',done:'已完成'};
 const inGroup=(task,group)=>group==='all'||(group==='attention'?['failed','draft'].includes(task.status):group==='active'?['running','queued'].includes(task.status):task.status==='done');
 const ic=(name)=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
 const esc=(v)=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const views=[];
 function icons(){if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});}
 function save(){if(!window.openai?.setWidgetState)return;const state=views.map(v=>({type:v.type,group:v.group,selected:v.selected,density:v.density}));window.openai.setWidgetState({modelContent:{design:'BondBuddy 工作台：统一三类任务，按状态给出下一步操作',selectedTasks:views.map(v=>v.selected).filter(Boolean)},privateContent:{version:1,views:state}}).catch(()=>{});}
 function restore(data){if(data?.privateContent?.version!==1)return;data.privateContent.views?.forEach((s,i)=>{if(!views[i])return;const v=views[i];if(s.type==='all'||taskTypes[s.type])v.type=s.type;if(groups[s.group])v.group=s.group;if(s.selected===null||s.selected==='account'||tasks.some(t=>t.id===s.selected)||['new-update','new-review','new-generate'].includes(s.selected))v.selected=s.selected;if(['舒展','紧凑'].includes(s.density))v.density=s.density;});}
 function shell(v){
  v.el.innerHTML=`<aside class="bb-side" aria-label="主导航"><div class="bb-brand"><span class="bb-brand-mark">b</span>bondbuddy</div><div class="bb-space"><span class="bb-space-icon">${ic('building-2')}</span><div>我的工作空间<small>个人空间</small></div></div><nav class="bb-nav"><button class="bb-nav-button cursor-interaction" data-action="home" aria-current="page">${ic('layout-dashboard')}工作台</button><div class="bb-nav-label">开始工作</div>${Object.entries(taskTypes).map(([k,t])=>`<button class="bb-nav-button cursor-interaction" data-new="${k}">${ic(t.icon)}${t.action}</button>`).join('')}<div class="bb-nav-label">工作空间</div><button class="bb-nav-button cursor-interaction" data-action="all">${ic('folder-open')}全部项目</button></nav><div class="bb-side-bottom"><button class="bb-nav-button cursor-interaction" data-action="account">${ic('user-round')}我的账号</button><div class="bb-credit"><div class="bb-credit-top">可用积分${ic('coins')}</div><div class="bb-credit-value">86,000<small>积分</small></div><button class="bb-credit-action cursor-interaction" data-action="account">充值与明细 ${ic('arrow-up-right')}</button></div><div class="bb-identity"><span class="bb-avatar">M</span><span>示例账号</span><button class="cursor-interaction" data-action="logout">退出</button></div></div></aside><div class="bb-content"><div class="bb-topbar"><span class="bb-breadcrumb">工作台</span><span class="bb-mobile-credit">${ic('coins')}86,000 积分</span><span class="bb-demo">设计预览 · 示例数据</span></div><main class="bb-main"></main></div>`;
  v.main=v.el.querySelector('.bb-main');
  v.el.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||!v.el.contains(b))return;if(b.dataset.task){v.selected=b.dataset.task;render(v);save();return;}if(b.dataset.group){v.group=v.group===b.dataset.group?'all':b.dataset.group;v.selected=null;render(v);save();return;}if(b.dataset.type){v.type=b.dataset.type;render(v);save();return;}if(b.dataset.new){v.selected='new-'+b.dataset.new;render(v);save();return;}const action=b.dataset.action;if(action==='home'||action==='back'){v.selected=null;render(v);save();}else if(action==='all'){v.selected=null;v.type='all';v.group='all';render(v);announce(v,'这里展示全部 7 项示例任务；正式页面进入“全部项目”，保留三类任务。');save();}else if(action==='download'){announce(v,'当前为设计预览。正式页面将在此下载该任务的 Word 文件。');}else if(action==='account'){v.selected='account';render(v);save();}else if(action==='next'){announce(v,'正式页面继续到材料上传，完成后展示积分报价并明确开始任务。');}else if(action==='retry'){announce(v,'正式页面在此确认输入与费用，再重新提交。本次预览不会运行任务。');}else if(action==='logout'){announce(v,'这是示例账号，未执行真实退出。');}});
  v.el.addEventListener('change',event=>{if(event.target.matches('[data-status-select]')){v.group=event.target.value;render(v);save();}});
 }
 function announce(v,text){let box=v.main.querySelector('.bb-message');if(!box){box=document.createElement('div');box.className='bb-message';box.setAttribute('role','status');v.main.append(box);}box.textContent=text;}
 function statusBadge(t){const symbol={done:'check',running:'loader-circle',queued:'clock-3',draft:'pencil-line',failed:'circle-alert'}[t.status];return `<span class="bb-badge bb-${t.status}">${ic(symbol)}${t.statusText}</span>`;}
 function actionLabel(t){return t.status==='done'?'查看结果':['running','queued'].includes(t.status)?'查看进度':t.status==='draft'?'继续填写':'查看原因';}
 function list(v){
 const filtered=tasks.filter(t=>(v.type==='all'||t.type===v.type)&&inGroup(t,v.group));
 return `<section class="bb-panel" aria-label="任务列表"><div class="bb-panel-head"><h2>${v.group==='all'?'最近任务':groups[v.group]}<small>${filtered.length} 项</small></h2><button class="bb-link cursor-interaction" data-action="all">全部项目 ${ic('arrow-right')}</button></div>${v.compact?`<div class="bb-status-tabs" aria-label="按状态筛选">${Object.entries(groups).map(([g,label])=>`<button class="bb-status-tab cursor-interaction" data-group="${g}" aria-pressed="${v.group===g}">${g==='all'?'全部':label}<span>${tasks.filter(t=>inGroup(t,g)).length}</span></button>`).join('')}</div>`:''}<div class="bb-toolbar"><div class="bb-types" aria-label="按任务类型筛选">${[['all','全部类型'],...Object.entries(taskTypes).map(([k,t])=>[k,t.label])].map(([k,label])=>`<button class="bb-type cursor-interaction" data-type="${k}" aria-pressed="${v.type===k}">${label}</button>`).join('')}</div>${v.compact?'':`<select class="bb-select" aria-label="任务状态" data-status-select>${Object.entries(groups).map(([g,label])=>`<option value="${g}" ${g===v.group?'selected':''}>${label}</option>`).join('')}</select>`}</div><div class="bb-table-head"><span>任务 / 项目</span><span>当前状态</span><span style="text-align:right">操作</span></div><div aria-live="polite">${filtered.length?filtered.map(t=>`<article class="bb-row"><div class="bb-row-info"><button class="bb-task-title cursor-interaction" data-task="${t.id}">${esc(t.title)}</button><div class="bb-task-meta"><span class="bb-task-type">${ic(taskTypes[t.type].icon)}${taskTypes[t.type].label}</span><span>· ${esc(t.market)}</span>${t.type==='generate'?`<span>· ${esc(t.issuer)}</span>`:''}</div></div><div class="bb-row-state">${statusBadge(t)}<span class="bb-stage">${esc(t.detail)}</span></div><button class="bb-row-action cursor-interaction" data-task="${t.id}" aria-label="${actionLabel(t)}：${esc(t.title)}">${actionLabel(t)}${ic('chevron-right')}</button></article>`).join(''):'<div class="bb-no-results">没有符合此筛选的任务</div>'}</div><div class="bb-list-footer"><span>按最近更新时间排序</span><span>显示 ${filtered.length} 项</span></div></section>`;
 }
 function home(v){
 return `<header class="bb-heading"><h1>工作台</h1><p>继续手上的任务，查看生成结果。</p></header>${v.compact?'':`<div class="bb-overview" aria-label="任务状态概览">${[['attention','待处理','circle-alert','草稿 1 · 失败 1'],['active','进行中','clock-3','执行 1 · 排队 1'],['done','已完成','files','可查看与下载']].map(([g,title,icon,sub])=>`<button class="bb-summary cursor-interaction" data-group="${g}" aria-pressed="${v.group===g}"><span class="bb-summary-label">${ic(icon)}${title}</span><span class="bb-summary-value">${tasks.filter(t=>inGroup(t,g)).length}</span><span class="bb-summary-sub">${sub}</span><span class="bb-summary-arrow">${ic('arrow-up-right')}</span></button>`).join('')}</div>`}<div class="bb-start"><span class="bb-start-title">开始新任务</span>${Object.entries(taskTypes).map(([k,t])=>`<button class="bb-action cursor-interaction" data-new="${k}">${ic(t.icon)}${t.action}</button>`).join('')}</div>${list(v)}<div class="bb-footnote">${ic('cloud-check')}任务在后台持续执行，离开页面也会继续。</div>`;
 }
 function detail(v,t){
 let content='';
 if(t.status==='done'){
  if(t.type==='review')content=`<section class="bb-detail-section"><h2>复核结果</h2><div class="bb-report"><strong>财务数据</strong><p>示例：现金流量表与正文引用金额存在差异，需核对经营活动现金流量净额。</p></div><div class="bb-report"><strong>合规与格式</strong><p>示例：部分章节交叉引用未随目录调整，需同步更新。</p></div><div class="bb-report"><strong>公开信息</strong><p>示例：主体评级披露时间早于最新公告，建议核实后更新。</p></div></section>`;
  const files=t.type==='update'?['修订版募集说明书.docx','清洁版募集说明书.docx']:t.type==='generate'?[t.material+'.docx']:['募集说明书复核报告.docx'];
  content+=`<section class="bb-detail-section"><h2>${t.type==='review'?'下载报告':'下载成果'}</h2>${files.map(f=>`<div class="bb-file"><div class="bb-file-name">${ic('file-text')}<div><strong>${esc(f)}</strong><small>${esc(t.issuer)} · ${t.time} 生成</small></div></div><button class="bb-action cursor-interaction" data-action="download">${ic('download')}下载 Word</button></div>`).join('')}</section>`;
 }else if(['running','queued'].includes(t.status)){
  content=`<section class="bb-detail-section"><h2>${t.status==='running'?'正在编制正文':'任务已提交，等待执行'}</h2><ol class="bb-timeline"><li>${ic('circle-check')}<div><span>任务已提交</span><small>材料与要求已保存</small></div></li><li>${ic(t.status==='running'?'circle-check':'clock-3')}<div><span>${t.status==='running'?'开始编制':'等待执行'}</span><small>${t.status==='running'?'今天 14:18 开始':'今天 14:25 提交，尚未开始处理'}</small></div></li>${t.status==='running'?`<li>${ic('loader-circle')}<div><span>正在编制正文</span><small>最新进度：今天 14:24</small></div></li>`:''}</ol><p style="margin-top:15px">可以离开本页，任务会继续。完成后在此查看结果。</p></section>`;
 }else if(t.status==='draft'){
  content=`<section class="bb-detail-section"><h2>继续填写材料信息</h2><label class="bb-field">材料类型<input value="${esc(t.material)}" readonly></label><label class="bb-field">交易所<select><option>${t.market}</option><option>${t.market==='深交所'?'上交所':'深交所'}</option></select></label><label class="bb-field">补充要求与说明（选填）<textarea placeholder="补充本次材料编制的要求"></textarea></label><button class="bb-action bb-primary cursor-interaction" data-action="next">继续上传材料 ${ic('arrow-right')}</button></section>`;
 }else{
  content=`<section class="bb-detail-section"><h2>本次执行中断</h2><p>示例原因：执行服务连接中断，本次尚未生成 Word 成果。已上传材料和补充说明仍保留。</p><div style="margin-top:18px"><button class="bb-action bb-primary cursor-interaction" data-action="retry">查看输入并重新提交 ${ic('arrow-right')}</button></div></section>`;
 }
 return `<button class="bb-link bb-back cursor-interaction" data-action="back">${ic('arrow-left')}返回工作台</button><header class="bb-detail-head"><div><h1>${esc(t.title)}</h1><p>${taskTypes[t.type].label} · ${esc(t.issuer)} · ${esc(t.market)} · ${t.time}</p></div>${statusBadge(t)}</header>${content}<div class="bb-message" role="status"></div>`;
 }
 function newTask(v,type){const t=taskTypes[type];return `<button class="bb-link bb-back cursor-interaction" data-action="back">${ic('arrow-left')}返回工作台</button><header class="bb-heading"><h1>${t.action}</h1><p>新任务 · 填写信息</p></header><section class="bb-detail-section"><h2>基本信息</h2><label class="bb-field">项目名称<input placeholder="例如：澄川实业 2026 年公司债"></label>${type==='generate'?`<div class="bb-split-fields"><label class="bb-field">材料类型<select><option>主承销商核查意见</option><option>法律意见书</option><option>募集说明书摘要</option><option>立项报告</option></select></label><label class="bb-field">交易所<select><option>上交所</option><option>深交所</option></select></label></div>`:`<label class="bb-field">发行人<input placeholder="填写企业全称"></label>`}<button class="bb-action bb-primary cursor-interaction" data-action="next">下一步：上传材料 ${ic('arrow-right')}</button></section><div class="bb-message" role="status"></div>`;}
 function account(v){return `<button class="bb-link bb-back cursor-interaction" data-action="back">${ic('arrow-left')}返回工作台</button><header class="bb-heading"><h1>我的账号</h1><p>账号设置、积分与充值集中在这里。</p></header><section class="bb-detail-section"><h2>可用积分</h2><div class="bb-credit-value">86,000 <small>积分 · 示例余额</small></div><p style="margin-top:15px">各任务的积分报价在开始前展示，历史扣费可在积分明细查看。</p></section>`;}
 function render(v){v.el.style.setProperty('--bb-row-pad',v.density==='紧凑'?'12px':'17px');const t=tasks.find(t=>t.id===v.selected);v.main.innerHTML=t?detail(v,t):v.selected?.startsWith('new-')?newTask(v,v.selected.slice(4)):v.selected==='account'?account(v):home(v);v.el.querySelector('.bb-breadcrumb').textContent=t?`工作台 / ${taskTypes[t.type].label} / ${actionLabel(t)}`:v.selected?.startsWith('new-')?'工作台 / 新任务':v.selected==='account'?'工作台 / 我的账号':'工作台';v.main.querySelectorAll('.bb-row').forEach(row=>{const task=tasks.find(item=>item.id===row.querySelector('[data-task]')?.dataset.task);if(task){const time=document.createElement('span');time.className='bb-task-time';time.textContent='· '+task.time;time.setAttribute('aria-label','最近更新 '+task.time);row.querySelector('.bb-task-meta').append(time);}});icons();}
 ['bb-state-layout'].forEach((id,i)=>{const v={el:document.getElementById(id),compact:i===1,type:'all',group:'all',selected:null,density:'舒展'};views.push(v);shell(v);});
 restore(window.openai?.widgetState);views.forEach(render);
 window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){restore(event.detail.globals.widgetState);views.forEach(render);}});
 if(globalThis.Tweak)views.forEach(v=>{const tweak=new Tweak({container:v.el,onChange:()=>{render(v);save();}});tweak.addSelect(v,'density',{label:'列表密度',options:['舒展','紧凑']});});
})();
</script>
</body></html>
