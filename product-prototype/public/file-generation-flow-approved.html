    const selectedLabel=state.entry==='review'?'本次待复核稿':state.entry==='qa'?'本次问答依据':'本次生成依据';
    const selectedSource=saved.find(x=>x.id===state.picks[state.entry]);
    const uploadHelp=state.entry==='review'?'上传一份需要复核的募集说明书，支持 Word / PDF。PDF 将转换为 Word，版式、表格和分页可能与原 PDF 不同。':'上传一份用于'+(state.entry==='qa'?'项目问答':'文件生成')+'的募集说明书，支持 Word / PDF。';
    const notice=pending?'正在上传并保存新的募集说明书，请保持页面打开。':failed?`${failed} 份文件尚未保存，请重试或移除后继续。`:'';
    const next=state.entry==='review'?'下一步：补充复核材料':state.entry==='qa'?'下一步：确认问题':'下一步：选择生成内容';
    const row=f=>`<li class="material-file-row"><div class="material-file-main"><strong>${esc(f.name)}</strong><span>${sourceRole()} · ${f.version}${f.size?' · '+(f.size/1024).toFixed(1)+' KB':''}</span><p class="material-file-status ${f.status==='error'?'material-file-error':''}" role="${f.status==='error'?'alert':'status'}">${f.status==='saved'?'已保存':f.status==='error'?'上传失败，请重试':f.progress>=2?'传输完成，正在确认文件保存…':`正在上传 ${f.progress===1?'66':'33'}%…`}</p></div><div class="material-file-actions">${f.status==='error'?`<button data-retry-source="${f.id}">重试此文件</button>`:''}<button data-delete-source="${f.id}" ${pending?'disabled':''}>${f.status==='error'?'移除此行':'删除'}</button></div></li>`;
    return `<section class="bb-panel"><h2>选择募集说明书</h2><p class="bb-sub">${saved.length?'选择一种方式，确定本次使用的募集说明书。':'上传本次用于文件生成的募集说明书。'}单份不超过 100 MB。</p>${notice?`<p class="review-upload-summary" role="${failed?'alert':'status'}">${notice}</p>`:''}<section class="material-partition"><fieldset class="review-source-modes" aria-label="提供募集说明书的方式" ${saved.length?'':'hidden'}><label><input type="radio" name="bb-source-mode" value="upload" aria-controls="bb-source-upload" ${sourceMode()==='upload'?'checked':''} ${sourceBlocked()?'disabled':''}>上传新募集说明书</label><label><input type="radio" name="bb-source-mode" value="project" aria-controls="bb-source-existing" ${sourceMode()==='project'?'checked':''} ${sourceBlocked()?'disabled':''}>选择项目已有募集说明书</label></fieldset><div id="bb-source-upload" ${sourceMode()==='upload'?'':'hidden'}><ul class="material-role-list"><li class="material-role" data-drop="source"><div class="material-role-heading"><div><span>${uploadHelp}</span></div><button class="material-picker" data-action="upload-source" ${sourceBlocked()?'disabled':''}>${icon('upload')}<span>点击或拖入文件</span></button></div><ul class="material-file-list">${state.library.filter(f=>f.status!=='saved').map(row).join('')}</ul></li></ul></div><div id="bb-source-existing" class="project-source" ${sourceMode()==='project'?'':'hidden'}><label for="bb-project-source">选择募集说明书版本</label><select class="review-source-select" id="bb-project-source" ${sourceBlocked()||!saved.length?'disabled':''}><option value="">请选择募集说明书版本</option>${saved.map(f=>`<option value="${f.id}" ${state.picks[state.entry]===f.id?'selected':''}>${f.version} · ${esc(f.name)}${state.currentVersionId===f.id?' · 项目当前版本':''}</option>`).join('')}</select>${!saved.length?'<p class="review-muted">项目还没有可选的募集说明书，请切换到“上传新募集说明书”。</p>':''}<p class="review-muted">所选版本只用于${purpose}。${state.entry==='review'?'PDF 将转换为 Word，版式、表格和分页可能与原 PDF 不同。':''}</p></div><div data-selected-source>${selectedSource?`<div class="review-selected-source"><strong>${selectedLabel}</strong><ul class="material-file-list">${row(selectedSource)}</ul><p class="review-muted">上传新稿或选择其他版本后，将替换${selectedLabel}。</p></div>`:`<p class="review-muted review-source-empty" role="status">尚未选择${selectedLabel}。</p>`}</div></section><div class="bb-footer"><div class="source-footer-copy"><strong>${pending?'材料保存完成后即可继续':failed?'请先处理未保存的文件':validSource()?'募集说明书已保存':'请上传或选择募集说明书'}</strong><p aria-live="polite">${validSource()?(state.sourceMessage||'已选 '+state.version+'，可继续'+(state.entry==='generate'?'选择生成内容':state.entry==='review'?'补充复核材料':'确认问题')):'保存并选定募集说明书后进入下一步。'}</p></div>${button(next+' '+icon('arrow-right'),'next','bb-primary',!validSource())}</div></section>`;
  }
  function treeMarkup(){
    const query=state.query.trim().toLowerCase();
    const filtered=items.filter(x=>(x.id+x.name).toLowerCase().includes(query));
    if(!filtered.length)return `<div class="bb-empty">没有匹配的文件，请换一个编号或名称。</div>`;
    return groups.map((g,gi)=>{const giItems=filtered.filter(x=>x.group===gi);if(!giItems.length)return '';const all=items.filter(x=>x.group===gi);const selected=all.filter(x=>state.selected.includes(x.id)).length;const expanded=state.expanded.includes(gi)||!!query;return `<div class="bb-group"><div class="bb-group-head"><label class="bb-check"><input type="checkbox" data-group="${gi}" aria-label="选择${g.name}" ${selected===all.length?'checked':''} data-partial="${selected>0&&selected<all.length}"><span>${g.name}</span></label><button class="bb-expand" data-expand="${gi}" aria-expanded="${expanded}">${selected} / ${all.length} ${icon(expanded?'chevron-up':'chevron-down')}</button></div>${expanded?giItems.map(x=>`<div class="bb-row"><label class="bb-check"><input type="checkbox" data-item="${x.id}" ${state.selected.includes(x.id)?'checked':''}><span>${x.id} ${x.name}</span></label><span class="bb-row-type">${x.type}</span></div>`).join(''):''}</div>`;}).join('');
  }
  function templateTable(){
    const docs=templateDocuments(),ready=readyDocuments(),rows=[...state.documentTypes];if(state.blankRow||!rows.length)rows.push('');
    return `<div class="bb-builder-heading"><div><h3>要生成的文件 <span>${docs.length} 份</span></h3><p class="bb-sub">每行选择一种文件，并添加对应模板。已保存的模板自动复用。</p></div><span class="bb-tag ${ready.length===docs.length&&docs.length?'':'bb-warning-tag'}">${ready.length} / ${docs.length} 已准备</span></div>
      <table class="bb-file-table" aria-label="要生成的文件"><thead><tr><th scope="col">序号</th><th scope="col">文件类型</th><th scope="col">采用的模板 / 已保存依据</th><th scope="col">操作</th></tr></thead><tbody>${rows.map((type,index)=>{
        const t=templateFor(type),saved=state.savedInputs[type]||{requirements:'',materials:[]};
        return `<tr data-document-row="${type}"><td class="bb-table-index">${String(index+1).padStart(2,'0')}</td><td><select class="bb-input" data-document-type="${type}" aria-label="第 ${index+1} 行文件类型"><option value="" disabled ${type?'':'selected'}>选择要生成的文件</option>${documentCatalog.map(d=>`<option value="${d.id}" ${d.id===type?'selected':state.documentTypes.includes(d.id)?'disabled':''}>${d.name}${d.id!==type&&state.documentTypes.includes(d.id)?'（已添加）':''}</option>`).join('')}</select></td><td>${type?`<div class="bb-template-name">${t?icon('file-text'):''}<span>${t?esc(t.name)+' <small>V'+t.version+'</small>':'<span class="bb-error">待添加模板</span>'}</span></div><details class="bb-saved-inputs" data-reused="${type}" ${state.reusedExpanded.includes(type)?'open':''}><summary>已保存的要求与依据 · ${saved.materials.length} 份资料${saved.requirements?' · 有要求':''}</summary><p>${esc(saved.requirements||'尚无个别要求。')}</p><ul>${saved.materials.length?saved.materials.map(name=>`<li>${esc(name)}</li>`).join(''):'<li>直接使用募集书和模板，可按需补充依据。</li>'}</ul></details>`:'<span class="bb-table-placeholder">选择文件类型后添加模板</span>'}</td><td><div class="bb-table-actions">${type?`<button class="bb-button" data-template-for="${type}">${t?'更换模板':'添加模板'}</button>`:''}<button class="bb-link" data-remove-document="${type}" aria-label="移除第 ${index+1} 行" ${!type&&!docs.length?'disabled':''}>移除</button></div></td></tr>`;
      }).join('')}</tbody></table>
      <div class="bb-builder-bottom">${button(icon('plus')+' 添加一行','add-row','',state.documentTypes.length===documentCatalog.length)}<p role="status">${!docs.length?'选择文件类型，开始准备本次清单。':ready.length===docs.length?`已复用 ${ready.length} 份模板，可以核对文件包。`:`还需为 ${docs.length-ready.length} 份文件添加模板。`}</p></div>
      <details class="bb-optional" data-optional="requirementsOpen" ${state.requirementsOpen?'open':''}><summary>补充要求（选填）<small>已保存的个别要求会继续保留</small></summary><div class="bb-optional-body"><label class="bb-form-field">本轮统一补充要求<textarea class="bb-input" data-field="requirementsDraft" maxlength="1200" placeholder="填写本轮希望补充到所选文件的要求">${esc(state.requirementsDraft)}</textarea></label><div class="bb-inline-actions">${button('保存到所选文件','save-requirements','',!docs.length||!state.requirementsDraft.trim())}<span class="bb-sub" role="status">${esc(state.requirementsStatus)}</span></div></div></details>
      <details class="bb-optional" data-optional="supportOpen" ${state.supportOpen?'open':''}><summary>补充依据（选填）<small>为本次所选文件补充参考资料</small></summary><div class="bb-support-zone" data-drop="support"><p class="bb-sub">DOCX / PDF / XLSX · 支持多份，每份不超过 100 MB</p><div class="bb-inline-actions" style="justify-content:center">${button(icon('upload')+' 添加补充依据','upload-support','',!docs.length)}</div><p class="bb-sub">已保存资料可在对应文件行中展开查看。</p></div></details>`;
  }
  function contentScreen(){
    const modes=`<div class="bb-modes">${['batch','single'].map(m=>`<button class="bb-mode" data-mode="${m}" aria-pressed="${state.mode===m}">${icon(m==='batch'?'list-checks':'file-pen-line')}<div><strong>${m==='batch'?'按目录批量生成':'按模板生成文件'}</strong><small>${m==='batch'?'从底稿目录中勾选文件':'在表格中逐行添加所需文件'}</small></div></button>`).join('')}</div>`;
    let body;
    if(state.mode==='single')body=templateTable();
    else if(!state.hasDirectory)body=`<div class="bb-dropzone" data-drop="directory"><div class="bb-file-icon">${icon('sheet')}</div><h3>添加底稿目录</h3><p>上传 Excel 目录，识别后即可勾选要生成的文件。</p>${button(icon('plus')+' 选择 Excel 目录','upload-directory','bb-primary')}</div><details class="bb-sub" style="margin-top:14px"><summary>目录怎么准备？</summary><p style="margin-top:8px">Excel 中保留底稿编号、文件名称和所属目录。默认选择“1 尽职调查文件”，可在识别后调整。</p></details>`;
    else if(state.parse==='loading'&&state.parseTarget==='directory')body=`<div class="bb-directory">${icon('sheet')}<div class="bb-file-info"><strong>${esc(state.directory)}</strong><small>正在识别目录与文件条目…</small></div></div>`;
    else body=`<div class="bb-directory">${icon('sheet')}<div class="bb-file-info"><strong>${esc(state.directory)}</strong><small>已识别 · 12 个条目</small></div>${link('更换目录','select-directory')}</div><div class="bb-range"><strong>1 尽职调查文件</strong><span class="bb-sub">已选 <strong id="bb-selected-count">${state.selected.length}</strong> / 12 项</span></div><div class="bb-toolbar"><label class="bb-search">${icon('search')}<input type="text" aria-label="搜索编号或名称" placeholder="搜索编号或名称" value="${esc(state.query)}" id="bb-search"></label>${link(state.selected.length===items.length?'清空选择':'选择全部','toggle-all')}</div><div class="bb-tree" id="bb-tree">${treeMarkup()}</div>`;
    const valid=state.mode==='batch'?state.hasDirectory&&state.parse==='ready'&&state.selected.length>0:templatesReady();
    return sourceContext()+`<section class="bb-panel"><h2>选择要生成的文件</h2><p class="bb-sub">已有的目录和模板可以直接复用。</p>${modes}${body}<div class="bb-footer">${link(icon('arrow-left')+' 上一步','back')}<span class="bb-footer-hint">${state.mode==='batch'?`已选 <strong id="bb-footer-count">${state.selected.length}</strong> 份文件`:`${count()} 份文件 · ${totalPoints().toLocaleString()} 积分`}</span>${button((state.mode==='single'?'核对文件包与费用':'下一步：确认生成')+' '+icon('arrow-right'),'next','bb-primary',!valid)}</div></section>`;
  }
  function confirmScreen(){
    const listing=state.mode==='batch'?`<strong>${esc(state.directory)} · 1 尽职调查文件</strong><div class="bb-summary-list">${groups.map((g,i)=>{const n=chosen().filter(x=>x.group===i).length;return n?`<span>${g.name.replace(/^\S+ /,'')} ${n} 份</span>`:'';}).join('')}</div>`:`<strong>按模板生成文件 · ${count()} 份</strong><ul class="bb-confirm-docs">${templateDocuments().map(d=>{const t=templateFor(d.id),saved=state.savedInputs[d.id]||{requirements:'',materials:[]};return `<li><span>${d.name}</span><small>${esc(t.name)} V${t.version}<br>${saved.materials.length} 份补充依据${saved.requirements?' · 已保存补充要求':''}</small></li>`;}).join('')}</ul>`;
    return sourceContext()+`<section class="bb-panel"><h2>确认本次生成</h2><p class="bb-sub">核对募集说明书、生成范围及预计积分。</p><div class="bb-confirm-section"><div class="bb-confirm-head"><span>募集说明书</span>${link('更换','change-source')}</div><strong class="bb-file-name">${esc(state.source)}</strong><div class="bb-metadata"><span class="bb-tag">${state.version} · 已保存</span></div></div><div class="bb-confirm-section"><div class="bb-confirm-head"><span>生成内容</span>${link('调整','edit-selection')}</div>${listing}</div>${state.mode==='batch'?`<div class="bb-notice">${icon('folder-output')}<span>可编制的条目形成文件；业务不适用或资料不足的条目分别写明情况。成果按“可生成文件”和“不适用说明”两个文件夹打包。</span></div>`:''}<div class="bb-credit-row"><div><strong>全部完成预计使用积分</strong><p class="bb-sub">${count()} 份 × 4,500 积分 · 当前可用 5,000,040 积分</p></div><div class="bb-credit-value">${totalPoints().toLocaleString()} <small>积分</small></div></div><div class="bb-footer">${link(icon('arrow-left')+' 上一步','back')}${button('确认并开始生成 '+icon('sparkles'),'generate','bb-primary')}</div></section>`;
  }
  function progressScreen(){const n=count(),finished=Math.min(n,Math.floor(state.progress*n/100));return `<section class="bb-panel"><div class="bb-progress-title"><div><h2>${state.paused?'生成已暂停':'正在生成文件'}</h2><p class="bb-sub">${state.paused?'已保留当前进度，可以继续生成。':'可离开此页面，稍后在生成记录中继续查看。'}</p></div><span class="bb-status-icon">${icon(state.paused?'pause':'sparkles')}</span></div><div class="bb-progress-track" role="progressbar" aria-label="生成进度" aria-valuenow="${state.progress}" aria-valuemin="0" aria-valuemax="100"><div class="bb-progress-fill" style="width:${state.progress}%"></div></div><div class="bb-progress-detail"><span>已完成 ${finished} / ${n} 份</span><span>${state.progress}%</span></div><div class="bb-log"><div class="bb-log-row">${icon('check')}<span>已确认募集说明书 ${state.version}</span><small>完成</small></div><div class="bb-log-row">${icon('check')}<span>已确定 ${n} 份生成文件</span><small>完成</small></div><div class="bb-log-row">${icon(state.paused?'pause':'file-pen-line')}<span>${state.paused?'等待继续生成':`正在编制：${esc(outputs()[Math.min(finished,n-1)]?.name||'核查文件')}`}</span><small>${state.paused?'已暂停':'进行中'}</small></div></div><div class="bb-footer"><span class="bb-footer-hint">本次资料与选择已保留</span>${button(state.paused?'继续生成':'暂停生成','pause',state.paused?'bb-primary':'')}</div></section>`;}
  function outputs(){return state.mode==='batch'?chosen():templateDocuments().map(d=>({id:d.id,name:d.name,type:d.name,explain:false}));}
  function resultRows(){let rows=outputs().map((x,i)=>({...x,failed:state.failed&&i===0}));if(state.resultTab==='docs')rows=rows.filter(x=>!x.explain&&!x.failed);if(state.resultTab==='notes')rows=rows.filter(x=>x.explain&&!x.failed);if(state.resultTab==='failed')rows=rows.filter(x=>x.failed);const start=state.page*5;const view=rows.slice(start,start+5);return `${view.length?view.map(x=>`<div class="bb-output">${icon(x.failed?'circle-alert':x.explain?'file-info':'file-text')}<div class="bb-output-info"><strong>${state.mode==='batch'?x.id+' ':''}${esc(x.name)}${x.explain?'—资料不足说明':''}.docx</strong><small>${x.failed?'暂时无法完成，请重试':x.explain?'不适用说明 / 资料不足':state.mode==='batch'?'可生成文件 / 已完成':'Word 文件 / 已完成'}</small></div>${x.failed?`<span class="bb-tag bb-warning-tag">生成失败</span>${link('重试','retry')}`:`<span class="bb-tag ${x.explain?'bb-warning-tag':''}">${x.explain?'情况说明':'已完成'}</span><button class="bb-link" data-preview="${esc(x.id||'single')}">预览</button>`}</div>`).join(''):'<div class="bb-empty">此分类下没有文件。</div>'}<div class="bb-pagination"><span>${rows.length?`${start+1}–${Math.min(start+5,rows.length)} / ${rows.length} 份`:'0 份'}</span><div class="bb-inline-actions">${button(icon('chevron-left'),'page-prev','',state.page===0)}${button(icon('chevron-right'),'page-next','',start+5>=rows.length)}</div></div>`;}
  function resultScreen(){const rows=outputs(),failed=state.failed?1:0,notes=rows.filter(x=>x.explain).length,docs=rows.length-notes-failed;return `<section class="bb-panel"><div class="bb-result-summary"><span class="bb-status-icon">${icon(failed?'circle-alert':'check')}</span><div><h2>${failed?'文件已生成，1 项待重试':'文件已生成'}</h2><p class="bb-sub">${rows.length-failed} 份结果已保存到本项目，可预览或打包下载。</p></div></div><div class="bb-result-stats"><div class="bb-result-stat"><strong>${docs}</strong>可生成文件</div><div class="bb-result-stat"><strong>${notes}</strong>不适用说明</div>${failed?`<div class="bb-result-stat"><strong class="bb-error">1</strong>待重试</div>`:''}<div class="bb-result-stat" style="margin-left:auto;max-width:180px"><span>本次使用</span><p style="margin-top:7px;color:var(--bb-ink)">募集说明书 ${state.version}${state.mode==='batch'?'<br>1 尽职调查文件':''}</p></div></div>${failed?`<div class="bb-notice" style="margin:0 0 15px">${icon('info')}<span>已完成文件可以下载。只重试失败项，保留其余成果。</span>${link('重试失败项','retry')}</div>`:''}<div class="bb-result-tabs" aria-label="筛选生成结果">${[['all','全部',rows.length],['docs','可生成文件',docs],['notes','不适用说明',notes],...(failed?[['failed','待重试',1]]:[])].map(([v,l,n])=>`<button class="bb-result-tab" data-result-tab="${v}" aria-pressed="${state.resultTab===v}">${l} ${n}</button>`).join('')}</div><div id="bb-output-list">${resultRows()}</div><div class="bb-footer">${link('再生成一批','new-batch')}${button(icon('download')+(failed?' 下载已完成文件（ZIP）':' 下载全部（ZIP）'),'download','bb-primary')}</div></section>`;}
  function render(){
    syncSource();
    root.querySelector('#bb-demo-context').textContent=state.entry==='review'?'复核对照 · PR #787 / 86229e0 的募集书二选一入口':state.entry==='qa'?'项目问答 · 沿用 PR #787 上传／选择交互的设计示意':'对齐 PR #787 · 86229e0 · 示例数据与模拟任务';
    root.querySelector('#bb-page-title').textContent=entryTitle();
    root.querySelector('#bb-crumb').textContent=state.entry==='generate'?'文件生成':entryTitle();
    root.querySelector('#bb-page-subtitle').textContent=state.entry==='generate'?'从募集说明书出发，生成项目所需文件。':state.entry==='review'?'选择本项目的募集说明书，开始复核。':'选择本项目的募集说明书，围绕文件提问。';

    root.querySelectorAll('button,summary,label,input[type=radio],input[type=checkbox],select').forEach(x=>x.classList.add('cursor-interaction'));
    icons();
  }
  function toast(msg){const el=root.querySelector('#bb-toast');el.textContent=msg;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,4200);}
  function modal(title,body,footer=''){modalFocus=document.activeElement;modalRoot.innerHTML=`<div class="bb-modal-wrap"><section class="bb-modal" role="dialog" aria-modal="true" aria-labelledby="bb-dialog-title"><div class="bb-modal-head"><h2 id="bb-dialog-title">${title}</h2><button data-action="close-modal" aria-label="关闭">${icon('x')}</button></div>${body}${footer?`<div class="bb-footer">${footer}</div>`:''}</section></div>`;icons();modalRoot.querySelector('button')?.focus();}
  function closeModal(){modalRoot.innerHTML='';if(modalFocus?.isConnected)modalFocus.focus();}
  function templateModal(type){
    state.templateTarget=type;const d=documentCatalog.find(d=>d.id===type),saved=state.templates[type]||[],current=templateFor(type);
    modal(d.name+' · 历史文件 / 模板',`<p class="bb-sub">添加一次，后续生成自动复用。新版本不会删除旧模板。</p><div class="bb-template-upload"><h3>上传历史文件 / 模板</h3><p>${esc(state.pendingTemplate||'Word（DOCX）· 单份不超过 100 MB')}</p>${button(icon('upload')+(state.pendingTemplate?' 重新选择':' 选择文件'),'upload-template')}${type==='init'?`<label class="bb-form-field">立项券商全称<input class="bb-input" data-field="broker" type="text" maxlength="200" value="${esc(state.broker)}" placeholder="填写券商完整名称"></label>`:''}<div class="bb-inline-actions" style="margin-top:14px">${button('保存并用于本次生成','save-template','bb-primary',!state.pendingTemplate||(type==='init'&&!state.broker.trim()))}</div></div><h3 style="margin-top:22px">从已保存模板库选用</h3>${saved.length?saved.map(t=>`<div class="bb-template-choice"><div><strong>${esc(t.name)}</strong><small>V${t.version} · 已保存</small></div><button class="bb-button" data-use-template="${t.version}" ${current?.version===t.version?'disabled':''}>${current?.version===t.version?'本次采用':'选用'}</button></div>`).join(''):'<p class="bb-sub">尚无此类型的模板。</p>'}`);
  }
  function focusDocument(index){const rows=root.querySelectorAll('[data-document-type]');rows[Math.min(index,rows.length-1)]?.focus();}
  function chooseFile(kind){uploadKind=kind;const input=root.querySelector('#bb-file-input');input.accept=kind==='directory'?'.xlsx':kind==='template'?'.docx':kind==='support'?'.docx,.pdf,.xlsx':'.docx,.pdf';input.multiple=kind==='support';input.value='';input.click();}
  function startSourceUploads(){
    clearInterval(parseTimer);state.parseTarget='source';render();persist();
    parseTimer=setInterval(()=>{
      for(const file of state.library.filter(x=>x.status==='uploading')){
        file.progress=(file.progress||0)+1;
        if(file.progress>=3){file.status='saved';state.picks[file.owner||state.entry]=file.id;if(!state.currentVersionId)state.currentVersionId=file.id;state.sourceMessage='本次材料选择已保存';}
      }
      if(!state.library.some(x=>x.status==='uploading')){clearInterval(parseTimer);persist();}
      render();
    },650);
  }
  function receiveFile(file){
    const ext=file.name.split('.').pop().toLowerCase();
    if(!(uploadKind==='directory'?['xlsx']:uploadKind==='template'?['docx']:uploadKind==='support'?['docx','pdf','xlsx']:['docx','pdf']).includes(ext)){toast('文件格式不匹配，请重新选择。');return;}
    if(file.size>100*1024*1024){toast('单份文件不能超过 100 MB，请重新选择。');return;}
    if(uploadKind==='template'){state.pendingTemplate=file.name;const returnFocus=modalFocus;templateModal(state.templateTarget);modalFocus=returnFocus;return;}
    if(uploadKind==='support'){for(const type of state.documentTypes){const saved=state.savedInputs[type]||(state.savedInputs[type]={requirements:'',materials:[]});if(!saved.materials.includes(file.name))saved.materials.push(file.name);}render();persist();toast('演示：补充依据已保存到所选文件，可在各行展开查看。');return;}
    closeModal();
    if(uploadKind==='source'){
      if(sourceBlocked()){toast('请先处理当前文件的上传或保存状态。');return;}
      const next=Math.max(0,...state.library.map(x=>parseInt(x.version.slice(1),10)||0))+1;
      state.library.push({id:'v'+next,name:file.name,version:'V'+next,status:'uploading',size:file.size,progress:0,owner:state.entry});
      state.sourceModes[state.entry]='upload';
      state.step=1;state.done=false;state.running=false;state.sourceMessage='';clearInterval(taskTimer);startSourceUploads();return;
    }
    state.parse='loading';state.parseTarget='directory';state.directory=file.name;state.hasDirectory=true;state.step=2;state.selected=items.map(x=>x.id);
    render();clearTimeout(parseTimer);parseTimer=setTimeout(()=>{state.parse='ready';render();persist();toast('演示读取完成；未上传或解析真实文件内容。');},1200);
  }
  function startTask(){state.running=true;state.done=false;state.paused=false;state.progress=0;state.step=3;state.failed=controls.result==='partial';state.resultTab='all';state.page=0;render();persist();tickTask();}
  function tickTask(){clearInterval(taskTimer);taskTimer=setInterval(()=>{if(state.paused||!state.running)return;state.progress=Math.min(100,state.progress+10);if(state.progress===100){clearInterval(taskTimer);state.running=false;state.done=true;state.step=4;state.history.push({name:state.mode==='batch'?state.directory:templateDocuments().map(d=>d.name).join('、'),count:count()});persist();}render();},650);}
  function updateSearch(){const tree=root.querySelector('#bb-tree');if(tree){tree.innerHTML=treeMarkup();root.querySelectorAll('[data-partial=true]').forEach(x=>x.indeterminate=true);icons();}}
  root.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||b.disabled)return;
    if(b.dataset.templateFor){state.pendingTemplate='';templateModal(b.dataset.templateFor);return;}
    if(b.dataset.useTemplate){const type=state.templateTarget;state.templatePicks[type]=Number(b.dataset.useTemplate);closeModal();render();root.querySelector('[data-template-for="'+type+'"]')?.focus();persist();return;}
    if(b.dataset.removeDocument!==undefined){const type=b.dataset.removeDocument,index=state.documentTypes.indexOf(type);if(type)state.documentTypes=state.documentTypes.filter(t=>t!==type);else state.blankRow=false;render();focusDocument(Math.max(0,index));persist();return;}
    if(b.dataset.retrySource){const file=state.library.find(x=>x.id===b.dataset.retrySource);if(file){file.status='uploading';file.progress=0;file.owner=state.entry;startSourceUploads();}return;}
    if(b.dataset.deleteSource){const file=state.library.find(x=>x.id===b.dataset.deleteSource);if(!file)return;if(file.status==='error'){state.library=state.library.filter(x=>x.id!==file.id);render();persist();return;}state.deleteSourceId=file.id;modal('删除项目材料',`<p class="review-muted">确定删除此文件？</p><div class="bb-choice"><span>${esc(file.name)}</span></div><p class="review-muted">删除后，该文件将不再出现在本项目的可选材料中。</p>`,`${button('取消','close-modal')}${button('删除文件','confirm-delete-source','bb-primary')}`);return;}
    if(b.dataset.step){state.step=Number(b.dataset.step);render();persist();return;}
    if(b.dataset.mode){state.mode=b.dataset.mode;render();persist();return;}
    if(b.dataset.expand!==undefined){const i=Number(b.dataset.expand);state.expanded=state.expanded.includes(i)?state.expanded.filter(x=>x!==i):[...state.expanded,i];render();persist();return;}
    if(b.dataset.resultTab){state.resultTab=b.dataset.resultTab;state.page=0;render();persist();return;}
    if(b.dataset.preview){const x=outputs().find(x=>x.id===b.dataset.preview)||(state.mode==='single'?outputs()[0]:null);if(!x)return;modal('文件预览',`<div class="bb-preview-sheet"><h3>${esc(x.name)}${x.explain?'—资料不足说明':''}</h3>${x.explain?`<p>本项涉及${esc(x.type)}。当前资料不足，暂无法形成该文件。</p><p>未取得对应原件或实际履职记录，不能将资料缺失认定为业务不适用。</p>`:`<p>发行人：山东菏都发展投资有限公司。</p><p>此处展示“${esc(x.name)}”的版式与阅读位置。正式生成后在此预览文件完整内容。</p>`}<p class="bb-sub">设计稿预览 · 非真实生成文件</p></div>`,`${button('关闭','close-modal')}${button(icon('download')+' 下载此文件','download-one','bb-primary')}`);return;}
    const action=b.dataset.action;if(!action)return;
    if(action==='close-modal'){closeModal();return;}
    if(action.startsWith('entry-')){const entry=action.slice(6);if(state.running||state.library.some(x=>x.status==='uploading')){toast('请先完成当前任务或材料保存，再切换入口。');return;}state.entry=entry;state.step=1;state.done=false;state.sourceMessage='';render();persist();return;}
    switch(action){
      case 'next':
        if(state.step===1&&!validSource())return;
        if(state.step===2&&state.mode==='single'&&!templatesReady())return;
        if(state.entry!=='generate'){modal(state.entry==='review'?'继续提供复核材料':'继续确认问题',`<p class="bb-sub">已保留${state.entry==='review'?'本轮复核':'本次问答'}选用的募集说明书。设计稿在此展示上传／选择区的对照。</p><div class="bb-choice">${icon('file-check')}<span>${esc(state.source)}<small>${state.version} · 已保存</small></span></div>`,`${button('返回查看','close-modal')}${button('返回文件生成','return-generate','bb-primary')}`);return;}
        state.step=Math.min(3,state.step+1);break;
      case 'back':state.step=Math.max(1,state.step-1);break;
      case 'change-source':state.step=1;break;
      case 'edit-selection':state.step=2;break;
      case 'return-generate':closeModal();state.entry='generate';state.step=1;break;
      case 'confirm-delete-source':state.library=state.library.filter(x=>x.id!==state.deleteSourceId);if(state.currentVersionId===state.deleteSourceId)state.currentVersionId='';state.sourceMessage='';delete state.deleteSourceId;closeModal();break;
      case 'upload-source':chooseFile('source');return;
      case 'upload-directory':chooseFile('directory');return;
      case 'upload-template':chooseFile('template');return;
      case 'upload-support':chooseFile('support');return;
      case 'add-row':state.blankRow=true;render();focusDocument(state.documentTypes.length);persist();return;
      case 'save-template':{
        const type=state.templateTarget;if(!state.pendingTemplate||(type==='init'&&!state.broker.trim()))return;
        const saved=state.templates[type]||(state.templates[type]=[]),version=Math.max(0,...saved.map(t=>t.version))+1;
        saved.push({name:state.pendingTemplate.replace(/\.docx$/i,''),version});state.templatePicks[type]=version;state.pendingTemplate='';closeModal();render();root.querySelector('[data-template-for="'+type+'"]')?.focus();persist();return;
      }
      case 'save-requirements':{
        if(!state.requirementsDraft.trim()||!state.documentTypes.length)return;
        for(const type of state.documentTypes){const saved=state.savedInputs[type]||(state.savedInputs[type]={requirements:'',materials:[]});saved.requirements=[saved.requirements,state.requirementsDraft.trim()].filter(Boolean).join('\n\n');}
        state.requirementsStatus='已保存到 '+state.documentTypes.length+' 份文件';state.requirementsDraft='';break;
      }
      case 'select-directory':modal('更换底稿目录',`<p class="bb-sub">本项目已保存的目录</p><div class="bb-choice">${icon('sheet')}<span>${esc(state.directory)}<small>已识别 · 12 个条目 · 当前选用</small></span></div>`,`${link(icon('plus')+' 上传新目录','upload-directory')}${button('继续使用当前目录','close-modal','bb-primary')}`);return;
      case 'toggle-all':state.selected=state.selected.length===items.length?[]:items.map(x=>x.id);break;
      case 'generate':if(validSource()&&count()>0&&(state.mode==='batch'||templatesReady())){startTask();}return;
      case 'pause':state.paused=!state.paused;if(!state.paused)tickTask();break;
      case 'new-batch':state.done=false;state.running=false;state.step=1;state.progress=0;state.failed=false;break;
      case 'download':toast(state.mode==='batch'?'演示：按“可生成文件”和“不适用说明”打包下载。设计稿不生成真实文件。':'演示：打包下载本次生成的 Word 文件。设计稿不生成真实文件。');return;
      case 'download-one':toast('演示：下载当前 Word 文件。设计稿不生成真实文件。');return;
      case 'retry':state.failed=false;state.resultTab='all';state.page=0;toast('演示：失败项重试成功，其余成果保留。');break;
      case 'page-prev':state.page=Math.max(0,state.page-1);break;
      case 'page-next':state.page+=1;break;
      case 'history':modal('生成记录',state.running?`<div class="bb-choice">${icon('file-clock')}<span>${state.mode==='batch'?'批量生成底稿':'按模板生成文件'}<small>${state.paused?'已暂停':'正在生成'} · ${count()} 份</small></span></div>`:state.history.length?state.history.slice(-3).reverse().map(x=>`<div class="bb-choice">${icon('folder-check')}<span>${esc(x.name)}<small>演示任务 · ${x.count} 份 · 已生成</small></span></div>`).join(''):`<div class="bb-empty">本项目还没有生成记录。<br>开始生成后，可在这里继续查看。</div>`,`${button('返回当前页面','close-modal','bb-primary')}`);return;
    }
    render();persist();
  });
  root.addEventListener('change',e=>{
    const el=e.target;
    if(el.dataset.documentType!==undefined){const old=el.dataset.documentType,type=el.value,index=old?state.documentTypes.indexOf(old):state.documentTypes.length;if(state.documentTypes.includes(type)||!documentCatalog.some(d=>d.id===type)){el.value=old;return;}if(old)state.documentTypes[index]=type;else{state.documentTypes.push(type);state.blankRow=false;}if(!templateFor(type)&&state.templates[type]?.length)state.templatePicks[type]=state.templates[type].at(-1).version;render();focusDocument(index);persist();return;}
    if(el.name==='bb-source-mode'){if(sourceBlocked()){applySourceMode();return;}state.sourceModes[state.entry]=el.value;applySourceMode();persist();return;}
    if(el.id==='bb-file-input'){if(el.files.length>1&&uploadKind!=='support'){toast('一次只能上传一份文件，请重新选择。');return;}for(const file of el.files)receiveFile(file);return;}
    if(el.id==='bb-project-source'){if(!el.value){el.value=state.picks[state.entry]||'';return;}state.picks[state.entry]=el.value;state.sourceMessage='本次材料选择已保存';render();root.querySelector('#bb-project-source')?.focus();persist();return;}
    if(el.dataset.group!==undefined){const gi=Number(el.dataset.group),ids=items.filter(x=>x.group===gi).map(x=>x.id);state.selected=el.checked?[...new Set([...state.selected,...ids])]:state.selected.filter(x=>!ids.includes(x));render();persist();}
    else if(el.dataset.item){state.selected=el.checked?[...new Set([...state.selected,el.dataset.item])]:state.selected.filter(x=>x!==el.dataset.item);render();persist();}
    else if(el.dataset.field){state[el.dataset.field]=el.value;if(el.tagName==='SELECT')render();persist();}
  });
  root.addEventListener('input',e=>{if(e.target.id==='bb-search'){state.query=e.target.value;updateSearch();}else if(e.target.dataset.field){state[e.target.dataset.field]=e.target.value;const saveNote=root.querySelector('[data-action=save-requirements]');if(saveNote)saveNote.disabled=!state.documentTypes.length||!state.requirementsDraft.trim();const saveTemplate=root.querySelector('[data-action=save-template]');if(saveTemplate)saveTemplate.disabled=!state.pendingTemplate||(state.templateTarget==='init'&&!state.broker.trim());}});
  root.addEventListener('toggle',e=>{const el=e.target;if(!el.isConnected)return;if(el.dataset.reused){const type=el.dataset.reused;if(state.reusedExpanded.includes(type)===el.open)return;state.reusedExpanded=el.open?[...state.reusedExpanded,type]:state.reusedExpanded.filter(t=>t!==type);persist();}if(el.dataset.optional&&state[el.dataset.optional]!==el.open){state[el.dataset.optional]=el.open;persist();}},true);
  root.addEventListener('dragover',e=>{if(e.target.closest('[data-drop]'))e.preventDefault();});
  root.addEventListener('drop',e=>{const target=e.target.closest('[data-drop]');if(target){e.preventDefault();uploadKind=target.dataset.drop;const files=[...e.dataTransfer.files];if(files.length>1&&uploadKind!=='support'){toast('一次只能上传一份文件，请重新选择。');return;}for(const file of files)receiveFile(file);}});
  root.addEventListener('keydown',e=>{if(!modalRoot.firstChild)return;if(e.key==='Escape'){closeModal();return;}if(e.key==='Tab'){const nodes=[...modalRoot.querySelectorAll('button:not(:disabled),input,select,textarea,a[href]')];const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{
    clearInterval(taskTimer);clearInterval(parseTimer);closeModal();state=freshState();state.step=1;
    if(controls.scenario==='empty'){state.library=[];state.picks={generate:'',review:'',qa:''};state.currentVersionId='';state.hasDirectory=false;}
    if(controls.scenario==='no-directory')state.hasDirectory=false;
    if(['versions','uploading','upload-error'].includes(controls.scenario)){state.library.push({id:'v2',name:'山东菏都发展投资有限公司2026年科技创新公司债券募集说明书（修订稿）.docx',version:'V2',status:controls.scenario==='versions'?'saved':controls.scenario==='uploading'?'uploading':'error',progress:0,owner:'generate',size:0});}
    if(controls.scenario==='versions'){state.currentVersionId='v2';state.picks.generate='v2';}
    if(['uploading','upload-error'].includes(controls.scenario))state.sourceModes.generate='upload';
    render();persist();if(controls.scenario==='uploading')startSourceUploads();
  }});tweak.addSelect(controls,'scenario',{label:'项目资料状态',options:[{label:'已有募集书和底稿目录',value:'existing'},{label:'项目有多个募集书版本',value:'versions'},{label:'只有募集说明书',value:'no-directory'},{label:'首次进入，尚无资料',value:'empty'},{label:'文件正在上传保存',value:'uploading'},{label:'文件上传失败',value:'upload-error'}]});tweak.addSelect(controls,'result',{label:'生成结果演示',options:[{label:'全部完成',value:'success'},{label:'部分失败，可单独重试',value:'partial'}]});}
})();
</script>
