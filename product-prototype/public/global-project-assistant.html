<style>

<script>
(() => {
 const root = document.getElementById('bb-agent-experience');

 let state={...defaults}; let popover=''; let pendingType=null; let toastTimer; let taskTimers=[]; let stateRevision=0;

 if(saved?.version===1){state={...defaults,...saved.state};stateRevision=saved.revision||0;if(state.job?.status==='running'){state.job={...state.job,status:'done',stage:3};state.view='done';}}

 function running(){const job=state.job;const stages=job.type==='review'?['读取项目材料','开展三维度复核','整理复核结果','交付报告']:['读取项目材料','编制与更新正文','整理 Word 文档','交付成果'];return assistantLabel()+'<div class="ba-response"><p>任务已开始。我会在这里更新进度，完成后把成果交给你。</p></div><div class="ba-task-card"><div class="ba-task-card-header"><strong>'+typeNames[job.type]+'</strong><span class="ba-tag">正在处理</span></div><div class="ba-task-card-body"><ol class="ba-run-list">'+stages.map((s,i)=>'<li class="'+(i===job.stage?'is-current':'')+'">'+icon(i<job.stage?'circle-check':i===job.stage?'circle-dot':'circle')+'<span>'+s+(i===job.stage?'<small>按已确认的任务要求执行</small>':'')+'</span></li>').join('')+'</ol><div class="ba-running-note">可以收起助手、切换页面，任务会继续运行。</div></div><div class="ba-cost"><div class="ba-cost-row"><span>已预留积分</span><span>'+job.fee.toLocaleString()+'</span></div><span class="ba-subtle">原型正在演示任务进度，不执行真实任务。</span></div></div><div class="ba-action-row"><button class="ba-link" data-action="close">收起，继续处理其他项目 '+icon('arrow-up-right')+'</button></div>';}

 function answer(){return userBubble(state.userText||'这份募集书，哪些地方最需要更新？')+assistantLabel()+'<div class="ba-response"><p>以这个示例项目为例，建议先处理这三处：</p><ol class="ba-findings"><li><strong>财务数据更新到最新一期。</strong><br>将财务分析中的数据口径统一到 2025 年 9 月，并同步核对正文、表格与摘要。<br><button class="ba-citation" data-action="source">'+icon('file-text')+'三季度财务报表</button></li><li><strong>核对偿债能力与风险提示。</strong><br>结合最新负债结构，检查相关分析是否仍然适用。</li><li><strong>检查全篇一致性。</strong><br>统一报告期、金额单位和前后引用。</li></ol><p>需要的话，我可以把这些整理成募集书更新任务。</p><button class="ba-button" data-intent="update" style="margin-top:12px">整理为更新任务 '+icon('arrow-right')+'</button></div>';}
 function generic(){return userBubble(state.userText)+assistantLabel()+'<div class="ba-response"><p>这是交互预览，你的消息已显示在对话中。正式接入后，BondBuddy 会结合你选定的项目和材料回答。</p><p>你可以继续体验把需求整理成任务，核对材料与要求后开始、查看进度和成果。</p><div class="ba-action-row"><button class="ba-button" data-intent="update">整理为更新任务</button><button class="ba-link" data-action="project-picker">选择项目</button></div></div>';}

 function renderPopover(){const el=$('[data-popover]');el.hidden=!popover;if(!popover)return;let heading='',body='';
  if(popover==='projects'){heading='选择对话关联的项目';body='<p class="ba-subtle">新的项目会开启独立对话，原对话保留。</p>'+Object.entries(projects).map(([id,p])=>'<button class="ba-project-option" data-select-project="'+id+'">'+p.name+'<small>'+p.market+' · '+p.type+' · '+p.files.length+' 份材料</small></button>').join('')+'<button class="ba-link" data-action="create-project">'+icon('plus')+'创建新项目</button>';
  }else if(popover==='new-project'){heading='先给新项目一个名称';body='<label class="ba-field">项目名称<input data-new-name placeholder="例如：三季度募集书更新"></label><label class="ba-field" style="margin-top:10px">发行人全称<input data-new-issuer placeholder="填写发行人全称"></label><div class="ba-help">后续根据任务补齐品种、交易所、报告期和材料。</div><div class="ba-validation" data-validation role="alert"></div><button class="ba-button ba-primary" style="margin-top:12px" data-action="save-project">创建并继续</button>';

  }else if(popover==='edit'){heading='调整本次任务';body='<label class="ba-field">补充要求<textarea data-edit-requirement rows="3">'+esc(state.requirement)+'</textarea></label>'+(state.taskType==='generate'?'<div class="ba-form-grid" style="margin-top:12px"><label class="ba-field">交易所<select data-edit-exchange><option '+(state.exchange==='上交所'?'selected':'')+'>上交所</option><option '+(state.exchange==='深交所'?'selected':'')+'>深交所</option></select></label><label class="ba-field">材料类型<select data-edit-type>'+['主承销商核查意见','法律意见书','募集说明书摘要'].map(n=>'<option '+(n===state.materialType?'selected':'')+'>'+n+'</option>').join('')+'</select></label></div>':'')+'<p class="ba-help">修改影响任务范围时，会重新展示报价供你确认。</p><button class="ba-button ba-primary" style="margin-top:12px" data-action="save-edit">保存并查看任务</button>';
  }else if(popover==='history'){heading='最近对话';body=(state.history.length?state.history.slice().reverse().map((h,i)=>'<button class="ba-history-item" data-restore="'+(state.history.length-1-i)+'">'+esc(h.title)+'<small>'+esc(h.projectName)+' · '+(h.job?.status==='running'?'进行中':h.job?.status==='done'?'已完成':'对话')+'</small></button>').join(''):'<p class="ba-subtle">还没有历史对话。关闭助手不会丢失当前对话。</p>');}
  el.innerHTML='<div class="ba-popover-heading"><strong>'+heading+'</strong><button class="ba-icon-button" data-action="close-popover" aria-label="关闭面板">'+icon('x')+'</button></div>'+body;
 }
 function archive(){if(state.view==='welcome'&&!state.chatProject)return;state.history.push({title:state.userText||typeNames[state.taskType],projectName:label(),chatProject:state.chatProject,view:state.view,taskType:state.taskType,job:state.job,requirement:state.requirement,selectedFiles:state.selectedFiles.slice(),custom:state.custom,userText:state.userText,materialType:state.materialType,exchange:state.exchange});state.history=state.history.slice(-5);}
 function resetChat(id=null){archive();state.chatProject=id;state.view='welcome';state.userText='';state.job=null;state.selectedFiles=(project()?.files||[]).map((_,i)=>i);state.draft='';$('#ba-message').value='';popover='';}
 function chooseProject(id){const intent=pendingType;resetChat(id);state.exchange=project()?.market||'上交所';pendingType=null;if(intent==='answer'){state.view='answer';state.userText='这份募集书，哪些地方最需要更新？';}else if(intent)prepareTask(intent);renderAssistant();save();}
 function prepareTask(type,text){state.open=true;state.taskType=type;if(!project()){pendingType=type;popover='projects';renderAssistant();return;}if(state.job?.status==='running'){toast('这个对话已有任务在运行。可新建对话，独立提交另一项任务。');return;}state.view='quote';state.userText=text||({update:'请结合项目材料，更新到最新一期，并给我修订版和清洁版 Word。',review:'请复核这份募集书，重点关注财务数据、合规披露和文本一致性。',generate:'请根据项目材料，生成一份主承销商核查意见。'}[type]);state.requirement=type==='review'?'重点复核财务数据、合规披露和文本一致性。':type==='generate'?'按所选交易所的编制要求生成，保留需要人工补充的事项。':'优先更新财务数据和风险提示，保留原有章节结构。';state.job=null;popover=type==='generate'?'edit':'';renderAssistant();save();}
 function startJob(){if(!state.selectedFiles.length){popover='materials';renderAssistant();toast('请先选择本次任务使用的材料。');return;}const fee=amounts[state.taskType];if(state.balance<fee){navigate('account');toast('积分不足。充值后回到任务卡片，再确认开始。');return;}const job={id:Date.now(),type:state.taskType,status:'running',stage:0,fee};state.job=job;state.balance-=fee;state.view='running';state.unread=false;popover='';renderAssistant();updateBalance();save();announce('示例任务已开始，积分已预留。');
  [1,2,3].forEach((stage,i)=>taskTimers.push(setTimeout(()=>{job.stage=stage;if(stage===3){job.status='done';state.unread=!state.open||state.job?.id!==job.id;if(state.job?.id===job.id)state.view='done';announce('示例成果已准备好。');}if(state.job?.id===job.id)state.job={...job};state.history.forEach(h=>{if(h.job?.id===job.id){h.job={...job};if(stage===3)h.view='done';}});renderAssistant();save();},(i+1)*4200)));
 }
 function submit(){const text=$('#ba-message').value.trim();if(!text)return;$('#ba-message').value='';state.draft='';state.userText=text;
  if(state.job?.status==='running'){toast('本次任务继续执行。新增修改会整理为下一次任务，由你再次确认；不会自动重复扣费。');return;}
  if(/复核|检查/.test(text))prepareTask('review',text);else if(/生成|法律意见|核查意见|摘要/.test(text))prepareTask('generate',text);else if(/更新|编制|修改/.test(text)&&!/[?？]|哪些|如何|怎么/.test(text))prepareTask('update',text);else{state.view='generic';renderAssistant();save();}
 }
 root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!root.contains(b))return;
  if(b.dataset.page){navigate(b.dataset.page);return;}
  if(b.dataset.openProject){state.resultType=b.dataset.openProject==='cheng'?'review':'generate';navigate('result',b.dataset.openProject);return;}
  if(b.dataset.intent){prepareTask(b.dataset.intent);return;}
  if(b.dataset.selectProject){chooseProject(b.dataset.selectProject);return;}
  if(b.dataset.restore!==undefined){const h=state.history[Number(b.dataset.restore)];archive();if(h){Object.assign(state,{...h,history:state.history,view:h.job?.status==='done'?'done':h.view});popover='';renderAssistant();save();}return;}
  const a=b.dataset.action;
  if(a==='open'){state.open=true;if(state.job?.status==='done')state.view='done';state.unread=false;renderAssistant();save();}
  else if(a==='close'){state.open=false;popover='';renderAssistant();save();$('[data-action="open"]').focus();}
  else if(a==='expand'){state.focus=!state.focus;renderAssistant();save();}
  else if(a==='new-chat'){resetChat(state.pageProject);state.open=true;renderAssistant();save();}
  else if(a==='history'){popover=popover==='history'?'':'history';renderAssistant();}
  else if(a==='project-picker'){popover=popover==='projects'?'':'projects';renderAssistant();}
  else if(a==='materials'||a==='attach'){popover=popover==='materials'?'':'materials';renderAssistant();}
  else if(a==='close-popover'){popover='';renderAssistant();}
  else if(a==='switch-current'){chooseProject(state.pageProject);}
  else if(a==='create-project'){popover='new-project';renderAssistant();}
  else if(a==='save-project'){const name=$('[data-new-name]').value.trim(),issuer=$('[data-new-issuer]').value.trim();if(!name||!issuer){$('[data-validation]').textContent='请填写项目名称和发行人。';fit();return;}const intent=pendingType;state.custom={name,issuer,market:'上交所',type:'待填写',period:'待填写',files:[]};resetChat('custom');pendingType=intent;popover='materials';renderAssistant();toast('新项目已建立（演示）。可在项目信息页继续补齐，再选择材料。');save();}
  else if(a==='edit-task'){popover='edit';renderAssistant();}
  else if(a==='save-edit'){state.requirement=$('[data-edit-requirement]').value.trim()||'按项目材料执行。';if($('[data-edit-exchange]'))state.exchange=$('[data-edit-exchange]').value;if($('[data-edit-type]'))state.materialType=$('[data-edit-type]').value;popover='';renderAssistant();save();}
  else if(a==='start')startJob();
  else if(a==='download')toast('这里演示下载入口。当前原型未执行任务，也未生成真实 Word 文件。');
  else if(a==='source')toast('正式产品会打开所引用的项目材料，并定位对应内容。');
  else if(a==='recharge')toast('这是充值入口预览，不会发起支付。任务需在充值后再次确认开始。');
  else if(a==='account')navigate('account');
  else if(a==='view-result'){state.open=false;state.resultType=state.job?.type||state.taskType;navigate('result',state.chatProject==='qing'?'qing':'cheng');toast('成果在对话和项目结果页都可找到；导航不会跳回工具入口。');}
  else if(a==='revise'){$('#ba-message').value='请在本次成果基础上，进一步修改：';$('#ba-message').focus();toast('继续写下修改要求。新的任务会单独展示积分，由你确认。');}
  else if(a==='ask-sample'){if(!project()){pendingType='answer';popover='projects';renderAssistant();}else{state.userText='这份募集书，哪些地方最需要更新？';state.view='answer';renderAssistant();save();}}
  else if(a==='ask-results'){state.open=true;if(state.chatProject!==state.pageProject)resetChat(state.pageProject);state.userText='这份募集书，哪些地方最需要更新？';state.view='answer';renderAssistant();save();}
  else if(a==='sample-progress'||a==='my-progress'){state.open=true;state.userText='我的项目现在进展到哪里了？';state.view='generic';renderAssistant();$('[data-conversation]').innerHTML=userBubble(state.userText)+assistantLabel()+'<div class="ba-response"><p>示例项目中，远山建设的募集书正在更新财务分析章节；澄川实业的复核结果和青禾产业的核查意见已经可以查看。</p><button class="ba-button" style="margin-top:14px" data-page="projects">查看全部项目</button></div>';icons();fit();save();}
  else if(a==='earlier'){b.outerHTML='<div class="ba-more-history">'+state.history.slice(-3).map(h=>'<p>'+esc(h.title)+'<br><small>'+esc(h.projectName)+'</small></p>').join('')+'</div>';fit();}
  else if(a==='form-continue')toast('常规表单流程继续保留。项目助手可以在任意页面随时唤起。');
 });
