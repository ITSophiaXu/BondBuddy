<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>复核进度 · 合成交互原型</title><link rel="stylesheet" href="/workspace-ux-preview.css"><link rel="stylesheet" href="/review-live-progress.css"></head>
<body><div id="app"></div><aside id="design-controls">交互原型 · 合成数据 <select id="demo-state"><option value="running">复核中</option><option value="paused">已暂停</option><option value="exhausted">积分用完</option><option value="queued">排队</option></select></aside>
<template id="review-live-design">
<div class="review-live-workspace">
  <header class="review-live-heading"><div><h2>复核进度</h2><p>财务数据 · 合规与格式 · 公开信息</p></div><span class="review-tag">第 1 轮</span></header>
  <section class="task-progress" aria-label="复核进度"><div class="task-progress-heading"><span class="task-progress-dot" aria-hidden="true"></span><div><strong role="status" id="demo-title">已执行财务数据核对</strong><p id="demo-summary">这项动作已完成，任务继续以已确认范围执行。</p></div></div>
  <ol class="task-progress-steps" aria-label="处理流程"><li><span>1</span>等待开始</li><li><span>2</span>准备材料</li><li class="current"><span>3</span>逐项复核</li><li><span>4</span>保存文档</li><li><span>5</span>可下载</li></ol>
  <details><summary>查看已完成的处理</summary><ul><li>已执行财务数据核对</li></ul></details><p class="task-progress-footnote">关闭页面后任务仍会继续，重新打开可查看最新进度。</p></section>
  <section class="authoring-credit-meter" aria-label="积分消耗"><div><span>当前已消耗</span><strong id="demo-points">120 <small>积分</small></strong></div><div class="authoring-credit-meta"><span id="demo-balance">可用余额 880 积分</span><span>有效处理 1分00秒</span><span id="demo-credit-note">已按实际进度扣减；余额归零时暂停，充值后继续。</span></div><details><summary>计费说明</summary><p>有积分即可开始，按服务端有效处理时间和已完成工作扣减；排队和暂停不扣。余额归零保存后暂停，到账后续跑。主动结束保留已扣部分，平台失败退回已扣积分，全程不超过原任务价格。</p></details></section>
  <div class="review-live-controls"><button class="btn secondary" id="demo-pause">暂停复核</button><button class="btn primary" id="demo-recharge" hidden>充值积分</button><button class="text-btn">结束本次复核</button></div>
  <section class="review-activity-log" aria-label="复核过程"><h3>复核过程</h3><p class="review-muted">展示本轮已返回的处理状态，随复核自动更新。</p><ol><li><time>18:00:00</time><span>正在核对财务数据</span></li><li><time>18:00:00</time><span>已执行财务数据核对</span></li></ol></section>
</div></template>
<script type="module">
// Independently authored design above; only the existing navigation shell is reused.
const scenes=await(await fetch('/workspace-ux-scenes.json')).json();document.querySelector('#app').innerHTML=scenes.materials;
document.querySelector('#review-phase-badge').textContent='处理中';
document.querySelector('#review-progress-bar')?.remove();document.querySelector('#review-workspace-steps')?.remove();
for(const name of ['materials','results'])document.querySelector('#review-'+name+'-panel')?.setAttribute('hidden','');
const panel=document.querySelector('#review-making-panel')||document.querySelector('#review-results-panel');panel.id='review-making-panel';panel.removeAttribute('hidden');panel.replaceChildren(document.querySelector('#review-live-design').content.cloneNode(true));
if(!document.querySelector('#review-tab-making')){const tab=document.createElement('button');tab.id='review-tab-making';tab.className='review-tab';tab.setAttribute('role','tab');tab.textContent='正在复核';document.querySelector('#review-tab-results').after(tab);}
for(const tab of document.querySelectorAll('[role=tab]'))tab.setAttribute('aria-selected',String(tab.id==='review-tab-making'));
const selector=document.querySelector('#demo-state');
function show(state){selector.value=state;const stopped=state==='paused'||state==='exhausted',queued=state==='queued';document.querySelector('#demo-title').textContent=state==='exhausted'?'积分已用完，复核已暂停':stopped?'复核已暂停':queued?'正在安排复核任务':'已执行财务数据核对';document.querySelector('#demo-summary').textContent=stopped?'积分已停止扣减，已完成的工作会保留。充值到账后继续同一次复核。':queued?'正在等待执行服务接单。排队期间不消耗积分。':'这项动作已完成，任务继续以已确认范围执行。';document.querySelector('#demo-pause').textContent=stopped?'继续复核':'暂停复核';document.querySelector('#demo-recharge').hidden=state!=='exhausted';document.querySelector('#demo-balance').textContent=state==='exhausted'?'可用余额 0 积分':'可用余额 880 积分';document.querySelector('#demo-credit-note').textContent=stopped?'积分已冻结，继续处理后再累计。':queued?'尚未开始处理，积分不会增加。':'已按实际进度扣减；余额归零时暂停，充值后继续。';document.querySelector('.task-progress-footnote').hidden=stopped;document.querySelectorAll('.task-progress-steps li').forEach((li,i)=>li.classList.toggle('current',i===(queued?0:2)));}
selector.onchange=()=>show(selector.value);document.querySelector('#demo-pause').onclick=()=>show(selector.value==='running'?'paused':'running');show(new URLSearchParams(location.search).get('state')||'running');
</script></body></html>
