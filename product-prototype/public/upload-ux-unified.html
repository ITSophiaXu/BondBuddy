<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BondBuddy · 统一上传组件</title>
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="upload-progress.css"><link rel="stylesheet" href="../../apps/web/src/upload-ux.css">
<style>body{background:#f6f8f2;color:#294a37;font-family:"Microsoft YaHei",sans-serif}main{max-width:1040px;margin:32px auto;padding:24px}section{padding:24px;margin:20px 0;background:#fff;border:1px solid #dce5d5;border-radius:8px}h1{font-size:26px}h2{font-size:18px;margin:0 0 16px}.help{font-size:13px;color:#63745b;line-height:1.7}.actions{display:flex;flex-wrap:wrap;gap:8px}.file{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}.name{overflow-wrap:anywhere;flex:1;min-width:180px}button{font:inherit}input{font:inherit}@media(max-width:600px){main{margin:0;padding:16px}section{padding:16px}.file .actions{width:100%}}</style></head>
<body><main><h1>统一上传组件</h1><p class="help">标准入口与紧凑入口共用文件状态和操作层级。以下为合成示例。</p>
<section><h2>选择文件</h2><p class="help">Word（DOCX）、PDF · 单份不超过 100 MB</p><label class="bb-upload-picker bb-upload-picker--standard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M4 15v6h16v-6"/></svg><span class="bb-upload-copy"><strong>选择文件</strong><small>或将文件拖到这里</small></span><input type="file" accept=".docx,.pdf" aria-label="选择文件"></label><label class="bb-upload-picker bb-upload-picker--compact">添加附件<input type="file" multiple aria-label="添加附件"></label></section>
<section><h2>正在上传</h2><div class="bb-upload-file"><strong>合成审计报告.pdf</strong><span class="file-upload-progress" data-upload-state="uploading"><span class="file-upload-progress-track"><progress max="100" value="45" aria-label="上传进度"></progress><span>45%</span></span><span class="file-upload-message">正在上传文件…</span></span></div></section>
<section><h2>正在保存</h2><div class="bb-upload-file"><strong>合成审计报告.pdf</strong><span class="file-upload-progress" data-upload-state="processing"><span class="file-upload-progress-track"><progress max="100" aria-label="正在保存"></progress></span><span class="file-upload-message">正在确认保存…</span></span></div></section>
<section><h2>需要处理</h2><div class="bb-upload-file needs-attention file"><div class="name"><strong>合成发行人募集说明书.docx</strong><p class="help">上传待确认</p></div><div class="actions"><button class="bb-upload-action bb-upload-action--primary">重试上传</button><button class="bb-upload-action">取消本次上传</button></div></div><p class="help">取消不会删除已保存的文件。</p></section>
<section><h2>需要原文件</h2><div class="bb-upload-file needs-attention"><strong>合成审计报告.pdf</strong><p class="help">请重新选择这份文件，选择后继续原上传。</p><label class="bb-upload-picker bb-upload-picker--compact">重新选择原文件<input type="file" aria-label="重新选择原文件"></label><button class="bb-upload-action">取消本次上传</button></div></section>
<section><h2>已保存</h2><div class="bb-upload-file"><strong>合成审计报告.pdf</strong><span class="file-upload-progress" data-upload-state="complete"><span class="file-upload-message">文件已保存。</span></span></div></section>
</main></body></html>
