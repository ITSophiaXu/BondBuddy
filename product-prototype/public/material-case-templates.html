<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>材料生成 · 案例模板</title>
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="material-results.css">
<link rel="stylesheet" href="project-workspace.css"><link rel="stylesheet" href="../../apps/web/src/m4-workspace.css"><link rel="stylesheet" href="../../apps/web/src/m4-prototype.css">
<style>[hidden]{display:none!important}main{max-width:1030px;margin:36px auto;padding:0 24px}.drop{padding:34px;text-align:center;border:1px dashed #c8d4dc;border-radius:8px;color:#667282}.help{font-size:12px;color:#73816e}select{width:100%;padding:10px;font:inherit}.field select{background:white}h1{margin-bottom:24px}button{cursor:pointer}@media(max-width:600px){main{padding:0 18px;margin:20px auto}}</style></head>
<body><main class="m4-page m4-generate"><h1>材料生成</h1><section class="panel form-card"><h2>要生成哪份材料</h2><div class="material-type-grid" id="types"></div><details class="studio-template-details"><summary>查看模板结构</summary><p class="help">按所选市场、品种和案例版式组织内容。</p><ol id="outline"></ol></details></section>
<section class="panel form-card"><h2 id="market-title">选择交易所</h2><label class="field">发行市场<select id="market"></select></label><label class="field" id="offering-label">债券品种<select id="offering"><option value="ppn">PPN · 定向债务融资工具</option><option value="mtn">MTN · 中期票据</option></select></label><label class="field">案例版式<select><option>自动采用基础版</option><option>参考版二</option></select></label><p class="help">保留案例的章节、标题、字体和表格格式；原项目事实与签署不沿用。</p></section>
<section class="panel form-card"><h2>这份材料依据哪份募集书</h2><p class="help">会从募集书和关联资料中提取信息；已关联的材料无需重复上传。</p><div class="drop">点击或拖入最新版募集说明书<br>DOCX / PDF</div></section><section class="panel form-card"><h2>补充资料</h2><div class="drop">决议、尽调记录、财务及用途证明等</div></section><div class="form-footer"><button id="generate" class="btn primary">生成申请书</button></div><p class="help">交互原型：本页不提交任务；实际生成由正式材料工作区的 API 和 worker 执行。</p></main>
<script type="module">const items=[['init','立项报告','按立项券商的模板组织项目情况、尽调结论和立项申请。'],['underwriter','主承销商核查意见','按核查事项组织依据、发现和待落实事项。'],['legal','法律意见书','根据项目事实和法律依据起草，逐项标注待核验事项。'],['private_summary','募集说明书摘要','按普通私募摘要结构提取募集书核心内容。'],['application','申请书','按交易所申请书案例的章节和格式编写。'],['recommendation','推荐函','按交易商协会 PPN 或中期票据案例编写。']];
document.querySelector('#types').innerHTML=items.map(([id,label,desc])=>`<label class="material-type"><input type="radio" name="type" value="${id}" ${id==='application'?'checked':''}> <strong>${label}</strong><span>${desc}</span></label>`).join('');
function paint(){document.querySelectorAll('.material-type').forEach(el=>el.classList.toggle('selected',el.querySelector('input').checked));const type=document.querySelector('[name=type]:checked').value,rec=type==='recommendation';document.querySelector('#market-title').textContent=rec?'选择市场与品种':'选择交易所';document.querySelector('#market').innerHTML=rec?'<option>中国银行间市场交易商协会</option>':'<option>上海证券交易所</option><option>深圳证券交易所</option>';document.querySelector('#offering-label').hidden=!rec;document.querySelector('#generate').textContent='生成'+items.find(x=>x[0]===type)[1];document.querySelector('#outline').innerHTML=(rec?['推荐人资质','发行人基本情况','尽调结论和推荐理由','批准与内部核查程序','结论']:['发行人概况','财务状况','发行方案','募集资金用途','增信与评级','偿债安排','合规事项']).map(t=>`<li>${t}</li>`).join('');}document.querySelector('#types').addEventListener('change',paint);paint();</script></body></html>
