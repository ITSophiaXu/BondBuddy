<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>募集书实时进度 · 交互原型</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f3;color:#24483e;font:16px/1.6 "Microsoft YaHei",sans-serif}main{max-width:1240px;margin:32px auto;padding:0 24px}nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}button{font:inherit;border:1px solid #dce4d9;border-radius:8px;background:white;color:inherit;padding:10px 18px;cursor:pointer}button:hover{background:#eff4e9}.panel{padding:28px;background:white;border:1px solid #e4e9df;border-radius:16px}.eyebrow{font-size:13px;letter-spacing:2px;color:#8a9a88;margin-bottom:14px}.status{padding:26px;border:1px solid #e0e8d7;border-radius:16px;background:#f3f6ef}.status h2{font-size:24px;margin:0 0 6px}.status p{color:#7b8e80;margin:0 0 24px}.steps{display:flex;gap:12px;list-style:none;padding:0;margin:0}.steps li{flex:1;padding-top:12px;border-top:2px solid #d9e1d3;font-size:14px}.steps .current{border-color:#628253;color:#365f3c;font-weight:600}.log{padding:16px 20px;border-left:2px solid #e8eee4;margin:24px 0;color:#748778;font-size:14px}.meter{margin:22px 0;padding:22px 24px;border:1px solid #dbe4d4;border-radius:12px;background:linear-gradient(110deg,#f4f7ef,#fff)}.meter strong{font-size:30px;font-weight:600;margin-left:18px;font-variant-numeric:tabular-nums}.meter small{font-size:14px;font-weight:400}.meta{font-size:13px;color:#778778;margin-top:10px}.meter details{font-size:12px;color:#778778;margin-top:14px}.meter summary{cursor:pointer}.muted{font-size:13px;color:#89978a}.actions{display:flex;gap:12px;margin-top:26px}footer{margin:20px 0;font-size:12px;color:#94a18e}@media(max-width:600px){main{margin:16px auto;padding:0 12px}.panel{padding:18px}.status{padding:18px}.status h2{font-size:20px}.steps{gap:6px;flex-wrap:nowrap}.steps li{flex:1;min-width:0;font-size:11px}.meter{padding:18px}.meter strong{font-size:26px}.actions{flex-wrap:wrap}}
</style><main><nav aria-label="切换合成状态"><button data-state="queued">排队</button><button data-state="running">编制中</button><button data-state="no_summary">尚无摘要</button><button data-state="stale">暂无新摘要</button><button data-state="pausing">正在暂停</button><button data-state="paused">已暂停</button><button data-state="cancelled">已结束</button></nav><section class="panel" id="prototype-progress"></section><footer>交互原型 · 全部为合成示例。生产状态和积分由服务端事件及账务规则提供。</footer></main><script>
const states={no_summary:['正在处理文档','暂未收到模型的具体进度说明；收到后会自动显示。',2,'1,830','1分30秒','按有效处理时间和已完成工作累计，完成后结算。'],stale:['正在编制募集书内容','最近一次模型进度：已完成目录核对，正在更新财务章节。 暂未收到新的进度说明；收到后会自动更新。',2,'1,830','1分30秒','按有效处理时间和已完成工作累计，完成后结算。'],queued:['仍在排队，尚未开始处理','前方有 2 个同类任务。已排队 1分30秒。排队期间不消耗积分。',0,'0','0秒','尚未开始处理，积分不会增加。'],running:['正在编制募集书内容','最近一次模型进度：已完成目录核对，正在更新财务章节。',2,'1,830','1分30秒','按有效处理时间和已完成工作累计，完成后结算。'],pausing:['正在保存进度后暂停','积分已冻结。当前模型处理结果保存后暂停，继续时会复用已保存的结果。',2,'1,830','1分30秒','积分已冻结，继续处理后再累计。'],paused:['任务已暂停','进度已保存，积分停止累计。可继续本次任务，或结束并结算已消耗积分。',2,'1,830','1分30秒','积分已冻结，继续处理后再累计。'],cancelled:['本轮已停止','任务已停止，已保存的材料和已有成果保留。',2,'1,830','1分30秒','未消耗的 47,070 积分已释放。']};
function render(key){const s=states[key];document.querySelector('#prototype-progress').innerHTML='<div class="eyebrow">募集书全文更新</div><section class="status"><h2>● '+s[0]+'</h2><p>'+s[1]+'</p><ol class="steps">'+['等待开始','准备材料','编制募集书','保存文档','可下载'].map((v,i)=>'<li class="'+(i===s[2]?'current':'')+'">'+(i+1)+' '+v+'</li>').join('')+'</ol></section><div class="log">'+(key==='queued'?'任务已提交，正在排队':key==='no_summary'?'处理步骤已返回：处理文档':'已完成目录核对，正在更新财务章节。<br>处理步骤已返回：处理文档')+'</div><section class="meter"><span>'+(key==='cancelled'?'本次已扣费':'当前已消耗')+'</span><strong>'+s[3]+' <small>积分</small></strong><div class="meta">有效处理 '+s[4]+'　'+s[5]+'</div><details><summary>计费说明</summary><p>排队、暂停、执行连接中断时不累计。暂停冻结累计金额；结束任务按已消耗积分结算，其余释放。平台失败不收费。任务完成时按原任务价格结算，全程不超过该价格。</p></details></section><p class="muted">关闭页面不会取消任务。编制开始后材料已锁定，仅可查看。</p><div class="actions">'+(key==='cancelled'?'<button onclick="render(\'queued\')">继续修改</button>':'<button onclick="render(\'cancelled\')">停止本次任务</button><button onclick="render(\''+(key==='paused'||key==='pausing'?'running':'pausing')+'\')">'+(key==='paused'||key==='pausing'?'继续本次任务':'暂停任务')+'</button>')+'<button>查看材料</button></div>'}
document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>render(b.dataset.state));render(new URLSearchParams(location.search).get('state')||'running');
</script></html>
