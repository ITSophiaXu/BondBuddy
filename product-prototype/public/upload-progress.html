<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BondBuddy · 统一上传进度</title>
<link rel="stylesheet" href="upload-progress.css">
<style>*{box-sizing:border-box}body{margin:0;background:#f7f8f2;color:#183a3e;font-family:system-ui,"Microsoft YaHei",sans-serif;line-height:1.6}main{max-width:980px;margin:48px auto;padding:24px}h1{font-size:28px}article{padding:24px;border:1px solid #e1e7df;border-radius:12px;background:white;margin:20px 0}strong{overflow-wrap:anywhere}button{background:white;border:1px solid #aebfb4;border-radius:6px;color:#285745;padding:8px 18px;font:inherit}small{color:#64776c}@media(max-width:600px){main{margin:0;padding:16px}article{padding:18px}}</style>
<main>
  <h1>文件上传</h1><p>统一进度展示 · 交互样式原型（演示数据）</p>
  <article><h2>历史／参考募集书</h2><strong>发行人2026年面向专业投资者非公开发行公司债券募集说明书.docx</strong>
    <span class="file-upload-progress" data-upload-state="uploading"><span class="file-upload-progress-track"><progress max="100" value="36" aria-label="募集说明书 上传进度" aria-valuetext="正在上传文件… 36%"></progress><span class="file-upload-percent">36%</span></span><span class="file-upload-message" role="status">正在上传文件…</span></span>
  </article>
  <article><h2>历史／参考募集书</h2><strong>募集说明书.docx</strong>
    <span class="file-upload-progress" data-upload-state="uploading"><span class="file-upload-progress-track"><progress max="100" value="90" aria-label="募集说明书 上传进度" aria-valuetext="正在上传文件… 90%"></progress><span class="file-upload-percent">90%</span></span><span class="file-upload-message" role="status">正在上传文件…</span></span>
  </article>
  <article><h2>补充资料</h2><strong>2026年财务报告及附注.pdf</strong>
    <span class="file-upload-progress" data-upload-state="complete"><span class="file-upload-progress-track"><progress max="100" value="100" aria-label="财务报告 上传进度" aria-valuetext="上传成功 100%"></progress><span class="file-upload-percent">100%</span></span><span class="file-upload-message" role="status">上传成功</span></span>
  </article>
  <article><h2>补充资料</h2><strong>发行人营业执照.pdf</strong>
    <span class="file-upload-progress" data-upload-state="error"><span class="file-upload-progress-track"><progress max="100" value="90" aria-label="营业执照 上传进度" aria-valuetext="上传未完成，请重试。"></progress></span><span class="file-upload-message" role="alert">上传未完成，请重试。</span></span><button>重试此文件</button>
  </article>
  <small>以上为同一上传流程的状态示例，不上传真实文件或创建任务。</small>
</main>
</html>
