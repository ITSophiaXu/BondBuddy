<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>审计 PDF 清晰度检查</title>
<style>:root{--muted:#6d766b;--green:#41583d}*{box-sizing:border-box}body{margin:0;padding:24px;background:#f7f8f2;color:#253021;font:14px/1.7 system-ui,sans-serif}main{max-width:760px;margin:32px auto}.panel{padding:24px;background:white;border:1px solid #dfe5da;border-radius:12px}h1{font-size:24px;margin:0 0 8px}h2{font-size:16px;margin:0 0 16px}.file{border:1px solid #dfe5da;border-radius:8px;padding:16px}.filename{font-weight:600;overflow-wrap:anywhere}p{margin:5px 0}.note{font-size:12px;color:#6d766b;margin-bottom:20px}.material-processing{margin-top:6px;overflow-wrap:anywhere}.processing-title{font-size:12px;font-weight:600;color:var(--muted)}.processing-hint{font-size:11px;color:var(--muted);line-height:1.7}.material-quality-warning{color:#786024}@media(max-width:600px){body{padding:16px}.panel{padding:16px}main{margin:12px auto}}.material-processing[data-tone="ready"] .processing-title{color:var(--green)}.material-processing[data-tone="error"] .processing-title{color:#923e29}.text-button{border:0;background:none;color:var(--green);padding:6px 0;min-height:36px}button:disabled{padding:10px 24px;border:0;border-radius:8px;color:#72796e;background:#e8ebe4;cursor:not-allowed}</style></head>
<body><main><h1>项目材料</h1><p class="note">合成示例 · 募集书更新材料步骤</p><section class="panel"><h2>审计报告（可含报表及附注）（必填）</h2><div class="file"><p class="filename">合成审计报告.pdf</p><p class="note">服务器已确认保存</p><div id="status"><div class="material-processing" data-tone="ready"><p class="processing-title" role="status">清晰度抽查完成</p><p class="processing-hint material-quality-warning" role="status">已抽查 1 页。部分页面分辨率偏低，可继续；建议优先使用清晰电子版，并核对生成后的财务数字。</p></div></div><button class="text-button" type="button">删除</button></div><p class="note"></p><button type="button">下一步</button></section></main></body></html>
