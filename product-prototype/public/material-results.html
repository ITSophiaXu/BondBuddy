<!doctype html>
<html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>材料生成 · 进度与成果原型</title>
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="material-results.css"><link rel="stylesheet" href="../../apps/web/src/task-progress.css"><link rel="stylesheet" href="../../apps/web/src/artifact-page.css">
<style>body{padding:24px}.m4-page{width:1050px;max-width:100%;margin:auto;color:#213c33}.m4-muted{color:#73816e;font-size:12px;line-height:1.8}.m4-file-kind svg{fill:none;stroke:currentColor;stroke-width:1.7}.m4-fixed-input{font-size:12px;line-height:1.9}.m4-fixed-input dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 12px}.m4-fixed-input dd{margin:0}.m4-fixed-input dt{color:#73816e}@media(max-width:700px){body{padding:20px}}
</style><main class="m4-page" id="material-result" style="padding:0"></main>
<script type="module">
// Synthetic review prototype. Hash selects the observed state; no task or download is submitted.
const state=location.hash.slice(1)||'running',done=state==='succeeded',failed=state==='failed',phase=done?4:2;
const title=done?'文档已生成，可下载':failed?'本轮未完成':'正在生成材料正文';
const summary=done?'':failed?'本轮未完成，已保存的材料和已有成果保留。':'正在根据本次材料和要求生成文档，完成后会自动更新此页。';
const labels=['等待开始','准备材料','生成材料','准备下载','已完成'];
const progress=`<section class="task-progress"><div class="task-progress-heading"><span class="task-progress-dot ${done||failed?'terminal':''}"></span><div><strong>${title}</strong>${summary?`<p>${summary}</p>`:''}</div></div><ol class="task-progress-steps">${labels.map((s,i)=>`<li class="${i===phase?'current':''}"><span>${i+1}</span>${s}</li>`).join('')}</ol>${!done&&!failed?'<p class="task-progress-footnote">关闭页面后任务仍会继续，重新打开可查看最新进度。</p>':''}</section>`;
const file=(name,label,description,primary)=>`<article class="artifact-file"><div class="m4-file-kind"><svg viewBox="0 0 24 24"><path d="M14 2H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9 M14 2v7h7 M7 13h10 M7 17h7"/></svg><h3>${label}</h3></div><p>${description}</p><p class="m4-muted">${name}</p><button class="btn ${primary?'primary':'secondary'}">下载${label}</button><p class="artifact-download-status"></p></article>`;
document.querySelector('main').innerHTML=`<section class="panel m4-delivery"><header class="m4-delivery-head"><div><h2>普通私募募集说明书摘要</h2><p class="m4-muted">${done?'第 2 稿':'合成发行人'} · 2026年10月6日 08:00${done?'':' 提交'}</p></div>${done?'<button class="btn secondary">继续修改</button>':''}</header>${progress}${done?`<h3>成果与下载</h3><p class="m4-muted">下载已有文件不会发起新任务或重复扣费。</p><div class="artifact-files">${file('合成发行人_募集说明书摘要_V2_20261006.docx','正文 Word','可编辑的材料正文，供审阅和后续修改。',true)}${file('合成发行人_募集说明书摘要编制说明_V2_20261006.docx','编制说明','查看编制依据、材料缺口和需人工确认的事项。',false)}</div>`:`<div class="m4-delivery-actions"><button class="btn secondary">${failed?'返回材料并重试':'查看与补充材料'}</button>${failed?'':'<button class="text-btn">停止本次任务</button>'}<button class="text-btn">查看此前成果</button></div><p class="m4-muted">${failed?'材料和要求已保留，可修改后再次生成。':'补充材料与修改要求将用于下一轮，本次任务继续使用已提交的内容。'}</p>`}</section>${done?'<section class="panel m4-delivery-details"><details><summary>查看正文预览</summary><p>合成正文，用于展示阅读位置。</p></details></section>':''}<section class="panel m4-delivery-details"><details class="m4-fixed-input"><summary>查看本次材料与要求</summary><p>合成来源募集书；本轮采用已提交的材料和要求。</p></details><details><summary>查看处理记录</summary><p>按后台实际记录展示。</p></details><details><summary>来源与版本</summary><p>保留任务、输入及文件准确引用。</p></details></section>`;
</script></html>
