<!doctype html>
<html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>材料生成 · 进度与成果原型</title>
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="material-results.css"><link rel="stylesheet" href="../../apps/web/src/task-progress.css"><link rel="stylesheet" href="../../apps/web/src/artifact-page.css">
<link rel="stylesheet" href="../../apps/web/src/project-execution.css"><link rel="stylesheet" href="../../apps/web/src/material-progress.css"><style>body{padding:24px}.m4-page{width:1050px;max-width:100%;margin:auto;color:#213c33}.m4-muted{color:#73816e;font-size:12px;line-height:1.8}.m4-file-kind svg{fill:none;stroke:currentColor;stroke-width:1.7}.m4-fixed-input{font-size:12px;line-height:1.9}.m4-fixed-input dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 12px}.m4-fixed-input dd{margin:0}.m4-fixed-input dt{color:#73816e}@media(max-width:700px){body{padding:20px}}
</style><main class="m4-page" id="material-result" style="padding:0"></main>
<script type="module">
// Synthetic review prototype. Hash selects the observed state; no task or download is submitted.
const state=location.hash.slice(1)||'running',done=state==='succeeded',failed=state==='failed',paused=['paused','exhausted'].includes(state),phase=done?4:2;
const title=done?'文档已生成，可下载':failed?'本轮未完成':state==='exhausted'?'积分已用完，任务已暂停':paused?'任务已暂停':'正在读取本次材料';
const summary=done?'':failed?'本轮未完成，已保存的材料和已有成果保留。':paused?'进度已保存，积分停止累计。充值到账后可继续本次任务。':'正在核对发行人信息与财务材料。状态随模型处理自动更新。';
const labels=['等待开始','准备材料','生成材料','保存文档','可下载'];
const progress=`<section class="task-progress"><div class="task-progress-heading"><span class="task-progress-dot ${done||failed?'terminal':''}"></span><div><strong>${title}</strong>${summary?`<p>${summary}</p>`:''}</div></div><ol class="task-progress-steps">${labels.map((s,i)=>`<li class="${i===phase?'current':''}"><span>${i+1}</span>${s}</li>`).join('')}</ol>${!done&&!failed&&!paused?'<p class="task-progress-footnote">关闭页面后任务仍会继续，重新打开可查看最新进度。</p>':''}</section>`;
const file=(name,label,description,primary)=>`<article class="artifact-file"><div class="m4-file-kind"><svg viewBox="0 0 24 24"><path d="M14 2H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9 M14 2v7h7 M7 13h10 M7 17h7"/></svg><h3>${label}</h3></div><p>${description}</p><p class="m4-muted">${name}</p><button class="btn ${primary?'primary':'secondary'}">下载${label}</button><p class="artifact-download-status"></p></article>`;
const meter=`<section class="authoring-credit-meter" aria-label="积分消耗"><div><span>${done||failed?'本次已扣费':'当前已消耗'}</span><strong role="status">${done?'4,500':failed?'0':state==='exhausted'?'1,000':'125'} <small>积分</small></strong></div><div class="authoring-credit-meta"><span>可用余额 ${state==='exhausted'?'0':'875'} 积分</span><span>有效处理 1分05秒</span><span>${paused?'积分已停止扣减，继续处理后再累计。':done?'结算已完成。':failed?'平台失败，已扣积分已退回。':'已按实际进度扣减；余额归零时暂停，充值后继续。'}</span></div><details><summary>计费说明</summary><p>每份材料共 4,500 积分，按有效处理时间和已完成工作扣减。排队和暂停不扣；主动结束保留已扣部分，平台失败退回已扣积分。</p></details></section>`;
const log='<section class="material-activity-log" aria-label="生成过程"><h3>生成过程</h3><p class="m4-muted">记录本轮已返回的处理状态，随生成自动更新。</p><ol><li><time>08:00:00</time><span>正在核对发行人信息与财务材料</span></li></ol></section>';
document.querySelector('main').innerHTML=`<section class="panel m4-delivery"><header class="m4-delivery-head"><div><h2>募集说明书摘要</h2><p class="m4-muted">${done?'第 2 稿':'合成发行人'} · 2026年10月6日 08:00${done?'':' 提交'}</p></div>${done?'<button class="btn secondary">继续修改</button>':''}</header>${progress}${meter}${done?`<h3>成果与下载</h3><p class="m4-muted">下载已有文件不会发起新任务或重复扣费。</p><div class="artifact-files">${file('合成发行人_募集说明书摘要_V2_20261006.docx','正文 Word','可编辑的材料正文，供审阅和后续修改。',true)}${file('合成发行人_募集说明书摘要编制说明_V2_20261006.docx','编制说明','查看编制依据、材料缺口和需人工确认的事项。',false)}</div>`:`<div class="m4-delivery-actions">${failed||state==='exhausted'?'':`<button class="btn secondary">${paused?'继续生成':'暂停生成'}</button>`}${state==='exhausted'?'<button class="btn primary">充值积分</button>':''}<button class="btn secondary">${failed?'返回材料并重试':'查看与补充材料'}</button>${failed?'':'<button class="text-btn">结束本次生成</button>'}<button class="text-btn">查看此前成果</button></div><p class="m4-muted">${failed?'材料和要求已保留，可修改后再次生成。':'补充材料与修改要求将用于下一轮，本次任务继续使用已提交的内容。'}</p>`}${log}</section>${done?'<section class="panel m4-delivery-details"><details><summary>查看正文预览</summary><p>合成正文，用于展示阅读位置。</p></details></section>':''}<section class="panel m4-delivery-details"><details class="m4-fixed-input"><summary>查看本次材料与要求</summary><p>合成来源募集书；本轮采用已提交的材料和要求。</p></details></section>`;
</script></html>
