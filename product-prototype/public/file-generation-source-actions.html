<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BondBuddy · 文件生成操作层级</title>
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="file-generation-ux.css"><link rel="stylesheet" href="../../apps/web/src/generation-flow.css">
<style>body{margin:0;background:#f7f8f2;color:#23372c;font-family:"Microsoft YaHei",sans-serif}main{max-width:1040px;margin:40px auto;padding:24px}.pf-source-picker{padding:28px;background:#fff;border:1px solid #e0e6dc;border-radius:8px}.pf-source-actions{display:flex;justify-content:flex-end;margin-top:20px;padding-top:20px;border-top:1px solid #e0e6dc}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:7px;cursor:pointer;font:inherit}.btn.primary{background:#264c39;color:#fff;border:1px solid #264c39;padding:10px 18px}.btn:disabled{opacity:.45;cursor:default}@media(max-width:600px){main{margin:0;padding:16px}.pf-source-picker{padding:18px}}</style></head>
<body><main class="pf-source-workspace" id="reference"></main><script>
const state=new URLSearchParams(location.search).get('state')||'empty';
const filename='合成发行人2026年度第一期公司债券募集说明书.docx';
const fileIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M14 2H5v20h14V7zM14 2v5h5M8 12h8M8 16h8"/></svg>';
const uploadIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 16V3m-5 5 5-5 5 5M4 15v6h16v-6"/></svg>';
const recovering=state==='recovery',selected=state==='selected',uploading=state==='uploading';
document.querySelector('#reference').innerHTML=`<section class="panel pf-generation-prospectus pf-source-picker"><h2>选择募集说明书</h2>${recovering?`<article class="pf-source-upload-state needs-attention"><div class="pf-upload-file">${fileIcon}<div><strong>${filename}</strong><span>上传待确认</span></div></div><div class="pf-upload-actions"><button class="btn primary">重试上传</button><button class="btn secondary">取消本次上传</button></div></article><p class="pf-source-help pf-recovery-help">重试可继续处理；取消不会删除已保存的文件。</p>`:selected?`<section class="pf-selected-source" aria-label="本次生成依据"><span class="pf-selected-label">已选择 · V1</span><strong>${filename}</strong></section>`:`<p class="pf-source-help">支持 Word（.docx）和 PDF · 单份不超过 100 MB</p><button class="pf-source-drop" ${uploading?'disabled':''}>${uploadIcon}<span><strong>选择文件</strong><small>或将文件拖到这里</small></span></button>${uploading?`<p role="status">正在上传 · 45%</p>`:''}`}</section><footer class="pf-source-actions"><button class="btn primary" ${selected?'':'disabled'}>下一步：选择生成内容 →</button></footer>`;
</script></body></html>
