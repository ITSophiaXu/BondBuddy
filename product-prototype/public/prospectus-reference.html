<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BondBuddy · 历史／参考募集书</title>
<link rel="stylesheet" href="../../apps/web/src/style.css"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="project-workspace.css"><link rel="stylesheet" href="../../apps/web/src/prototype-adapter.css"><link rel="stylesheet" href="prospectus-panel.css"><link rel="stylesheet" href="../../apps/web/src/prospectus-saved-reentry.css"><link rel="stylesheet" href="../../apps/web/src/prospectus-reference.css">
</head><body><main style="max-width:1160px;margin:0 auto;padding:32px 20px"><section class="panel prospectus-panel reference-prospectus" aria-label="历史／参考募集书（选填）">
<header class="prospectus-panel-heading"><div><h2>历史／参考募集书（选填）</h2><p>上传本企业历史稿或相似企业募集书，作为本次更新的原稿或结构参考。</p></div><button class="btn secondary" id="choose"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V3 M7 8l5-5 5 5 M4 15v5h16v-5"/></svg>上传历史／参考稿</button></header>
<p class="prospectus-upload-hint">Word（.docx）/ PDF · 单份不超过 100 MB · 选择后自动保存，选用后参与更新。</p>
<section class="reference-files" aria-label="已上传文件"><h3>已上传文件 <span class="reference-file-count" id="count">0</span></h3><div id="files"></div></section>
<p class="reference-selection-help" id="help"><button class="text-button" id="skip">先提供发行人材料 →</button></p>
<input type="file" id="file" accept=".docx,.pdf" hidden><p role="status" id="prospectus-status"></p>
</section><p style="font-size:12px;color:#69766b">交互原型 · 合成示例，文件选择仅作本地演示，不调用 API。<a href="?state=empty">未上传</a> / <a href="?state=saved">已上传</a> / <a href="?state=multiple">多份文件</a></p></main>
<script>
const $=id=>document.getElementById(id),esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
const state=new URLSearchParams(location.search).get('state');
let files=state==='saved'||state==='multiple'?[{id:1,name:'合成历史募集书.docx'}]:[],selected=null;
if(state==='multiple')files.push({id:2,name:'相似业务企业2025年度第一期公司债券募集说明书_含财务报表及附注_供本次结构参考.docx'});
function render(){
  $('count').textContent=files.length;$('help').hidden=selected!==null;
  $('files').innerHTML=files.length?[...files].sort((a,b)=>Number(b.id===selected)-Number(a.id===selected)||b.id-a.id).map(f=>`<div class="prospectus-version reference-file ${f.id===selected?'is-selected':''}"><span class="prospectus-file-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M14 2H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9 M14 2v7h7 M7 13h10 M7 17h7"/></svg></span><div class="prospectus-version-info"><strong>${esc(f.name)}</strong><div class="reference-file-meta"><span class="reference-selection ${f.id===selected?'is-selected':''}">${f.id===selected?'本次更新已选用':'未选用'}</span><small>${esc(f.name.split('.').at(-1).toUpperCase())} · V${f.id} · 2026/10/25 10:00:00</small></div><details><summary>文件版本详情</summary><p>合成示例文件 · V${f.id}</p></details></div><div class="prospectus-version-actions">${f.id===selected?'':`<button class="btn secondary" data-use="${f.id}">用于本次更新</button>`}<button class="text-button" data-download="${f.id}">下载原文件</button>${f.id===selected?'':`<button class="text-button prospectus-delete" data-remove="${f.id}">删除</button>`}</div></div>`).join(''):'<p class="reference-empty">尚未上传历史／参考募集书。没有参考稿也可以继续。</p>';
  document.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{if(confirm('将这份稿件用于本次更新？此操作不启动任务或扣费。')){selected=Number(b.dataset.use);render();}});
  document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(confirm('删除这份尚未使用的上传文件？')){files=files.filter(f=>f.id!==Number(b.dataset.remove));render();}});
  document.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>$('prospectus-status').textContent='原型使用合成示例，未保存可下载的原件。');
}
$('choose').onclick=()=>$('file').click();
$('file').onchange=()=>{const f=$('file').files[0];if(!f)return;if(!/\.(docx|pdf)$/i.test(f.name)||!f.size||f.size>100*1024*1024){$('prospectus-status').textContent='请上传不超过 100 MB 的 DOCX 或 PDF 文件。';return;}files.push({id:Math.max(0,...files.map(f=>f.id))+1,name:f.name});render();$('prospectus-status').textContent='演示文件已显示在列表中；未实际上传。';$('file').value='';};
$('skip').onclick=()=>$('prospectus-status').textContent='继续提供审计报告、财务报表及附注。';render();
</script></body></html>
