<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目问答 · 项目资料与回答</title>
<link rel="stylesheet" href="../../apps/web/src/style.css"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="../../apps/web/src/prototype-adapter.css"><link rel="stylesheet" href="../../apps/web/src/file-workspace.css"><link rel="stylesheet" href="../../apps/web/src/project-qa-workspace.css">
<style>body{display:block!important;margin:0!important;padding:24px}main{max-width:1120px;padding:0;margin:auto}.prototype-controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px;font:13px "Microsoft YaHei",sans-serif}.qa-upload-icon svg{fill:none;stroke:currentColor}section[hidden]{display:none}</style><link rel="stylesheet" href="workspace-typography.css"></head>
<body class="prototype-app"><main><nav class="prototype-controls"><button class="btn secondary" data-show="upload">项目资料未齐</button><button class="btn secondary" data-show="questions">确认问题</button><button class="btn secondary" data-show="result">回答与补件</button><span>合成示例 · 仅展示交互，无模型或计费</span></nav><section class="qa-page" data-view="upload"></section><section class="qa-page" data-view="questions" hidden></section><section class="qa-page" data-view="result" hidden></section></main>
<script>
const icon='<svg viewBox="0 0 24 24"><path d="M14 2H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9 M14 2v7h7 M7 13h10 M7 17h7"/></svg>';
const header='<header class="page-head"><div><p class="eyebrow">PROJECT Q&amp;A</p><h1>项目问答</h1><p>基于募集说明书和项目资料逐题回答，资料不足时明确列出补充要求。</p></div><a class="text-button" href="#">更换项目</a></header>';
const steps=active=>'<ol class="qa-workflow" aria-label="项目问答流程">'+['确认项目资料','确认问题','回答与补件'].map((x,i)=>`<li ${i===active?'aria-current="step"':''}><span>${i+1}</span>${x}</li>`).join('')+'</ol>';
const materials=ready=>`<section class="panel qa-project-materials" aria-label="项目资料"><header><div><h2>项目资料</h2><p>募集说明书是回答的必需资料，财务报告、业务明细等可在确认问题时补充。</p></div><span class="qa-material-badge ${ready?'':'is-missing'}">${ready?'募集说明书已就绪':'缺少募集说明书'}</span></header><div class="qa-prospectus-row"><span class="qa-upload-icon" aria-hidden="true">${icon}</span><div><strong>${ready?'合成募集书_清洁版_v4.docx':'先提供本项目募集说明书'}</strong><p>${ready?'采用版本 V4 · 已纳入本轮材料':'问题清单可以先上传整理；补齐募集说明书后才能开始回答。'}</p></div><button class="btn ${ready?'secondary':'primary'}">${ready?'管理募集说明书':'上传或选择募集说明书'}</button></div><footer><button class="text-button">刷新项目资料</button></footer></section>`;
const upload=empty=>`<section class="panel qa-upload ${empty?'qa-upload-empty':'qa-upload-compact'}"><div class="qa-upload-icon" aria-hidden="true">${icon}</div><div class="qa-upload-copy"><h2>${empty?'上传问题清单':'问题清单'}</h2><p>${empty?'选择 Word 或 PDF，结合本项目材料逐题回答。':'合成问题清单_v2.docx'}</p></div><label class="btn ${empty?'primary':'secondary'}">${empty?'选择问题清单':'更换问题清单'}<input type="file" accept=".docx,.doc,.pdf"></label>${empty?'<small>支持 DOCX、DOC、PDF · 单份不超过 100 MB<br>免费识别并确认问题 · 开始回答前核对费用，每题 60 积分</small><p class="qa-format-note">支持可检索的 PDF；扫描页请补充可提取文字的文件。</p>':''}</section>`;
const deliver='<div class="qa-deliverables"><div><span>'+icon+'</span><div><h3>回答完成后下载 Word</h3><p>先在页面审阅回答，再下载包含回答、依据和补件要求的文件。</p></div></div><div><span>'+icon+'</span><div><h3>待补材料清单</h3><p>逐题列出缺少的材料，补齐后可继续生成新版本。</p></div></div></div>';
const questions=['请说明本期偿债资金来源。','请说明收入变动原因。','请说明关联交易的定价依据。'];
document.querySelector('[data-view="upload"]').innerHTML=header+steps(0)+'<div class="qa-layout">'+materials(false)+upload(true)+deliver+'</div>';
document.querySelector('[data-view="questions"]').innerHTML=header+steps(1)+'<div class="qa-layout">'+materials(true)+upload(false)+`<section class="panel qa-document"><h2>确认问题</h2><div class="qa-prepared"><div class="qa-prepared-heading"><span class="qa-material-badge">待确认问题</span><h3>识别到 3 个候选问题</h3><p>请核对问题是否完整，合并同一问题的小问，再结合项目资料开始回答。</p></div><ol class="qa-candidate-list">${questions.map((q,i)=>`<li><p>${q}</p><small>原文段落 ${i+1}</small></li>`).join('')}</ol><footer class="qa-actions"><p>识别免费 · 尚未开始回答</p><button class="btn primary" data-show="result">确认问题，准备回答</button></footer></div></section></div>`;
document.querySelector('[data-view="result"]').innerHTML=header+steps(2)+'<div class="qa-layout">'+materials(true)+upload(false)+`<section class="panel qa-document"><h2>回答文档</h2><section class="qa-download-card"><div><h3>回答文档已生成</h3><p>含本轮回答、依据及待补材料</p></div><button class="btn primary" disabled>下载回答文档（Word）</button></section><section class="qa-missing-list"><header><h3>待补材料清单</h3><span>2 个问题待补充</span></header><p>补齐以下材料后，可选择对应问题生成新版本。</p><ol><li><h4>问题 1 · ${questions[0]}</h4><ul><li>请补充债务到期及偿付安排、可用资金和预计现金流明细（期间、金额、受限情况），用于核对偿债来源与覆盖能力。</li></ul></li><li><h4>问题 3 · ${questions[2]}</h4><ul><li>请补充报告期关联交易明细、合同和定价说明，用于核对交易背景及定价公允性。</li></ul></li></ol></section><details class="qa-answer"><summary><b>问题 2</b><span>${questions[1]}</span><small>回答草稿</small></summary><p>合成示例：逐项列示已有资料支持的回答及引用，仍需人工审阅。</p></details></section></div>`;
for(const b of document.querySelectorAll('[data-show]'))b.onclick=()=>{for(const section of document.querySelectorAll('[data-view]'))section.hidden=section.dataset.view!==b.dataset.show;};
</script></body></html>
