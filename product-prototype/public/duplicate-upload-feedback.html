<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>重复文件上传反馈</title>
<link rel="stylesheet" href="duplicate-upload-feedback.css">
<style>body{margin:0;padding:24px;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#253041;background:#f7f8fa}main{max-width:760px;margin:auto}section{background:white;padding:20px;border:1px solid #e4e8ec;border-radius:12px}h1{font-size:22px}h2{font-size:16px}.file{padding:12px 0;border-bottom:1px solid #eee}.file p{font-size:13px;color:#64748b}button{padding:8px 12px;border:1px solid #ccd3db;background:white;border-radius:8px}input{max-width:100%}</style></head>
<body><main><h1>上传材料</h1><p>合成交互原型 · 更新、复核、材料生成和助手采用同一提示。</p><section><h2>审计报告 / 财务报表及附注</h2><p>选择文件后立即添加；同内容文件只保留一份。</p><input type="file" multiple aria-label="选择合成材料"><div id="files"></div><ul class="duplicate-upload-notices"><li class="duplicate-upload-notice" role="status">合成审计报告副本.pdf：重复文件，已存在，未重复添加。已保留原文件“合成审计报告.pdf”。</li></ul></section></main>
<script type="module">
const files=new Map(),list=document.querySelector('#files'),notices=document.querySelector('.duplicate-upload-notices');
document.querySelector('input').addEventListener('change',async e=>{for(const file of e.target.files){const digest=await crypto.subtle.digest('SHA-256',await file.arrayBuffer()),hash=Array.from(new Uint8Array(digest),v=>v.toString(16).padStart(2,'0')).join('');if(files.has(hash)){const row=document.createElement('li');row.className='duplicate-upload-notice';row.role='status';row.textContent=`${file.name}：重复文件，已存在，未重复添加。已保留原文件“${files.get(hash)}”。`;notices.append(row);}else{files.set(hash,file.name);const row=document.createElement('div');row.className='file';row.textContent=file.name+' · 已添加（原型）';list.append(row);}}e.target.value='';});
</script></body></html>
