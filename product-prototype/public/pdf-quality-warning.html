<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF 材料清晰度提醒</title>
<style>:root{--muted:#6d766b;--green:#41583d}*{box-sizing:border-box}body{margin:0;padding:24px;background:#f7f8f2;color:#253021;font:14px/1.7 system-ui,sans-serif}main{max-width:760px;margin:32px auto}.panel{padding:24px;background:white;border:1px solid #dfe5da;border-radius:12px}h1{font-size:24px;margin:0 0 8px}h2{font-size:16px;margin:0 0 16px}.file{border:1px solid #dfe5da;border-radius:8px;padding:16px}.filename{font-weight:600;overflow-wrap:anywhere}p{margin:5px 0}.note{font-size:12px;color:#6d766b;margin-bottom:20px}.material-processing{margin-top:6px;overflow-wrap:anywhere}.processing-title{font-size:12px;font-weight:600;color:var(--muted)}.processing-hint{font-size:11px;color:var(--muted);line-height:1.7}.material-quality-warning{color:#786024}@media(max-width:600px){body{padding:16px}.panel{padding:16px}main{margin:12px auto}}</style></head>
<body><main><h1>项目材料</h1><p class="note">合成示例 · 提醒显示在现有文件处理状态下方</p><section class="panel"><h2>审计报告（可含报表及附注）</h2><div class="file"><p class="filename">合成审计报告.pdf</p><p class="note">服务器已确认保存</p><div id="status"><div class="material-processing" data-tone="pending"><p class="processing-title" role="status">处理中</p><p class="processing-hint">状态会自动更新，关闭页面不影响后台处理。</p><p class="processing-hint material-quality-warning" role="note">第 7 页扫描图片清晰度可能不足，可能影响文字和金额识别。建议更换电子原版，或使用 300 DPI 重新扫描；仅放大或重新保存不能恢复细节。清晰度检查尚未覆盖全文。</p></div></div></div></section></main></body></html>
