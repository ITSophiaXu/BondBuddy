<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BondBuddy · 项目交接局部原型 · #962</title><link rel="stylesheet" href="/src/project-assistant.css"><link rel="stylesheet" href="/src/assistant-page-context.css"><link rel="stylesheet" href="/src/upload-ux.css"><style>body{margin:0;background:#f7f8f3;font:14px/1.6 system-ui;color:#233c34}.prototype-app main{padding:42px}.prototype-app h1{font-size:24px}.prototype-app p{color:#728078}.ba-demo-message{margin:24px;color:#728078;font-size:13px}</style></head><body>
<div class="prototype-app"><div class="shell"><main><h1>合成乙项目 · 项目文件</h1><p>合成界面测试，不连接客户项目。</p></main></div></div>
<div class="bb-assistant ba-open"><section class="ba-panel" role="dialog" aria-label="BondBuddy"><header class="ba-header"><div class="ba-identity"><span class="ba-mark" data-icon="buddy"></span><div><strong>BondBuddy</strong><small>券商助手</small></div></div><div class="ba-toolbar"><button class="ba-icon-button" aria-label="新对话" data-icon="new"></button><button class="ba-icon-button" aria-label="最近对话" data-icon="history"></button><button class="ba-icon-button" aria-label="加宽侧栏" data-a="wide" data-icon="expand"></button><button class="ba-icon-button" aria-label="收起助手" data-icon="collapse"></button></div></header>
<div class="ba-context"><div class="ba-context-row"><button class="ba-project-button"><span data-icon="folder"></span><span>合成甲项目</span><span data-icon="chevron"></span></button><details class="ba-context-files"><summary><span data-icon="paperclip"></span>1 份材料</summary><ul><li>合成甲项目附件.txt</li></ul></details></div><label class="ba-baseline">讨论／修改的成果<select><option>第 3 版 · 清洁稿</option></select></label>
<div class="ba-page-handoff"><p>当前页面：<strong>合成乙项目</strong></p><p>本对话仍关联：<strong>合成甲项目</strong></p><button id="handoff">为“合成乙项目”开新对话</button><small>原对话的草稿、附件与成果选择保留，可在“最近对话”找回。</small></div></div>
<div class="ba-body"><div class="ba-timeline ba-empty"><div class="ba-welcome"><span class="ba-welcome-mark" data-icon="buddy"></span><h2>有什么可以帮你？</h2><p>讨论项目、完善文稿，或开始一项新任务。</p><div class="ba-shortcuts" id="shortcuts"></div></div></div></div>
<footer class="ba-composer"><div class="ba-send-context" aria-label="本次发送上下文"><span>发送至：<strong id="recipient">合成甲项目</strong></span><span id="basis">讨论依据：第 3 版 · 清洁稿</span></div><div class="ba-input-shell"><textarea rows="2" aria-label="发送给 BondBuddy">请只调整风险提示，不修改数字。</textarea><div class="ba-send-row"><label class="bb-upload-picker bb-upload-picker--compact ba-attach"><span data-icon="paperclip"></span><span>添加附件</span><input type="file" data-file="other" disabled></label><button class="ba-send" aria-label="发送消息" data-icon="send"></button></div></div><div class="ba-composer-hint">Enter 发送<span> · </span>Shift + Enter 换行</div></footer></section></div>
<script type="module">import {assistantIcon} from '/src/assistant-icons.ts';document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=assistantIcon(el.dataset.icon));document.querySelector('#shortcuts').innerHTML=[['update','更新募集书','更新内容，或继续修改已有成果'],['review','复核募集书','检查内容，梳理需要完善的地方'],['generation','生成项目材料','根据材料和要求，编制所需文书']].map(([icon,title,desc])=>`<button><span class="ba-shortcut-icon">${assistantIcon(icon)}</span><span><strong>${title}</strong><small>${desc}</small></span>${assistantIcon('arrow')}</button>`).join('');document.querySelector('#handoff').onclick=()=>{document.querySelector('#recipient').textContent='合成乙项目';document.querySelector('#basis').textContent='讨论依据：项目材料（未选成果）';document.querySelector('textarea').value='';document.querySelector('.ba-page-handoff').innerHTML='<p>合成演示：已为乙项目开新对话；原甲项目内容保留。无 API、任务或收费。</p>';};</script></body></html>
