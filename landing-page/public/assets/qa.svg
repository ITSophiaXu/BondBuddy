9476" font-weight="400" text-anchor="start">梳理项目进展</text><text x="258" y="392" font-size="9" fill="#a0ac93" font-weight="400" text-anchor="start">09/18 · 已完成</text><rect x="441" y="168" width="793" height="559" rx="10" fill="#fff" stroke="#e1e7d9"/><g transform="translate(464 188) scale(0.375)"><rect width="64" height="64" rx="18" fill="#173f35"/><path d="M18 15v32h16c19 0 19-22 2-22h-6v9h6c5 0 5 6 0 6H27V15z" fill="#d1ef9c"/><circle cx="44" cy="18" r="5" fill="#d1ef9c"/></g><text x="499" y="207" font-size="15" fill="#173e33" font-weight="600" text-anchor="start">BondBuddy</text><text x="872" y="206" font-size="10" fill="#86917e" font-weight="400" text-anchor="start">关联项目</text><rect x="933" y="185" width="279" height="32" rx="5" fill="#fafcf5" stroke="#e1e7d9"/><text x="945" y="206" font-size="11" fill="#819570" font-weight="400" text-anchor="start">产业集团 2026 年公司债  ⌄</text><path d="M464 235H1210" stroke="#e1e7d9"/><rect x="693" y="255" width="492" height="60" rx="8" fill="#edf3e4" stroke="#e3ebd8"/><text x="709" y="279" font-size="12" fill="#557444" font-weight="400" text-anchor="start">请结合项目材料，分析发行人的偿债能力，</text><text x="709" y="301" font-size="12" fill="#557444" font-weight="400" text-anchor="start">重点说明现金流、有息债务与需要关注的风险。</text><rect x="1195" y="256" width="24" height="24" rx="12" fill="#dfe8d3" stroke="none"/><text x="1207" y="273" font-size="10" fill="#677f54" font-weight="500" text-anchor="middle">我</text><g transform="translate(464 339) scale(0.40625)"><rect width="64" height="64" rx="18" fill="#173f35"/><path d="M18 15v32h16c19 0 19-22 2-22h-6v9h6c5 0 5 6 0 6H27V15z" fill="#d1ef9c"/><circle cx="44" cy="18" r="5" fill="#d1ef9c"/></g><text x="506" y="358" font-size="13" fill="#203b33" font-weight="500" text-anchor="start">可以从现金流、债务期限与偿债保障三个方面看。</text><text x="506" y="396" font-size="13" fill="#567a40" font-weight="600" text-anchor="start">01  经营活动现金流</text><text x="506" y="420" font-size="11" fill="#7d8d70" font-weight="400" text-anchor="start">对照现金流量表，结合回款变化分析经营现金流的持续性。</text><text x="506" y="454" font-size="13" fill="#567a40" font-weight="600" text-anchor="start">02  有息债务与到期分布</text><text x="506" y="478" font-size="11" fill="#7d8d70" font-weight="400" text-anchor="start">结合债务台账区分短期与长期债务，关注集中到期的偿付安排。</text><text x="506" y="512" font-size="13" fill="#567a40" font-weight="600" text-anchor="start">03  需要进一步核实</text><text x="506" y="536" font-size="11" fill="#7d8d70" font-weight="400" text-anchor="start">尚需补充授信使用情况及受限资金明细，以完善偿债保障分析。</text><rect x="506" y="551" width="164" height="25" rx="5" fill="#f0f4e8" stroke="#f0f4e8"/><text x="515" y="568" font-size="11" fill="#8c9c7b" font-weight="400" text-anchor="start">依据：项目财务报表</text><rect x="680" y="551" width="139" height="25" rx="5" fill="#f0f4e8" stroke="#f0f4e8"/><text x="689" y="568" font-size="11" fill="#8c9c7b" font-weight="400" text-anchor="start">依据：债务台账</text><text x="466" y="616" font-size="11" fill="#5b764a" font-weight="550" text-anchor="start">继续对话</text><rect x="463" y="630" width="749" height="77" rx="8" fill="#fff" stroke="#a8b897"/><text x="478" y="655" font-size="11" fill="#a0ac93" font-weight="400" text-anchor="start">继续问一个问题…</text><g transform="translate(478 676) scale(0.6666666666666666)" fill="none" stroke="#6f8b59" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12l7-7a4 4 0 1 1 6 6L10 22a6 6 0 0 1-8-8L13 3 M6 16l9-9a1.5 1.5 0 1 1 2 2l-9 9"/></g><text x="501" y="689" font-size="10" fill="#849774" font-weight="400" text-anchor="start">添加材料</text><text x="991" y="689" font-size="9" fill="#9aa78c" font-weight="400" text-anchor="start">剩余 998 次问答</text><rect x="1116" y="665" width="81" height="38" rx="6" fill="#173e33" stroke="#173e33"/><text x="1156.5" y="689" font-size="12" fill="#fff" font-weight="500" text-anchor="middle">发送 →</text><text x="1248" y="762" font-size="9" fill="#a6ad9a" font-weight="400" text-anchor="end">产品界面示意 · 演示数据</text></svg>