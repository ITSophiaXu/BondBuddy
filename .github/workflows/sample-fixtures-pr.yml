name: Authorized sample fixture integrity

on:
  pull_request:
    branches: [develop, master]
    paths:
      - '.gitattributes'
      - 'tests/samples/**'
      - '.github/workflows/sample-fixtures-pr.yml'

permissions:
  contents: read

jobs:
  sample-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Validate authorized bytes, case inputs and offline preparation safeguards
        run: |
          python tests/samples/verify.py
          python -m unittest discover -s tests/samples -p test_regression_pack.py -v
