name: M2 fixed credits integration

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: m2-credits-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fixed-credits-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BB_TEST_DATABASE_URL: postgresql://bondbuddy:synthetic-ci-only@127.0.0.1:5432/bb_m2_credits
      BB_TEST_AZURITE_CONNECTION_STRING: UseDevelopmentStorage=true
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_USER: bondbuddy
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: bb_m2_credits
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bondbuddy -d bb_m2_credits"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14.0'
          cache: npm
      - name: Build and check public contracts
        run: |
          npm ci
          npm run build
          npm run check:contracts
      - name: Start isolated synthetic storage and migrate
        run: |
          docker run --detach --name bb-m2-azurite --publish 127.0.0.1:10000:10000 \
            mcr.microsoft.com/azure-storage/azurite:3.35.0 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --disableProductStyleUrl
          node --input-type=module <<'JS'
          import { BlobServiceClient } from '@azure/storage-blob';
          const container = BlobServiceClient.fromConnectionString(process.env.BB_TEST_AZURITE_CONNECTION_STRING).getContainerClient('bb-m2-readiness');
          for (let i = 0; ; i++) {
            try { await container.createIfNotExists(); await container.deleteIfExists(); break; }
            catch (error) { if (i >= 29) throw error; await new Promise(resolve => setTimeout(resolve, 1000)); }
          }
          JS
          DATABASE_URL="$BB_TEST_DATABASE_URL" node db/migrate.mjs
      - name: Fixed pricing, ledger, synthetic signed payments and durable worker regression
        run: |
          node --test --test-concurrency=1 \
            packages/contracts/dist/source-prospectus.test.js \
            packages/contracts/dist/signature-assessment.test.js \
            apps/api/dist/billing-classification.test.js \
            apps/api/dist/credit-history.test.js \
            apps/api/dist/billing.pg.test.js \
            apps/api/dist/authoring-progress.pg.test.js \
            apps/api/dist/queue.test.js \
            apps/api/dist/review-billing.pg.test.js \
            apps/api/dist/review-price-activation.pg.test.js \
            apps/api/dist/payments.pg.test.js \
            apps/api/dist/upload-safety.test.js \
            apps/api/dist/original-material-upload.test.js \
            apps/api/dist/upload-spool.test.js \
            apps/worker/dist/m2-paid-worker.test.js \
            apps/worker/dist/authoring-action-progress.test.js \
            apps/worker/dist/authoring-pause.pg.test.js \
            apps/worker/dist/provider-reconciliation.test.js \
            apps/api/dist/generated-word-delivery.test.js
