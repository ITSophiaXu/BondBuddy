name: Prospectus release quality

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  merge_group:

permissions:
  contents: read

concurrency:
  group: prospectus-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prospectus-quality:
    name: prospectus-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BB_TEST_DATABASE_URL: postgresql://bondbuddy:synthetic-quality-only@127.0.0.1:5432/bb_prospectus_quality
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_USER: bondbuddy
          POSTGRES_PASSWORD: synthetic-quality-only
          POSTGRES_DB: bb_prospectus_quality
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bondbuddy -d bb_prospectus_quality"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact candidate tree including authorized fixtures
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.11'
      - name: Install build, Word and rendering dependencies
        run: |
          npm ci --no-audit --no-fund
          python -m pip install -r python/requirements-dev.txt
          python -m pip check
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-noto-cjk ripgrep
          echo "BONDBUDDY_TEST_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      # No acceptance evidence is embedded in the repository or public artifacts.
      # Missing private real-model acceptance must fail, never silently skip.
      - name: Require mechanical regressions and current real-model golden-case acceptance
        run: node scripts/prospectus-quality-gate.mjs run .local/prospectus-quality.json
      - name: Retain passing evidence for this commit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prospectus-quality-${{ github.sha }}
          path: |
            .local/prospectus-quality.json
            .local/prospectus-quality-logs/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: Retain failure logs without creating passing evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prospectus-quality-failed-${{ github.sha }}
          path: .local/prospectus-quality-logs/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
