name: M3 CLI review integration

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: m3-cli-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cli-review-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BB_TEST_DATABASE_URL: postgresql://bondbuddy:synthetic-ci-only@127.0.0.1:5432/bb_m3_cli
      BB_TEST_AZURITE_CONNECTION_STRING: UseDevelopmentStorage=true
      BB_REVIEW_WEB_SEARCH_ENABLED: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_USER: bondbuddy
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: bb_m3_cli
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bondbuddy -d bb_m3_cli"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14.0'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.11'
      - name: Install dependencies and build all workspaces
        run: |
          npm ci
          python -m pip install -r python/requirements-dev.txt
          python -m pip check
          echo "BONDBUDDY_TEST_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "BONDBUDDY_WORD_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "BB_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/python:$GITHUB_WORKSPACE/python/tests" >> "$GITHUB_ENV"
          npm run build
          npm run check:contracts
          command -v flock
      - name: Start synthetic Blob service and migrate private test database
        run: |
          docker run --detach --name bb-m3-cli-azurite --publish 127.0.0.1:10000:10000 \
            mcr.microsoft.com/azure-storage/azurite:3.35.0 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --disableProductStyleUrl
          node --input-type=module <<'JS'
          import { BlobServiceClient } from '@azure/storage-blob';
          const container = BlobServiceClient.fromConnectionString(process.env.BB_TEST_AZURITE_CONNECTION_STRING).getContainerClient('bb-cli-readiness');
          for (let i = 0; ; i++) {
            try { await container.createIfNotExists(); await container.deleteIfExists(); break; }
            catch (error) { if (i >= 29) throw error; await new Promise(resolve => setTimeout(resolve, 1000)); }
          }
          JS
          DATABASE_URL="$BB_TEST_DATABASE_URL" node db/migrate.mjs
      - name: CLI tools, durable replay, differential review and real Word downloads
        run: |
          node --test --test-concurrency=1 --test-reporter=tap \
            apps/worker/dist/review-*.test.js \
            apps/worker/dist/m3-review-*.test.js \
            apps/worker/dist/authoring-material-tools.test.js \
            apps/worker/dist/codex-adapter.test.js \
            apps/worker/dist/codex-durable.test.js \
            apps/worker/dist/model-generation-router.test.js \
            apps/api/dist/review-workspace.test.js \
            packages/domain/dist/review-*.test.js \
            packages/domain/dist/audit-reconciliation-knowledge.test.js \
            | tee "$RUNNER_TEMP/m3-cli-review.tap"
          if grep -Eq '^# (skipped|todo) [1-9][0-9]*$' "$RUNNER_TEMP/m3-cli-review.tap"; then
            echo 'Required CLI review integration tests were skipped or left TODO.' >&2
            exit 1
          fi
          grep -Eq '^# tests [1-9][0-9]*$' "$RUNNER_TEMP/m3-cli-review.tap"
      - name: Native Word and parser regressions
        run: python -m unittest -v test_document_parser test_review_word test_unified_word test_word_delivery
      - name: Stop private Blob test service
        if: always()
        run: |
          if docker container inspect bb-m3-cli-azurite >/dev/null 2>&1; then
            docker rm --force bb-m3-cli-azurite
          fi
