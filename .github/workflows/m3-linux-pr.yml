name: M3 Linux integration

on:
  pull_request:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: m3-linux-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  linux-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      # Disposable service credentials, never a production database or provider key.
      BB_TEST_DATABASE_URL: postgresql://bondbuddy:synthetic-ci-only@127.0.0.1:5432/bb_m3_ci
      BB_TEST_AZURITE_CONNECTION_STRING: UseDevelopmentStorage=true
      BB_TEST_LIVE_AUTHORING: '0'
      BB_REVIEW_WEB_SEARCH_ENABLED: '0'
      # Already-authorized repository fixtures; supplier responses remain synthetic.
      BB_RUN_AUTHORIZED_LARGE_XLSX: '1'
      BB_RUN_AUTHORIZED_SAMPLE_TESTS: '1'
      BB_RUN_AUTHORIZED_RQ_ANNUAL_FACT_TESTS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_USER: bondbuddy
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: bb_m3_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bondbuddy -d bb_m3_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out the complete PR merge tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # No sparse checkout: unified authoring loads pinned knowledge Markdown.

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.14.0'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.11'

      - name: Install locked JavaScript and pinned Python dependencies
        run: |
          npm ci
          python -m pip install --only-binary=:all: pip==25.0.1
          cat > "$RUNNER_TEMP/bb-python-constraints.txt" <<'EOF'
          python-docx==1.2.0
          lxml==6.1.1
          typing_extensions==4.16.0
          pdfplumber==0.11.9
          pdfminer.six==20251230
          pypdfium2==5.13.0
          Pillow==12.3.0
          openpyxl==3.1.5
          et-xmlfile==2.0.0
          pypdf==6.10.0
          numpy==2.3.5
          reportlab==4.4.9
          charset-normalizer==3.5.1
          cryptography==50.0.1
          cffi==2.1.1
          pycparser==3.0
          EOF
          python -m pip install --only-binary=:all: -r python/requirements-dev.txt -c "$RUNNER_TEMP/bb-python-constraints.txt"
          python -m pip check
          python -m pip freeze
          echo "BB_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "BONDBUDDY_TEST_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "BONDBUDDY_WORD_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/python:$GITHUB_WORKSPACE/python/tests" >> "$GITHUB_ENV"
          command -v flock
          test -x apps/worker/test-fixtures/codex/fake-codex.mjs

      - name: Build and check shared contracts
        run: |
          npm run build
          npm run check:contracts

      - name: Start disposable Azurite
        run: |
          docker run --detach --name bb-m3-azurite --publish 127.0.0.1:10000:10000 \
            mcr.microsoft.com/azure-storage/azurite:3.35.0 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --disableProductStyleUrl
          node --input-type=module <<'JS'
          import { BlobServiceClient } from '@azure/storage-blob';
          const container = BlobServiceClient.fromConnectionString(process.env.BB_TEST_AZURITE_CONNECTION_STRING).getContainerClient('bb-ci-readiness');
          for (let attempt = 0; ; attempt++) {
            try { await container.createIfNotExists(); await container.deleteIfExists(); break; }
            catch (error) { if (attempt >= 29) throw error; await new Promise(resolve => setTimeout(resolve, 1000)); }
          }
          JS

      - name: Migrate the isolated synthetic template
        run: |
          DATABASE_URL="$BB_TEST_DATABASE_URL" node db/migrate.mjs
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { access } from 'node:fs/promises';
          import { Pool } from 'pg';
          assert.equal(process.platform, 'linux');
          assert.equal(process.env.BB_PYTHON, process.env.BONDBUDDY_TEST_PYTHON);
          await access(process.env.BB_PYTHON);
          const pool = new Pool({ connectionString: process.env.BB_TEST_DATABASE_URL });
          try {
            const role = (await pool.query('SELECT rolcreatedb FROM pg_roles WHERE rolname=current_user')).rows[0];
            assert.equal(role.rolcreatedb, true, 'test suites must clone private databases');
            for (const filename of ['0084_m3_review_workspace.sql', '0085_m3_review_assistant.sql', '0086_m3_project_run_mutex.sql'])
              assert.equal((await pool.query('SELECT 1 FROM bb_schema_migrations WHERE filename=$1', [filename])).rowCount, 1, filename);
          } finally { await pool.end(); }
          JS

      - name: Linux runtime, shared worker and M3 targeted integration
        run: |
          node --test --test-concurrency=1 --test-reporter=tap \
            apps/worker/dist/runtime-entry.test.js \
            apps/worker/dist/run-runtime.test.js \
            apps/worker/dist/runtime-parse-slots.test.js \
            apps/worker/dist/parse-staging.test.js \
            apps/worker/dist/document-parser.test.js \
            apps/worker/dist/document-parser-csv.test.js \
            apps/worker/dist/fact-evidence-context-repository.test.js \
            apps/worker/dist/native-financial-fact-extractor.test.js \
            apps/worker/dist/rq-prospectus-annual-fact-extractor.test.js \
            apps/worker/dist/rq-q3-formula-candidate-extractor.test.js \
            apps/worker/dist/authoring-material-tools.test.js \
            apps/worker/dist/codex-adapter.test.js \
            apps/worker/dist/codex-probe-cli.test.js \
            apps/worker/dist/codex-durable.test.js \
            apps/worker/dist/model-generation-router.test.js \
            apps/worker/dist/unified-model-stage.test.js \
            apps/worker/dist/unified-authoring.pg.test.js \
            apps/worker/dist/unified-timeout-recovery.test.js \
            apps/worker/dist/review-anchor-mapping.test.js \
            apps/worker/dist/review-assistant.test.js \
            apps/worker/dist/review-action-progress.test.js \
            apps/worker/dist/review-formatting-context.test.js \
            apps/worker/dist/review-native-formulas.test.js \
            apps/worker/dist/review-record-context.test.js \
            apps/worker/dist/review-rule-context.test.js \
            apps/worker/dist/review-model-stage.test.js \
            apps/worker/dist/review-tools-async.test.js \
            apps/worker/dist/review-cancellation.test.js \
            apps/worker/dist/review-web-search-locks.pg.integration.test.js \
            apps/worker/dist/review-public-stage.test.js \
            apps/worker/dist/review-revision.test.js \
            apps/worker/dist/m3-review-pipeline.pg.integration.test.js \
            apps/api/dist/review-workspace.test.js \
            apps/api/dist/provider-result-validation.test.js \
            apps/api/dist/provider-runtime-locks.pg.integration.test.js \
            apps/api/dist/review-action-events.pg.integration.test.js \
            apps/api/dist/run-event-dto.test.js \
            apps/api/dist/zz_trial_guard.test.js \
            packages/domain/dist/review-evidence.test.js \
            packages/domain/dist/review-financial-context.test.js \
            packages/domain/dist/review-financial-checks.test.js \
            packages/domain/dist/review-compliance-checks.test.js \
            | tee "$RUNNER_TEMP/bb-m3-linux.tap"
          if grep -Eq '^# (skipped|todo) [1-9][0-9]*$' "$RUNNER_TEMP/bb-m3-linux.tap"; then
            echo 'Required Linux integration tests were skipped or left TODO.' >&2
            exit 1
          fi
          grep -Eq '^# tests [1-9][0-9]*$' "$RUNNER_TEMP/bb-m3-linux.tap"

      - name: Python native parser, Word delivery and revision regressions
        run: |
          python -m unittest -v test_document_parser test_review_word test_unified_word test_word_delivery 2>&1 | tee "$RUNNER_TEMP/bb-m3-python.log"
          if grep -Eq 'OK \(skipped=[1-9][0-9]*\)' "$RUNNER_TEMP/bb-m3-python.log"; then
            echo 'Required Python tests were skipped.' >&2
            exit 1
          fi

      - name: Stop disposable Azurite
        if: always()
        run: |
          if docker container inspect bb-m3-azurite >/dev/null 2>&1; then
            docker rm --force bb-m3-azurite
          fi
