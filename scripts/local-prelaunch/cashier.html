<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BondBuddy 本地模拟收银台</title><link rel="stylesheet" href="/__prelaunch/local.css"><script src="/__prelaunch/checkout.js" type="module"></script></head><body class="prelaunch-cashier"><main>
