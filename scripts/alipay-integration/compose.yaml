services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bondbuddy_alipay_local
      POSTGRES_PASSWORD: local-sandbox-only
      POSTGRES_DB: bb_alipay_acceptance
    ports:
      - '127.0.0.1:55449:5432'
    volumes:
      - alipay_acceptance_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bondbuddy_alipay_local -d bb_alipay_acceptance']
      interval: 2s
      timeout: 2s
      retries: 20
    labels:
      com.bondbuddy.purpose: local-alipay-sandbox-acceptance
volumes:
  alipay_acceptance_data:
