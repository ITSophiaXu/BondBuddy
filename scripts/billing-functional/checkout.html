<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BondBuddy 模拟收银台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#18253c;font:16px/1.6 system-ui,-apple-system,"Microsoft YaHei",sans-serif}main{max-width:920px;margin:36px auto;padding:0 24px}h1{font-size:28px}h2{font-size:21px}h3{font-size:18px}a{color:#224ca5}p{margin:10px 0}.notice{background:#fff1a6;border:1px solid #d9b94d;padding:18px;border-radius:12px}section{margin-top:22px;padding:24px;border:1px solid #dce3ef;border-radius:12px;background:white}.bar,.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.bar{justify-content:space-between}button,.button{display:inline-block;font:inherit;padding:10px 16px;border:1px solid #b9c6dc;border-radius:8px;background:white;color:#18253c;text-decoration:none;cursor:pointer}button.primary,.button.primary{background:#224ca5;color:white;border-color:#224ca5}button.danger{color:#981e1e}button:disabled{opacity:.45;cursor:default}input,select{font:inherit;padding:10px;border:1px solid #9aabc6;border-radius:7px;max-width:100%}label{display:block;margin:12px 0}label input,label select{display:block;margin-top:6px}.muted{color:#52627c;font-size:14px}.amount{font-size:34px;font-weight:700}.error{background:#fff0ef;border:1px solid #d97c75;color:#891c14;white-space:pre-wrap;padding:14px;border-radius:8px}.status{background:#edf4ff;padding:14px;border-radius:8px}dl{display:grid;grid-template-columns:145px 1fr;gap:8px}dt{color:#52627c}dd{margin:0;overflow-wrap:anywhere}.refund{border-top:1px solid #dce3ef;margin-top:18px;padding-top:15px}.refund-form{border:1px solid #dce3ef;padding:16px;border-radius:8px}[hidden]{display:none!important}:focus-visible{outline:3px solid #5b86d3;outline-offset:3px}
</style></head><body><main>
<div class="bar"><h1>模拟收银台</h1><a href="/__billing-test">返回计费测试台</a></div>
<div class="notice"><strong>本地测试，不扣真钱。</strong><p>你选择的支付与退款结果是合成渠道回执。到账、扣款、冻结及退款仍由产品真实 API 和独立 PostgreSQL 账本处理。刷新不会替你支付。</p></div>
<p id="identity" role="status">正在核实真实登录状态…</p><p id="error" class="error" role="alert" hidden></p><p id="message" class="status" role="status" aria-live="polite" hidden></p>
<section id="checkout" aria-labelledby="checkout-title"><h2 id="checkout-title">读取原订单</h2><p>正在核实本账号订单…</p></section>
<section id="refunds" aria-labelledby="refund-title" hidden></section>
<div class="actions" style="margin-top:24px"><button type="button" id="reload-state">刷新测试账本</button><a id="return-account" class="button" href="/#/account">返回原付款</a></div>
</main><script type="module" src="/__billing-test/checkout.js"></script></body></html>
